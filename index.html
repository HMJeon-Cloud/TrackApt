<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="TrackApt — KB 시계열로 보는 전국 아파트 가격 서열과 투자 타이밍">
<title>TrackApt</title>
<meta name="theme-color" content="#0f4c5c">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f4c5c'/%3E%3Cpath d='M14 22h36M32 22v24' stroke='%23fff' stroke-width='7' stroke-linecap='round'/%3E%3Ccircle cx='46' cy='44' r='6' fill='%23e2571b'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#f7f8fa; --panel:#ffffff; --ink:#1c2430; --ink-soft:#5b6675;
  --line:#e3e7ee; --brand:#0f4c5c; --up:#0e7c66; --down:#c47f17;
  --miss:#98a1ad; --cash:#e2571b; --radius:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px}
body{font-family:"Pretendard Variable",Pretendard,-apple-system,system-ui,sans-serif;
  background:var(--bg);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased}
header{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line);
  padding:calc(env(safe-area-inset-top) + 10px) 16px 0}
.brand{display:flex;align-items:baseline;gap:8px;padding-bottom:8px}
.brand h1{font-size:1.15rem;font-weight:800;letter-spacing:-.02em}
.brand h1 .accent{color:var(--brand)}
.brand .ver{font-size:.72rem;color:var(--ink-soft);font-weight:600}
nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:none;border:1px solid var(--line);background:var(--bg);color:var(--ink-soft);
  font:inherit;font-size:.82rem;font-weight:600;padding:7px 13px;border-radius:999px;cursor:pointer;white-space:nowrap}
nav button.on{background:var(--brand);border-color:var(--brand);color:#fff}
nav#subnav{padding-bottom:10px}
nav#subnav button{border-color:transparent;background:transparent;padding:6px 11px;font-size:.8rem}
nav#subnav button.on{background:var(--ink);border-color:var(--ink);color:#fff}
nav#nav button.cart{border-color:var(--cash);color:var(--cash);background:#fff}
nav#nav button.cart.on{background:var(--cash);border-color:var(--cash);color:#fff}
nav#nav button .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--cash);margin-left:5px;vertical-align:1px}
nav#nav button.on .dot{background:#fff}
nav button:focus-visible,.seg button:focus-visible{outline:2px solid var(--cash);outline-offset:2px}
main{max-width:860px;margin:0 auto;padding:16px 16px calc(env(safe-area-inset-bottom) + 48px)}
section.tab{display:none} section.tab.on{display:block}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px 16px;margin-bottom:14px}
.card h2{font-size:1rem;font-weight:800;letter-spacing:-.01em;margin-bottom:4px}
.card .eyebrow{font-size:.68rem;font-weight:700;letter-spacing:.14em;color:var(--brand);text-transform:uppercase;margin-bottom:6px}
.card p.desc{font-size:.85rem;color:var(--ink-soft);margin-bottom:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px 12px}
.field{display:flex;flex-direction:column;gap:4px}
.field.full{grid-column:1 / -1}
.field label{font-size:.76rem;font-weight:700;color:var(--ink-soft)}
.field input,.field select,.field textarea{font:inherit;font-size:.92rem;padding:9px 10px;border:1px solid var(--line);
  border-radius:8px;background:#fff;color:var(--ink);width:100%}
.field textarea{min-height:120px;line-height:1.6;font-size:.84rem}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--brand);outline-offset:-1px;border-color:var(--brand)}
.check{display:flex;align-items:center;gap:8px;font-size:.88rem;font-weight:600}
.check input{width:18px;height:18px;accent-color:var(--brand)}
.btn{font:inherit;font-weight:700;font-size:.92rem;border:0;border-radius:10px;padding:12px 16px;
  cursor:pointer;background:var(--brand);color:#fff;width:100%}
.btn.ghost{background:#fff;color:var(--brand);border:1.5px solid var(--brand)}
.btnrow{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.gstep{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:8px;cursor:pointer}
.gstep:hover{border-color:var(--brand)}
.gstep .no{font-size:1.2rem;font-weight:800;color:var(--brand);min-width:26px;text-align:center}
.gstep .t{font-weight:800;font-size:.92rem}
.gstep .d{font-size:.8rem;color:var(--ink-soft);margin-top:2px;line-height:1.5}
.stepbar{display:flex;align-items:center;gap:8px;background:#eef4f5;border:1px solid var(--line);
  border-left:4px solid var(--brand);border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:.82rem}
.stepbar .lbl{font-weight:700;color:var(--brand);flex:1;min-width:0}
.stepbar .lbl small{display:block;color:var(--ink-soft);font-weight:600;font-size:.74rem;margin-top:1px}
.stepbar button{flex:none}
.picker{border:1px solid var(--line);border-radius:10px;max-height:300px;overflow-y:auto;background:#fff}
.pgroup{border-bottom:1px solid var(--line)}
.pgroup:last-child{border-bottom:0}
.phead{display:flex;align-items:center;gap:8px;padding:9px 12px;background:var(--bg);cursor:pointer;font-weight:700;font-size:.86rem}
.phead .cnt{margin-left:auto;font-size:.72rem;color:var(--ink-soft);font-weight:600}
.phead .arw{font-size:.7rem;color:var(--ink-soft)}
.pbody{display:none;padding:6px 12px 10px;flex-wrap:wrap;gap:5px}
.pgroup.open .pbody{display:flex}
.pitem{font-size:.78rem;font-weight:600;border:1px solid var(--line);border-radius:6px;padding:4px 9px;cursor:pointer;background:#fff;color:var(--ink-soft)}
.pitem.on{background:var(--brand);border-color:var(--brand);color:#fff}
.chosen{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.chosen .tag{font-size:.74rem;font-weight:700;background:#e4f3ef;color:var(--up);border-radius:6px;padding:3px 8px}
.dict{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dict .di{background:var(--bg);border-radius:8px;padding:10px 12px}
.dict .di b{font-size:.84rem}
.dict .di p{font-size:.76rem;color:var(--ink-soft);margin-top:3px;line-height:1.55}
@media (max-width:560px){ .dict{grid-template-columns:1fr} }
.hint{font-size:.76rem;color:var(--ink-soft);margin-top:8px}
.status{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:var(--bg);border-radius:8px;padding:10px 12px}
.stat .k{font-size:.72rem;color:var(--ink-soft);font-weight:600}
.stat .v{font-size:1.05rem;font-weight:800;letter-spacing:-.01em}
.stat .v.up{color:var(--up)} .stat .v.down{color:var(--down)}
.badge{display:inline-block;font-size:.7rem;font-weight:700;padding:2px 8px;border-radius:999px}
.badge.ok{background:#e4f3ef;color:var(--up)} .badge.err{background:#fbeee0;color:var(--down)}
.placeholder{border:1.5px dashed var(--line);border-radius:var(--radius);padding:28px 16px;
  text-align:center;color:var(--miss);font-size:.85rem;margin-bottom:14px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{font:inherit;font-size:.8rem;font-weight:600;padding:7px 12px;border:0;background:#fff;
  color:var(--ink-soft);cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--brand);color:#fff}
.chartbox{position:relative;height:280px}
.tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:.84rem;white-space:nowrap}
th{font-size:.74rem;color:var(--ink-soft);font-weight:700;text-align:right;padding:7px 10px;border-bottom:1.5px solid var(--line)}
th:first-child,td:first-child{text-align:left}
th:nth-child(2),td:nth-child(2){text-align:left}
td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
td.up{color:var(--up);font-weight:600} td.down{color:var(--down);font-weight:600} td.flat{color:var(--miss)}
tr.hit td{background:#f0f8f5}
tr.hit td:first-child{border-left:3px solid var(--up)}
tr:last-child td{border-bottom:0}
.note{background:var(--bg);border-radius:8px;padding:12px;font-size:.8rem;color:var(--ink-soft);margin-top:12px;line-height:1.6}
.note b{color:var(--ink)}
.callout{border-left:4px solid var(--up);background:#f0f8f5;border-radius:8px;padding:12px 14px;
  font-size:.9rem;margin-bottom:12px;line-height:1.6}
.callout.warn{border-color:var(--down);background:#fbf4e8}
.callout b{font-weight:800}
.btn.sm{width:auto;padding:6px 10px;font-size:.76rem;border-radius:7px}
.expbar{display:flex;gap:8px;margin:8px 0 10px}
.capturing .expbar,.capturing button{display:none!important}
.bb{position:relative;display:inline-block;width:70px;height:8px;vertical-align:middle;margin-right:6px}
.bbtrack{position:absolute;inset:0;border-radius:4px;opacity:.5}
.bbtick{position:absolute;top:-2.5px;width:3px;height:13px;background:var(--ink);border-radius:2px;transform:translateX(-50%)}
.bbv{font-size:.78rem;font-variant-numeric:tabular-nums}
.axis{display:flex;align-items:center;gap:8px;margin-top:5px;font-size:.76rem}
.axis .axname{width:52px;color:var(--ink-soft);font-weight:700;flex:none}
.axis .axtrack{flex:1;height:7px;background:var(--bg);border-radius:4px;overflow:hidden}
.axis .axfill{height:100%;border-radius:4px;background:var(--up)}
.axis b{width:26px;text-align:right;flex:none}
.axis small{color:var(--ink-soft);flex:none;max-width:44%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tagmini{display:inline-block;font-size:.66rem;font-weight:700;padding:1px 6px;border-radius:5px;margin-left:4px;vertical-align:1px}
.tagmini.ok{background:#e4f3ef;color:var(--up)} .tagmini.no{background:#f1f3f6;color:var(--miss)}
.grade{font-size:1.5rem;font-weight:800;min-width:44px;text-align:center;border-radius:10px;padding:6px 0}
.grade.A{background:#e4f3ef;color:var(--up)} .grade.B{background:#eaf2f4;color:var(--brand)}
.grade.C{background:#fbf4e8;color:var(--down)} .grade.D{background:#f1f3f6;color:var(--miss)}
.btn.sm.ghost{border-width:1px}
.rowinfo{font-size:.74rem;color:var(--ink-soft);background:var(--bg);border-radius:6px;padding:6px 8px;margin-top:4px;line-height:1.5}
.reco{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:8px}
.reco.best{border-color:var(--up);background:#f0f8f5}
.reco .no{font-size:1.3rem;font-weight:800;color:var(--brand);min-width:28px;text-align:center}
.reco .body{flex:1;min-width:0}
.reco .name{font-weight:800;font-size:.95rem}
.reco .chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.chip{font-size:.68rem;font-weight:700;background:var(--bg);border-radius:5px;padding:2px 6px;color:var(--ink-soft)}
.chip b{color:var(--ink)}
.reco .money{text-align:right;white-space:nowrap}
.reco .money .score{font-size:1.15rem;font-weight:800;color:var(--brand)}
.reco .money .need{font-size:.78rem;color:var(--ink-soft);margin-top:2px}
@media (max-width:480px){ html{font-size:15px} .chartbox{height:240px} .grid3{grid-template-columns:1fr 1fr} }
@media (prefers-reduced-motion:reduce){ *{transition:none!important;animation:none!important} }
</style>
</head>
<body>

<header>
  <div class="brand">
    <h1>Track<span class="accent">Apt</span></h1>
    <span class="ver">v2.3</span>
    <span class="ver" id="datainfo" style="margin-left:auto;font-size:.68rem"></span>
  </div>
  <nav id="nav" aria-label="주요 메뉴"></nav>
  <nav id="subnav" aria-label="하위 메뉴"></nav>
</header>

<div id="condbar" style="max-width:860px;margin:0 auto;padding:10px 16px 0;font-size:.78rem;color:var(--ink-soft);cursor:pointer" title="시작 탭으로 이동"></div>
<main id="main"></main>

<footer style="max-width:860px;margin:0 auto;padding:0 16px 40px;font-size:.72rem;color:var(--miss);line-height:1.7">
  TrackApt는 KB부동산 월간 시계열 등 공개 통계를 계산해 보여주는 정보 제공 도구이며 투자 자문이 아닙니다.
  통계는 표본조사 기반이라 실제 거래가와 다를 수 있고, 대출·세금 규정은 수시로 바뀝니다.
  실행 전 반드시 은행·세무 전문가와 확인하세요. 모든 판단의 책임은 이용자 본인에게 있습니다.
</footer>

<script>
"use strict";

var DB = null;
var LS_COND = "trackapt_cond_v1";
var LS_RULES = "trackapt_rules_v1";
var MK = { region: "전국", span: "all" };
var GAP = { region: "" };
var MOVE = { target: "" };
var chartAnnual = null, chartIndex = null, chartRank = null, chartGap = null, chartMove = null;
var RANKED = [];   // 급지표 대상 지역 키 (서열 내림차순)
var METRO = {};    // 수도권 여부

/* ── 대출·세금 기준 기본값 (기준·설정 탭에서 수정 가능) ── */
var DEFAULT_RULES = {
  ltvReg: 40,          // 규제지역 LTV %
  ltvFree: 70,         // 비규제지역 LTV %
  ltvFirstLocal: 80,   // 생애최초 · 비수도권 LTV %
  ltvMulti: 60,        // 추가매수 · 비규제 LTV % (수도권·규제는 0)
  capT1: 60000, capT1Lim: 150000,   // 15억 이하 → 상한 6억
  capT2: 40000, capT2Lim: 250000,   // 15~25억 → 상한 4억
  capT3: 20000,                      // 25억 초과 → 상한 2억
  dsr: 40,             // DSR %
  stress: 1.5,         // 스트레스 가산 %p
  loanYears: 30,       // 대출 만기 (년)
  acq2Reg: 8,          // 조정지역 2주택 취득세 %
  acq3Reg: 12,         // 조정지역 3주택 이상 취득세 %
  wRank: 35, wPerf: 25, wSupply: 15, wTiming: 15, wCash: 10,   // 추천 가중치
  broker: 0.4,         // 중개보수 요율 %
  etcRate: 0.3,        // 등기 등 부대비용 요율 %
  etcFixed: 300,       // 이사 등 고정비 (만원)
  regulated: [
    "강북14개구|강북구","강북14개구|광진구","강북14개구|노원구","강북14개구|도봉구",
    "강북14개구|동대문구","강북14개구|마포구","강북14개구|서대문구","강북14개구|성동구",
    "강북14개구|성북구","강북14개구|용산구","강북14개구|은평구","강북14개구|종로구",
    "강북14개구|중구","강북14개구|중랑구",
    "강남11개구|강남구","강남11개구|강동구","강남11개구|강서구","강남11개구|관악구",
    "강남11개구|구로구","강남11개구|금천구","강남11개구|동작구","강남11개구|서초구",
    "강남11개구|송파구","강남11개구|양천구","강남11개구|영등포구",
    "과천시","광명시","성남시|분당구","성남시|수정구","성남시|중원구",
    "수원시|영통구","수원시|장안구","수원시|팔달구","안양시|동안구",
    "용인시|수지구","의왕시","하남시"
  ]
};
var RULES = JSON.parse(JSON.stringify(DEFAULT_RULES));

var GROUPS = [
  { id: "g1", name: "시작하기", tabs: [
    { id: "start",   name: "내 조건",     build: buildStart },
    { id: "reco",    name: "추천 받기",   build: buildReco },
    { id: "guide",   name: "사용법",      build: buildGuide } ] },
  { id: "g2", name: "시장 공부", tabs: [
    { id: "market",  name: "시장 흐름",   build: buildMarket },
    { id: "vol",     name: "거래량",      build: buildVol },
    { id: "quad",    name: "매매·전세 흐름", build: buildQuad },
    { id: "supply",  name: "입주 물량",   build: buildSupply },
    { id: "btest",   name: "과거 검증",   build: buildBtest } ] },
  { id: "g3", name: "어디를 살까", tabs: [
    { id: "rank",    name: "지역 순위",   build: buildRank },
    { id: "mapx",    name: "지도로 보기", build: buildMapx },
    { id: "gap",     name: "전세 끼고 사기", build: buildGap },
    { id: "move",    name: "갈아타기",    build: buildMove },
    { id: "rota",    name: "다음 오를 곳", build: buildRota } ] },
  { id: "g4", name: "어떤 아파트", tabs: [
    { id: "flag",    name: "지역 1등 아파트", build: buildFlag },
    { id: "danji",   name: "아파트 찾기", build: buildDanji },
    { id: "cmpx",    name: "아파트 비교", build: buildCmpx } ] },
  { id: "g5", name: "돈·설정", tabs: [
    { id: "calc",    name: "돈 계산",     build: buildCalc },
    { id: "setting", name: "설정",        build: buildSetting } ] },
  { id: "g6", name: "내 후보", cart: true, tabs: [
    { id: "cart",    name: "최종 검토",   build: buildCartTab } ] }
];
var TABS = [];
GROUPS.forEach(function (g) { g.tabs.forEach(function (t) { t.group = g.id; TABS.push(t); }); });
var CURGROUP = "g1";

document.addEventListener("DOMContentLoaded", function () {
  loadRules();
  restoreTour();
  var nav = document.getElementById("nav");
  var sub = document.getElementById("subnav");
  var main = document.getElementById("main");

  GROUPS.forEach(function (g) {
    var b = document.createElement("button");
    b.innerHTML = g.name + (g.cart ? '<span class="dot"></span>' : "");
    b.dataset.group = g.id;
    if (g.cart) b.className = "cart";
    b.addEventListener("click", function () { showGroup(g.id); });
    nav.appendChild(b);
  });
  TABS.forEach(function (t) {
    var b = document.createElement("button");
    b.textContent = t.name;
    b.dataset.tab = t.id;
    b.addEventListener("click", function () { showTab(t.id); });
    sub.appendChild(b);
    var s = document.createElement("section");
    s.className = "tab"; s.id = "tab-" + t.id;
    main.appendChild(s);
    if (t.build) t.build(s);
    else s.innerHTML = '<div class="placeholder">「' + t.name + '」 화면은 다음 버전에서 구현됩니다.</div>';
  });

  showTab("start");
  loadData();
});

function showGroup(gid) {
  CURGROUP = gid;
  var g = GROUPS.filter(function (x) { return x.id === gid; })[0];

}

  var s = DB[key].series[region]; if (!s) return null;

}
function decVal(key, region, y) {

  if (y === Number(e[0])) return getVal(key, region, y, Number(e[1]));

}
function latestYM(key) { var e = DB[key].dates[1].split("-"); return [Number(e[0]), Number(e[1])]; }
function seriesStartYM(key, region) {
  var blk = DB[key]; var s = blk.series[region]; if (!s) return null;
  var n = ymNum(blk.dates[0]) + s.o;
  return [Math.floor((n - 1) / 12), ((n - 1) % 12) + 1];
}
function disp(k) { return k.replace("|", " "); }
/* salePm 키와 지수(sale/jeonse) 키의 표기 차이(공백·'시' 접미사)를 흡수 */
var IDXMAP = null;
function ik(k) {
  if (!DB) return k;
  if (!IDXMAP) {
    IDXMAP = {};
    Object.keys(DB.sale.series).forEach(function (s) {
      IDXMAP[s.replace(/\s/g, "")] = s;
      IDXMAP[s.replace(/\s/g, "") + "시"] = s;   /* '의왕' → '의왕시' 폴백 */
    });
  }
  var n = k.replace(/\s/g, "");
  return IDXMAP[n] || IDXMAP[n.replace(/시$/, "")] || k;
}
function fmt(n) { return Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ","); }
/* 금액을 단위에 맞게: 1억 미만은 만원, 이상은 억 */
function eok(n) {
  if (n == null || isNaN(n)) return "—";
  var neg = n < 0 ? "-" : "";
  var v = Math.abs(n);
  if (v < 10000) return neg + fmt(v) + "만";
  var e = v / 10000;
  if (v % 10000 === 0) return neg + fmt(e) + "억";
  return neg + (e >= 10 ? e.toFixed(1) : e.toFixed(2)).replace(/\.?0+$/, "") + "억";
}
function pct(v, digits) {
  if (v == null) return "—";
  var d = digits == null ? 1 : digits;
  return (v > 0 ? "+" : "") + v.toFixed(d) + "%";
}

function statBox(k, v, c) {
  return '<div class="stat"><div class="k">' + k + '</div><div class="v ' + (c || "") + '">' + v + "</div></div>";
}

/* ══ 거리·이동 범위 ═══════════════════════════ */
function distKm(a, b) {
  var A = COORDS[a], B = COORDS[b];
  if (!A || !B) return null;
  var R = 6371, dLat = (B[0] - A[0]) * Math.PI / 180, dLng = (B[1] - A[1]) * Math.PI / 180;
  var la1 = A[0] * Math.PI / 180, la2 = B[0] * Math.PI / 180;
  var h = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
          Math.cos(la1) * Math.cos(la2) * Math.sin(dLng / 2) * Math.sin(dLng / 2);
  return Math.round(2 * R * Math.asin(Math.sqrt(h)));
}
/* 내 조건의 이동 범위 안에 있는 지역인가 (자동 = 규제지역만 60km) */
function inRange(k, cond) {
  if (!cond.home || !COORDS[cond.home]) return true;
  var d = distKm(cond.home, k);
  if (d == null) return true;
  if (cond.range === "auto") return isRegulated(k) ? d <= 60 : true;
  var lim = Number(cond.range);
  return !lim || d <= lim;
}
function rangeLabel(cond) {
  return cond.range === "auto" ? "규제지역만 60km 이내 (실거주 의무 반영)"
    : (Number(cond.range) ? Number(cond.range) + "km 이내" : "제한 없음");
}

/* ══ 자금 계산 (모든 탭 공용) ═════════════════ */
function isRegulated(region) { return RULES.regulated.indexOf(region) >= 0; }

/* price(만원)와 지역·내 조건으로 대출가능액과 필요현금 산출 */
function finance(region, price, cond, flags) {
  var reg = flags ? !!flags.reg : isRegulated(region);
  var metro = flags ? !!flags.metro : !!METRO[region];
  var own = cond.own;

  /* 1) LTV */
  var ltv;
  if (own === "add" || own === "multi") {
    ltv = (reg || metro) ? 0 : RULES.ltvMulti;   // 수도권·규제 추가매수는 주담대 금지
  } else {
    ltv = reg ? RULES.ltvReg : RULES.ltvFree;
    if (cond.first && !metro && !reg) ltv = Math.max(ltv, RULES.ltvFirstLocal);
  }
  var ltvAmt = price * ltv / 100;

  /* 2) 총액 상한 (수도권 또는 규제지역) */
  var capAmt = Infinity;
  if ((metro || reg) && ltv > 0) {
    capAmt = price <= RULES.capT1Lim ? RULES.capT1 : (price <= RULES.capT2Lim ? RULES.capT2 : RULES.capT3);
  }

  /* 3) DSR (연소득 0이면 미적용) */
  var dsrAmt = Infinity;
  if (cond.income > 0 && ltv > 0) {
    var r = (cond.rate + RULES.stress) / 100 / 12;
    var n = RULES.loanYears * 12;
    var pay = cond.income * RULES.dsr / 100 / 12;
    dsrAmt = r > 0 ? pay * (1 - Math.pow(1 + r, -n)) / r : pay * n;
  }

  var loan = Math.min(ltvAmt, capAmt, dsrAmt);
  var tag = loan === ltvAmt ? "LTV " + ltv + "%" : (loan === capAmt ? "총액상한" : "DSR");
  if (ltv === 0) { loan = 0; tag = "대출불가"; }

  /* 4) 취득세 */
  var acqRate;
  if ((own === "add") && reg) acqRate = RULES.acq2Reg;
  else if (own === "multi" && reg) acqRate = RULES.acq3Reg;
  else if (own === "multi") acqRate = RULES.acq2Reg;   // 비규제 3주택도 중과(기본 8%)
  else acqRate = price <= 60000 ? 1 : (price >= 90000 ? 3 : (price * 2 / 30000 - 3));
  var acq = price * acqRate / 100;

  /* 5) 부대비용 */
  var broker = price * RULES.broker / 100;
  var etc = price * RULES.etcRate / 100 + RULES.etcFixed;

  return { price: price, loan: loan, tag: tag, acq: acq, broker: broker, etc: etc,
           need: price - loan + acq + broker + etc, reg: reg, metro: metro };
}

/* ══ 전국 급지표 + 첫 집 서열 ═════════════════ */
function buildRank(root) {
  root.innerHTML =

      '<div class="tblwrap"><table id="rk-table"><thead><tr>' +
      '<th>서열</th><th>지역</th><th>㎡당가</th><th>매수가</th><th>대출</th><th>필요현금</th><th>꼬리표</th><th>전세가율</th><th>10년</th></tr>' +

        '매수가는 그 지역 ㎡당 평균가 × 기준 전용면적이라 <b>지역 평균 기준</b>입니다 — 대장 단지는 이보다 30~50% 비쌀 수 있습니다. ' +
        '대출 꼬리표는 LTV·총액상한·DSR 중 가장 낮은 값이 무엇이었는지 보여줍니다. ' +
        '기준값은 기준·설정 탭에서 바꿀 수 있습니다.</div></div>';
}

function renderRank() {
  if (!DB || !RANKED.length) return;
  var cond = getCond();
  var area = cond.area;
  var rows = RANKED.map(function (k, i) {
    var pm = lastVal("salePm", k);
    var jpm = lastVal("jeonsePm", k);
    var f = finance(k, pm * area, cond);
    f.key = k; f.rank = i + 1; f.pm = pm;
    f.jr = (jpm && pm) ? jpm / pm * 100 : null;
    return f;
  });

  var cash = cond.cash;
  var hits = cash > 0 ? rows.filter(function (r) { return r.need <= cash; }) : [];
  var top = hits.length ? hits[0] : null;

  /* 콜아웃 + KPI */
  var co = document.getElementById("rk-callout");
  if (cash <= 0) {
    co.innerHTML = '<div class="callout warn">시작 탭에서 <b>동원 가능 현금</b>을 입력하면 내 서열 위치가 표시됩니다.</div>';
  } else if (top) {
    co.innerHTML = '<div class="callout">내 현금 <b>' + eok(cash) + '</b>으로 닿는 최상위 — ' +
      '<b>' + disp(top.key) + '</b> (서열 ' + top.rank + '위 / ' + RANKED.length + '곳' +
      (top.reg ? " · ⛔규제" : "") + ')<br>매수가 ' + eok(top.price) + ' · 대출 ' + eok(top.loan) +
      ' (' + top.tag + ') · 필요현금 <b>' + eok(top.need) + "</b></div>";
  } else {
    var min = rows.reduce(function (a, b) { return a.need < b.need ? a : b; });
    co.innerHTML = '<div class="callout warn">현재 조건으로는 예산 안에 들어오는 지역이 없습니다. ' +
      '최저 필요현금은 <b>' + disp(min.key) + " " + eok(min.need) + "</b>입니다. 평형을 낮추거나 현금·소득 조건을 조정해보세요.</div>";
  }
  var k = "";
  k += statBox("기준 면적", area + "㎡");
  k += statBox("예산 내 지역", cash > 0 ? hits.length + "곳" : "—", hits.length ? "up" : "");
  k += statBox("보유 상태", { none: "무주택", switch: "갈아타기", add: "추가매수", multi: "다주택" }[cond.own] + (cond.first ? " · 생애최초" : ""));
  k += statBox("규제지역 수", RULES.regulated.length + "곳");
  document.getElementById("rk-kpi").innerHTML = k;

/* ══ 비율·배율 공용 헬퍼 ══════════════════════ */
/* salePm/jeonsePm에서 지역의 월별 값 배열(전체 구간, 결측 null) */
function pmSeries(key, region) {
  var blk = DB[key]; var s = blk.series[region]; if (!s) return null;
  var n = blk.dates[2];
  var out = new Array(n).fill(null);
  for (var i = 0; i < s.v.length; i++) out[s.o + i] = s.v[i];
  return out;
}
function pmLabels() {
  var blk = DB.salePm;
  var t0 = ymNum(blk.dates[0]);
  var out = [];
  for (var i = 0; i < blk.dates[2]; i++) {
    var t = t0 + i;
    out.push(Math.floor((t - 1) / 12) + "." + (((t - 1) % 12) + 1));
  }
  return out;
}
/* 두 배열의 비율 시계열 (둘 다 있는 달만) */
function ratioSeries(numArr, denArr, mul) {
  return numArr.map(function (a, i) {
    var b = denArr[i];
    return (a != null && b != null && b !== 0) ? a / b * (mul || 1) : null;
  });
}
/* 최근 n개월 유효값과 현재값의 백분위·밴드 */
function bandStats(arr, nMonths) {
  var tail = arr.slice(-nMonths).filter(function (v) { return v != null; });
  var cur = null;
  for (var i = arr.length - 1; i >= 0; i--) if (arr[i] != null) { cur = arr[i]; break; }
  if (!tail.length || cur == null) return null;
  var sorted = tail.slice().sort(function (a, b) { return a - b; });
  var below = sorted.filter(function (v) { return v <= cur; }).length;
  var mid = sorted[Math.floor(sorted.length / 2)];
  return { cur: cur, min: sorted[0], max: sorted[sorted.length - 1], med: mid,
           pctile: below / sorted.length * 100, count: tail.length };
}
/* 밴드 배경 + 중앙값 점선을 그리는 차트 플러그인 생성기 */
function bandPlugin(getBand, color) {
  return {
    id: "band",
    beforeDatasetsDraw: function (chart) {
      var b = getBand(); if (!b) return;
      var y = chart.scales.y, a = chart.chartArea, ctx = chart.ctx;
      var yMin = y.getPixelForValue(b.max), yMax = y.getPixelForValue(b.min);
      ctx.save();
      ctx.fillStyle = color;
      ctx.fillRect(a.left, yMin, a.right - a.left, yMax - yMin);
      var yMed = y.getPixelForValue(b.med);
      ctx.strokeStyle = "#98a1ad"; ctx.setLineDash([4, 4]); ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(a.left, yMed); ctx.lineTo(a.right, yMed); ctx.stroke();
      ctx.restore();
    }
  };
}
/* 다각형 레이더 차트 (SVG) — 축 수만큼 오각형·육각형이 된다 */
function radarSvg(axes, size, color) {
  var PAD = 54;                       /* 라벨이 잘리지 않도록 확보하는 여백 */
  var N = axes.length, R = (size - PAD * 2) / 2, cx = size / 2, cy = size / 2;
  function pt(i, r) {
    var a = -Math.PI / 2 + i * 2 * Math.PI / N;
    return [cx + Math.cos(a) * r, cy + Math.sin(a) * r];
  }
  function poly(r) {
    var p = [];
    for (var i = 0; i < N; i++) p.push(pt(i, r).map(function (v) { return v.toFixed(1); }).join(","));
    return p.join(" ");
  }
  var grid = "";
  [0.25, 0.5, 0.75, 1].forEach(function (f) {
    grid += '<polygon points="' + poly(R * f) + '" fill="none" stroke="#dfe4ea" stroke-width="1"/>';
  });
  for (var i = 0; i < N; i++) {
    var p = pt(i, R);
    grid += '<line x1="' + cx + '" y1="' + cy + '" x2="' + p[0].toFixed(1) + '" y2="' + p[1].toFixed(1) +
      '" stroke="#dfe4ea" stroke-width="1"/>';
  }
  var vals = [], dots = "";
  for (var j = 0; j < N; j++) {
    var v = Math.max(0, Math.min(100, axes[j].v)) / 100;
    var q = pt(j, R * v);
    vals.push(q.map(function (x) { return x.toFixed(1); }).join(","));
    dots += '<circle cx="' + q[0].toFixed(1) + '" cy="' + q[1].toFixed(1) + '" r="3" fill="' + color + '"/>';
  }
  /* 축 이름과 점수를 두 줄로 — 좌우 잘림 방지 */
  var labels = "";
  for (var k = 0; k < N; k++) {
    var lp = pt(k, R + 20);
    var dx = lp[0] - cx, dy = lp[1] - cy;
    var anchor = Math.abs(dx) < R * 0.25 ? "middle" : (dx > 0 ? "start" : "end");
    var ty = lp[1] + (dy < -R * 0.5 ? -2 : (dy > R * 0.5 ? 10 : 2));
    labels += '<text x="' + lp[0].toFixed(1) + '" y="' + ty.toFixed(1) + '" text-anchor="' + anchor +
      '" font-size="11" font-weight="700" fill="#5b6675">' + axes[k].n + "</text>" +
      '<text x="' + lp[0].toFixed(1) + '" y="' + (ty + 13).toFixed(1) + '" text-anchor="' + anchor +
      '" font-size="12" font-weight="800" fill="' + color + '">' + Math.round(axes[k].v) + "</text>";
  }
  return '<svg viewBox="0 0 ' + size + " " + size + '" width="100%" style="max-width:' + size +
    'px;display:block;margin:0 auto;overflow:visible">' +
    grid + '<polygon points="' + vals.join(" ") + '" fill="' + color + '33" stroke="' + color + '" stroke-width="2"/>' +
    dots + labels + "</svg>";
}
/* 레이더 아래 붙는 한 줄 요약 (가로 바 대체) */
function radarNote(pairs) {
  return '<div class="chips" style="margin:4px 0 2px;justify-content:center">' +
    pairs.filter(function (p) { return p[1]; })
      .map(function (p) { return '<span class="chip">' + p[0] + " <b>" + p[1] + "</b></span>"; }).join("") + "</div>";
}

/* 밴드 미니 바: 그라데이션 트랙 + 현재 위치 눈금 (lowGood: 왼쪽이 유리) */
function bandBar(p, lowGood) {
  if (p == null) return "—";
  var g = lowGood
    ? "linear-gradient(90deg,#0e7c66,#e3e7ee 50%,#c47f17)"
    : "linear-gradient(90deg,#c47f17,#e3e7ee 50%,#0e7c66)";
  return '<span class="bb"><span class="bbtrack" style="background:' + g + '"></span>' +
    '<span class="bbtick" style="left:' + Math.max(0, Math.min(100, p)).toFixed(0) + '%"></span></span>' +
    '<span class="bbv">' + p.toFixed(0) + "%</span>";
}
/* 10년 상승률 셀: 값 + 합격(100%↑, 연 7.2%) 태그 */
function r10Cell(k) {
  var v = idxChange("sale", ik(k), 120);
  if (v == null) return "—";
  return '<span class="' + cls(v) + '">' + pct(v, 1) + "</span>" +
    (v >= 100 ? '<span class="tagmini ok">합격</span>' : '<span class="tagmini no">미달</span>');
}

/* 백분위 위치 태그 (lowGood: 낮을수록 유리한 지표인가) */
function bandTag(p, lowGood) {
  if (p == null) return { t: "—", c: "flat" };
  if (p <= 30) return { t: "하단 " + p.toFixed(0) + "%", c: lowGood ? "up" : "down" };
  if (p >= 70) return { t: "상단 " + p.toFixed(0) + "%", c: lowGood ? "down" : "up" };
  return { t: "중간 " + p.toFixed(0) + "%", c: "flat" };
}
/* 표본 수까지 감안한 태그: 24개월 미만이면 백분위를 신뢰하지 않음 */
function tagOf(band, lowGood) {
  if (!band) return { t: "—", c: "flat" };
  if (band.count < 24) return { t: "표본 부족", c: "flat" };
  return bandTag(band.pctile, lowGood);
}
/* 밴드 라벨: 10년치가 안 되면 실제 개월 수를 밝힘 */
function bandLabel(band) {
  if (!band) return "10년 밴드";
  return band.count >= 120 ? "10년 밴드" : "밴드 (" + band.count + "개월)";
}
/* 앞쪽 결측 구간을 잘라 실제 데이터 구간만 차트에 표시 */
function trimSeries(labels, arr) {
  var first = 0;
  while (first < arr.length && arr[first] == null) first++;
  return { labels: labels.slice(first), data: arr.slice(first) };
}

function renderGap() {
  if (!DB || !RANKED.length) return;
  if (!GAP.region) GAP.region = RANKED[0];
  var sel = document.getElementById("gp-region");
  if (sel.value !== GAP.region) sel.value = GAP.region;
  var cond = getCond(), area = cond.area, cash = cond.cash;

  /* 선택 지역 차트 + KPI */
  var sArr = pmSeries("salePm", GAP.region), jArr = pmSeries("jeonsePm", GAP.region);
  var ratio = ratioSeries(jArr, sArr, 100);
  var band = bandStats(ratio, 120);
  var sCur = lastVal("salePm", GAP.region), jCur = lastVal("jeonsePm", GAP.region);
  var gap = (sCur != null && jCur != null) ? (sCur - jCur) * area : null;
  var f = gap != null ? finance(GAP.region, sCur * area, cond) : null;
  var needGap = (gap != null && f) ? gap + f.acq + f.broker + f.etc : null;

  var k = "";
  var tag = tagOf(band, false);
  k += statBox("현재 전세가율", band ? band.cur.toFixed(1) + "%" : "—");
  k += statBox(bandLabel(band), band ? band.min.toFixed(1) + " ~ " + band.max.toFixed(1) + "%" : "—");
  k += statBox("밴드 백분위", tag.t, tag.c);
  k += statBox("갭투자 필요현금 (" + area + "㎡)", needGap != null ? eok(needGap) : "—",
               (cash > 0 && needGap != null && needGap <= cash) ? "up" : "");
  document.getElementById("gp-kpi").innerHTML = k;

  var css = getComputedStyle(document.documentElement);
  var cBrand = css.getPropertyValue("--brand").trim();
  if (chartGap) chartGap.destroy();
  var gpTrim = trimSeries(pmLabels(), ratio);
  chartGap = new Chart(document.getElementById("gp-chart"), {
    type: "line",
    data: { labels: gpTrim.labels, datasets: [
      { label: "전세가율", data: gpTrim.data, borderColor: cBrand, borderWidth: 2, pointRadius: 0, tension: .1 }
    ]},
    options: chartOpts("%"),
    plugins: [bandPlugin(function () { return band; }, "rgba(15,76,92,.07)")]
  });

  /* 전국 표 */
  var tb = document.querySelector("#gp-table tbody");
  tb.innerHTML = RANKED.map(function (key, i) {
    var s = pmSeries("salePm", key), j = pmSeries("jeonsePm", key);
    var b = bandStats(ratioSeries(j, s, 100), 120);
    var sc = lastVal("salePm", key), jc = lastVal("jeonsePm", key);
    var g = (sc != null && jc != null) ? (sc - jc) * area : null;
    var fin = g != null ? finance(key, sc * area, cond) : null;
    var need = (g != null && fin) ? g + fin.acq + fin.broker + fin.etc : null;
    var t = tagOf(b, false);
    var hit = cash > 0 && need != null && need <= cash;
    var barCell = (b && b.count >= 24) ? bandBar(b.pctile, false) : t.t;
    return '<tr class="' + (hit ? "hit" : "") + '"><td>' + (i + 1) + "</td>" +
      "<td>" + (isRegulated(key) ? "⛔ " : "") + disp(key) + "</td>" +
      "<td>" + (b ? b.cur.toFixed(1) + "%" : "—") + "</td>" +
      "<td>" + barCell + "</td>" +
      "<td>" + (g != null ? eok(g) : "—") + "</td>" +
      "<td><b>" + (need != null ? eok(need) : "—") + "</b></td>" +
      "<td>" + r10Cell(key) + "</td>" +
      '<td><button class="btn sm ghost" data-gdj="' + key + '">단지</button></td></tr>';
  }).join("");
  tb.querySelectorAll("button[data-gdj]").forEach(function (b2) {

      showTab("danji");

function renderMove() {
  if (!DB || !RANKED.length) return;
  var cond = getCond(), area = cond.area;
  var home = cond.home;
  var co = document.getElementById("mv-callout");
  var sel = document.getElementById("mv-target");

  if (!home || !DB.salePm.series[home]) {
    co.innerHTML = '<div class="callout warn">시작 탭에서 <b>지금 사는 지역</b>을 먼저 선택해주세요.</div>';
    sel.innerHTML = ""; document.getElementById("mv-kpi").innerHTML = "";
    document.querySelector("#mv-table tbody").innerHTML = "";
    if (chartMove) { chartMove.destroy(); chartMove = null; }
    return;
  }
  var myPm = lastVal("salePm", home);
  var uppers = RANKED.filter(function (k) { return k !== home && lastVal("salePm", k) > myPm; });
  co.innerHTML = '<div class="callout">내 지역 <b>' + disp(home) + '</b> — ㎡당 ' + fmt(myPm) +
    "만원 · 상급지 <b>" + uppers.length + "곳</b></div>";

  if (!uppers.length) {
    document.getElementById("mv-kpi").innerHTML = "";
    document.querySelector("#mv-table tbody").innerHTML = "";
    return;
  }
  /* 목표 셀렉트: 상급지만, 기본값은 바로 위 급지(=가장 싼 상급지) */
  var prevTarget = MOVE.target;
  if (!prevTarget || uppers.indexOf(prevTarget) < 0) MOVE.target = uppers[uppers.length - 1];
  fillKbRegionSelect("mv-target", uppers, MOVE.target, 24);

  /* 배율 시계열 + KPI */
  var mineArr = pmSeries("salePm", home);
  var tgtArr = pmSeries("salePm", MOVE.target);
  var mult = ratioSeries(tgtArr, mineArr, 1);
  var band = bandStats(mult, 120);
  var tag = tagOf(band, true);
  var tPm = lastVal("salePm", MOVE.target);
  var fin = finance(MOVE.target, tPm * area, cond);
  var extra = (tPm - myPm) * area + fin.acq + fin.broker + fin.etc;

  /* 역대 최저 배율 시점과 그때 기준 추가금 */
  var winStart = Math.max(0, mult.length - 120);
  var minIdx = -1, minV = Infinity;
  for (var mi = winStart; mi < mult.length; mi++) {
    if (mult[mi] != null && mult[mi] < minV) { minV = mult[mi]; minIdx = mi; }
  }
  var minLabel = minIdx >= 0 ? pmLabels()[minIdx] : null;
  function extraAt(m) {
    var pT = myPm * m * area;
    var fx = finance(MOVE.target, pT, cond);
    return pT - myPm * area + fx.acq + fx.broker + fx.etc;
  }
  var extraMin = (band && band.count >= 24 && minIdx >= 0) ? extraAt(minV) : null;
  var extraMed = band ? extraAt(band.med) : null;

  var k = "";
  k += statBox("현재 배율", band ? band.cur.toFixed(2) + "x" : "—");
  k += statBox("밴드 위치", (band && band.count >= 24) ? "" : tag.t, tag.c);
  k += statBox("단순 추가금 (" + area + "㎡)", eok(extra));
  k += statBox("역대 최저 배율이면", extraMin != null ? eok(extraMin) + " (" + minLabel + " 수준)" : "—",
    extraMin != null && extraMin < extra ? "up" : "");
  document.getElementById("mv-kpi").innerHTML = k;
  if (band && band.count >= 24) {
    var kpiBoxes = document.querySelectorAll("#mv-kpi .stat .v");
    if (kpiBoxes[1]) kpiBoxes[1].innerHTML = bandBar(band.pctile, true);
  }

  /* 이 갈아타기 읽기 */
  var readEl = document.getElementById("mv-read");
  if (band && band.count >= 24) {
    var myIdx = RANKED.indexOf(home), tgIdx = RANKED.indexOf(MOVE.target);
    var vsMed = (band.cur / band.med - 1) * 100;
    var save = (extraMed != null && extra != null) ? extra - extraMed : null;
    var my10 = idxChange("sale", ik(home), 120), tg10 = idxChange("sale", ik(MOVE.target), 120);
    var my3 = idxChange("sale", ik(home), 36), tg3 = idxChange("sale", ik(MOVE.target), 36);
    var lines = [];
    lines.push("전국 서열 <b>" + (myIdx + 1) + "위 → " + (tgIdx + 1) + "위</b>로 올라가는 갈아타기입니다.");
    lines.push("현재 배율 " + band.cur.toFixed(2) + "는 10년 중앙값 " + band.med.toFixed(2) + " 대비 <b>" +
      pct(vsMed, 1) + "</b> " + (vsMed > 0 ? "벌어진" : "좁혀진") + " 상태입니다 (밴드 " + band.pctile.toFixed(0) + "%).");
    if (save != null && save > 0) lines.push("배율이 10년 중앙값으로만 돌아가면 추가금은 <b>" + eok(extraMed) +
      "</b> — 지금보다 <b>" + eok(save) + " 적게</b> 듭니다. 반대로 격차가 더 벌어질 위험과 맞바꾸는 선택입니다.");
    else if (save != null) lines.push("지금 배율이 10년 중앙값보다 좁혀진 상태라 <b>역대 기준으로 싸게 올라가는 구간</b>입니다.");
    if (my10 != null && tg10 != null) lines.push("10년 상승률은 내 지역 " + pct(my10, 1) + " vs 목표 " + pct(tg10, 1) +
      " — " + (tg10 > my10 ? "목표지가 더 빨리 달려온 만큼 기다릴수록 격차가 커질 수 있는" : "내 지역이 더 빨랐던") + " 조합입니다.");
    if (my3 != null && tg3 != null) lines.push("최근 3년은 " + pct(my3, 1) + " vs " + pct(tg3, 1) + "입니다.");
    if (minLabel) lines.push("역대 최저 배율은 <b>" + minLabel + "</b>의 " + minV.toFixed(2) + " — 그 수준이면 추가금 " + eok(extraMin) + "이었습니다.");
    readEl.style.display = "";
    readEl.innerHTML = "<b>이 갈아타기 읽기</b><br>" + lines.join("<br>");
  } else {
    readEl.style.display = "none";
  }

  var css = getComputedStyle(document.documentElement);
  var cUp = css.getPropertyValue("--up").trim();
  if (chartMove) chartMove.destroy();
  var mvTrim = trimSeries(pmLabels(), mult);
  chartMove = new Chart(document.getElementById("mv-chart"), {
    type: "line",
    data: { labels: mvTrim.labels, datasets: [
      { label: disp(MOVE.target) + " ÷ " + disp(home), data: mvTrim.data,
        borderColor: cUp, borderWidth: 2, pointRadius: 0, tension: .1 }
    ]},
    options: chartOpts("x"),
    plugins: [bandPlugin(function () { return band; }, "rgba(14,124,102,.08)")]
  });

  /* 상급지 표 (서열순 = 비싼 순) */
  var tb = document.querySelector("#mv-table tbody");
  tb.innerHTML = uppers.map(function (key) {
    var b = bandStats(ratioSeries(pmSeries("salePm", key), mineArr, 1), 120);
    var t = tagOf(b, true);
    var p = lastVal("salePm", key);
    var f2 = finance(key, p * area, cond);
    var ex = (p - myPm) * area + f2.acq + f2.broker + f2.etc;
    var verdict = !b || b.count < 24 ? '<span class="flat">표본 부족</span>'
      : b.pctile <= 25 ? '<span class="up"><b>하단 · 유리</b></span>'
      : b.pctile >= 90 ? '<span class="down">역대 최고권</span>'
      : b.pctile >= 70 ? '<span class="down">상단</span>' : '<span class="flat">중립</span>';
    var barCell = (b && b.count >= 24) ? bandBar(b.pctile, true) : "—";
    return '<tr class="' + (b && b.count >= 24 && b.pctile <= 25 ? "hit" : "") + '"><td>' + (RANKED.indexOf(key) + 1) + "</td>" +
      "<td>" + (isRegulated(key) ? "⛔ " : "") + disp(key) + "</td>" +
      "<td>" + (b ? b.cur.toFixed(2) + "x" : "—") + "</td>" +
      "<td>" + (b ? b.med.toFixed(2) + "x" : "—") + "</td>" +
      "<td>" + barCell + "</td>" +
      "<td><b>" + eok(ex) + "</b></td>" +
      "<td>" + verdict + "</td></tr>";
  }).join("");
}

/* ══ 맞춤 추천 탭 ═════════════════════════════ */
var RECO = { sort: "rank", budgetOnly: false, buy: "auto" };

/* 전세 끼고 매수: 필요현금 = 갭 + 취득세 + 중개보수 + 부대비 (대출 없음)
   규제지역은 실거주 의무로 전세 승계가 막히므로 불가 처리 */
function financeJeonse(k, price, cond) {
  var pm = lastVal("salePm", k), jpm = lastVal("jeonsePm", k);
  if (pm == null || jpm == null) return null;
  if (isRegulated(k)) return null;
  var f = finance(k, price, cond);
  var gap = (pm - jpm) * cond.area;
  return { need: gap + f.acq + f.broker + f.etc, gap: gap, tag: "전세 끼고",
           jr: jpm / pm * 100, acq: f.acq, broker: f.broker, etc: f.etc, reg: false };
}
/* 매수 방식 결정: auto면 필요현금이 적은 쪽 */
function buyPlan(k, price, cond, mode) {
  var loanF = finance(k, price, cond);
  loanF.mode = "loan"; loanF.modeName = "대출 매수";
  var jF = financeJeonse(k, price, cond);
  if (jF) { jF.mode = "jeonse"; jF.modeName = "전세 끼고"; jF.loan = 0; jF.price = price; }
  if (mode === "loan") return loanF;
  if (mode === "jeonse") return jF;
  if (!jF) return loanF;
  return jF.need < loanF.need ? jF : loanF;
}

/* 시군구 → 수급조사(시도 단위) 키 매핑 */
function surveyKey(k) {
  var top = k.split("|")[0];
  var direct = ["부산광역시","대구광역시","인천광역시","대전광역시","울산광역시",
    "(구)광주광역시","세종특별자치시","강원특별자치도","충청북도","충청남도",
    "전북특별자치도","(구)전라남도","경상북도","경상남도","제주특별자치도",
    "강북14개구","강남11개구"];
  if (direct.indexOf(top) >= 0) return top;
  if (METRO[k]) return "경기도";   /* 서울·인천은 위에서 걸러졌으므로 남은 수도권 = 경기 */
  return "전국";
}
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

/* 지역 하나의 5축 점수 + 종합 */
function scoreRegion(k, idx, cond, homePmArr) {
  var N = RANKED.length;
  var pm = lastVal("salePm", k);
  var f = finance(k, pm * cond.area, cond);

  /* ① 급지: 서열 백분위 */
  var sRank = (1 - idx / (N - 1)) * 100;

  /* ② 장기성과: 매매지수 10년 연복리 (7.2%/년 = 100점) */
  var e = latestYM("sale");
  var iN = getVal("sale", ik(k), e[0], e[1]);
  var i10 = getVal("sale", ik(k), e[0] - 10, e[1]);
  var sPerf = 50, cagr = null;
  if (iN != null && i10 != null && i10 > 0) {
    cagr = (Math.pow(iN / i10, 1 / 10) - 1) * 100;
    sPerf = clamp(cagr / 7.2, 0, 1) * 100;
  }

  /* ③ 수급: 시도 단위 매수우위·전세수급 평균 → 20~100 */
  var sk = surveyKey(k);
  var buyer = lastVal("buyerIdx", sk), sup = lastVal("jeonseSupply", sk);
  var sSupply = 60;
  if (buyer != null && sup != null) sSupply = clamp(20 + (buyer + sup) / 2 / 200 * 80, 20, 100);

  /* ④ 타이밍: 무주택=전세가율 밴드(높을수록↑), 유주택=배율 밴드(낮을수록↑) → 40~100 */
  var sTiming = 70, timingNote = "중립";
  if (cond.own === "none" || !homePmArr) {
    var b = bandStats(ratioSeries(pmSeries("jeonsePm", k), pmSeries("salePm", k), 100), 120);
    if (b && b.count >= 24) { sTiming = 40 + b.pctile * 0.6; timingNote = "전세가율 " + b.pctile.toFixed(0) + "%"; }
  } else {
    var b2 = bandStats(ratioSeries(pmSeries("salePm", k), homePmArr, 1), 120);
    if (b2 && b2.count >= 24) { sTiming = 40 + (100 - b2.pctile) * 0.6; timingNote = "배율 " + b2.pctile.toFixed(0) + "%"; }
  }

  /* ⑤ 자금: 현금/필요현금 (매수 방식 반영) */
  var plan = buyPlan(k, pm * cond.area, cond, RECO.buy) || f;
  var sCash = 50;
  if (cond.cash > 0 && plan.need > 0) sCash = clamp(cond.cash / plan.need * 100, 0, 100);

  var W = RULES;
  var wSum = W.wRank + W.wPerf + W.wSupply + W.wTiming + W.wCash;
  var total = (sRank * W.wRank + sPerf * W.wPerf + sSupply * W.wSupply +
               sTiming * W.wTiming + sCash * W.wCash) / wSum;

  return { key: k, rank: idx + 1, pm: pm, fin: plan, loanFin: f, cagr: cagr,
           dist: cond.home ? distKm(cond.home, k) : null,
           s: { rank: sRank, perf: sPerf, supply: sSupply, timing: sTiming, cash: sCash },
           timingNote: timingNote, total: total };
}

    '</div>' +
    '<div class="card"><div class="eyebrow">Evidence</div><h2>급지 가중치의 근거 — 백테스트</h2>' +
      '<p class="desc">10년 전(2016.7) ㎡당가 분위로 지역을 나눠, 이후 10년 실제 매매지수 성과를 ' +

      '</thead><tbody></tbody></table></div>' +
      '<div class="note">추천 카드의 필요현금은 <b>그 지역 ㎡당 평균가</b> 기준입니다. 실제 단지는 평균 위아래로 ' +
        '흩어져 있고 대장 단지는 평균보다 30~50% 비싼 경우가 흔합니다 — 단지 단위 확인은 단지 찾기 탭(다음 버전)에서 합니다.</div></div>';

  root.querySelectorAll("#rc-sort button").forEach(function (b) {

function renderReco() {
  if (!DB || !RANKED.length) return;
  var cond = getCond();
  var homePmArr = (cond.own !== "none" && cond.home && DB.salePm.series[cond.home])
    ? pmSeries("salePm", cond.home) : null;

  var rows = RANKED.map(function (k, i) { return scoreRegion(k, i, cond, homePmArr); })
    .filter(function (r) { return r.fin && inRange(r.key, cond); });

  /* 콜아웃: 조건 요약 */
  var co = document.getElementById("rc-callout");
  if (cond.cash <= 0) {
    co.innerHTML = '<div class="callout warn">시작 탭에서 <b>동원 가능 현금</b>을 입력하면 자금 점수와 예산 필터가 정확해집니다.</div>';
  } else {
    var nHit = rows.filter(function (r) { return r.fin.need <= cond.cash; }).length;
    co.innerHTML = '<div class="callout">현금 <b>' + eok(cond.cash) + "</b> · " + cond.area + "㎡ · " +
      { none: "무주택", switch: "갈아타기", add: "추가매수", multi: "다주택" }[cond.own] +
      (cond.own !== "none" && cond.home ? " (내 지역 " + disp(cond.home) + ")" : "") +
      " · " + rangeLabel(cond) +
      " — 검토 대상 <b>" + rows.length + "곳</b> 중 예산 내 <b>" + nHit + "곳</b></div>";
  }

  /* 정렬·필터 */
  var list = rows.slice();
  if (RECO.budgetOnly && cond.cash > 0) list = list.filter(function (r) { return r.fin.need <= cond.cash; });
  if (RECO.sort === "rank") {
    if (cond.cash > 0) list = list.filter(function (r) { return r.fin.need <= cond.cash; });
    /* 서열순: 예산 안에서 가장 비싼 곳부터 (이미 RANKED 순) */
  } else if (RECO.sort === "score") {
    list.sort(function (a, b) { return b.total - a.total; });
  } else {
    list.sort(function (a, b) { return a.fin.need - b.fin.need; });
  }

  /* 상위 5 카드 */
  var topEl = document.getElementById("rc-top");
  if (!list.length) {
    topEl.innerHTML = '<div class="callout warn">조건에 맞는 지역이 없습니다. 예산 필터를 끄거나 ' +
      '이동 가능 범위·평형·현금을 조정해보세요.</div>';
  } else {
    /* 히어로: 1순위 요약 4장 */
    var h = list[0];
    var hGrade = h.total >= 80 ? "A" : (h.total >= 65 ? "B" : (h.total >= 50 ? "C" : "D"));
    var jeonseOk = rows.filter(function (r) { return !isRegulated(r.key); }).length;
    var maxP = maxPriceForCash(cond, { reg: false, metro: !!METRO[h.key] });
    var heroHtml =
      '<div class="status" style="margin-bottom:10px">' +
      '<div class="stat" style="background:var(--panel);border:2px solid var(--up);grid-column:1/-1">' +
        '<div class="k">예산으로 되는 최상단</div>' +
        '<div class="v" style="font-size:1.5rem">' + disp(h.key) + "</div>" +
        '<div class="k" style="margin-top:4px">' + hGrade + "등급 " + h.total.toFixed(0) + "점 · 전국 " + h.rank +
          "위 · " + h.fin.modeName + " 필요현금 " + eok(h.fin.need) + "</div></div>" +
      statBox("내 조건", eok(cond.cash) + " · " + cond.area + "㎡",
        cond.own === "none" ? "" : "") +
      statBox("검토 대상", rows.length + "곳") +
      statBox("전세 끼고 가능", jeonseOk + "곳 (비규제)") +
      statBox("예산으로 최대", maxP != null ? eok(maxP) : "—") +
      "</div>";
    var AXN = { rank: "급지", perf: "성과", supply: "수급", timing: "타이밍", cash: "자금" };
    function axRow(name, v, sub) {
      return '<div class="axis"><span class="axname">' + name + '</span>' +
        '<div class="axtrack"><div class="axfill" style="width:' + v.toFixed(0) + '%"></div></div>' +
        "<b>" + v.toFixed(0) + "</b>" + (sub ? "<small>" + sub + "</small>" : "") + "</div>";
    }
    topEl.innerHTML = heroHtml + list.slice(0, 5).map(function (r, i) {
      var grade = r.total >= 80 ? "A" : (r.total >= 65 ? "B" : (r.total >= 50 ? "C" : "D"));
      var rationale = "";
      {
        var axArr = Object.keys(AXN).map(function (k2) { return [k2, r.s[k2]]; })
          .sort(function (a, b) { return b[1] - a[1]; });
        var r10v = idxChange("sale", ik(r.key), 120);
        var jrv = (function () {
          var pmv = lastVal("salePm", r.key), jv = lastVal("jeonsePm", r.key);
          return (pmv && jv) ? jv / pmv * 100 : null;
        })();
        var jb = bandStats(ratioSeries(pmSeries("jeonsePm", r.key), pmSeries("salePm", r.key), 100), 120);
        var tier = Math.min(10, Math.floor(r.rank / RANKED.length * 10) + 1);
        /* 같은 예산으로 전세 끼고 가능한 다른 후보 3곳 */
        var alts = rows.filter(function (x) {
          var j = financeJeonse(x.key, x.pm * cond.area, cond);
          return j && cond.cash > 0 && j.need <= cond.cash && x.key !== r.key;
        }).slice(0, 3).map(function (x) {
          var j = financeJeonse(x.key, x.pm * cond.area, cond);
          return disp(x.key) + " " + eok(j.need);
        });
        var bl = [];
        bl.push("<b>" + disp(r.key) + "</b>가 " + grade + "등급 " + r.total.toFixed(0) + "점으로 " + (i + 1) + "순위입니다. " +
          "전국 " + tier + "분위 · 10년 " + (r10v != null ? pct(r10v, 1) : "—") +
          (jrv != null ? " · 전세가율 " + jrv.toFixed(0) + "%" : "") +
          " · " + r.fin.modeName + " 필요현금 " + eok(r.fin.need) +
          (cond.cash > 0 && r.fin.need <= cond.cash ? " <b>(실행 가능)</b>" : "") + ".");
        bl.push("가장 강한 축은 <b>" + AXN[axArr[0][0]] + " " + axArr[0][1].toFixed(0) + "점</b>" +
          (axArr[0][0] === "perf" && r.cagr != null ? "(10년 " + pct(r10v, 1) + " · 연복리 " + r.cagr.toFixed(1) + "% · " +
            (r10v >= 100 ? "통과" : "미달") + ")" : "") +
          ", 가장 약한 축은 <b>" + AXN[axArr[axArr.length - 1][0]] + " " + axArr[axArr.length - 1][1].toFixed(0) + "점</b>입니다.");
        if (r.dist != null) bl.push("거리 필터 — " + rangeLabel(cond) + ". 내 지역에서 <b>" + r.dist + "km</b> 떨어져 있습니다." +
          (cond.range === "auto" ? " 규제지역은 실거주 의무가 있어 60km 이내만 후보로 봅니다. 비규제지역은 전세를 끼고 살 수 있어 거리 제한을 두지 않습니다." : ""));
        bl.push(r.fin.mode === "jeonse"
          ? "<b>전세를 끼면 들어갈 수 있는 곳</b>입니다 — 갭 " + eok(r.fin.gap) + "만 있으면 되고 대출 없이 전세를 승계하는 방식입니다. " +
            "대출 매수(" + eok(r.loanFin.need) + ")보다 " + eok(r.loanFin.need - r.fin.need) + " 적게 듭니다." +
            (alts.length ? " 같은 예산의 다른 후보: " + alts.join(" · ") + "." : "")
          : "<b>대출 매수</b> 기준입니다 — " + r.loanFin.tag + "에 걸려 대출 " + eok(r.loanFin.loan) + ", 자기자금 " +
            eok(r.fin.need) + "이 필요합니다." + (isRegulated(r.key) ? " 규제지역이라 실거주 의무가 있어 전세 끼고 매수는 막힙니다." : ""));
        if (jb && jb.count >= 24) bl.push("진입 타이밍 — 전세가율이 10년 밴드의 <b>" + jb.pctile.toFixed(0) + "%</b> 지점입니다. " +
          (jb.pctile >= 70 ? "역대 대비 높아 갭이 얇은, 진입 부담이 낮은 구간입니다." :
           jb.pctile <= 30 ? "역대 최저권이라 매매가에 기대가 많이 실린 상태입니다." : "중립 구간입니다."));
        bl.push("이 순위는 5개 축의 가중 합계입니다. 점수 자체보다 <b>어느 축이 낮은지</b>를 보고, 단지 단계로 내려가 " +
          "세대수·역세권 조건까지 맞추면 최종 검토 탭에서 6축 보고서를 받습니다.");
        rationale = '<div class="rowinfo" style="margin-top:8px"><b>추천 근거</b>' +
          "<ul style='margin:6px 0 0 16px;line-height:1.7'>" +
          bl.map(function (x) { return "<li>" + x + "</li>"; }).join("") + "</ul></div>";
      }
      var radar = '<div style="width:100%;max-width:320px;margin:8px auto 0">' +
        radarSvg([{ n: "급지", v: r.s.rank }, { n: "성과", v: r.s.perf }, { n: "수급", v: r.s.supply },
                  { n: "타이밍", v: r.s.timing }, { n: "자금", v: r.s.cash }],
                 320, i === 0 ? "#0e7c66" : "#0f4c5c") + "</div>" +
        radarNote([["전국", r.rank + "위"], ["연복리", r.cagr != null ? r.cagr.toFixed(1) + "%" : ""],
                   ["타이밍", r.timingNote], ["필요현금", eok(r.fin.need)]]);
      return '<div class="reco' + (i === 0 ? " best" : "") + '" style="flex-wrap:wrap">' +
        '<div class="no">' + (i + 1) + "</div>" +
        '<div class="body"><div class="name">' + (r.fin.reg ? "⛔ " : "") + disp(r.key) +
          ' <span style="font-weight:600;color:var(--ink-soft);font-size:.78rem">서열 ' + r.rank + "위 · " + fmt(r.pm) + "만/㎡" +
          (r.dist != null ? " · 내 지역에서 " + r.dist + "km" : "") + (isRegulated(r.key) ? " · 규제지역" : "") + "</span></div>" +
        '<div class="rowinfo" style="margin:4px 0 6px">' + r.fin.modeName + " · 필요현금 <b>" + eok(r.fin.need) + "</b>" +
          (r.fin.mode === "jeonse" ? " (갭 " + eok(r.fin.gap) + ")" : (r.loanFin.loan > 0 ? " · 대출 " + eok(r.loanFin.loan) : "")) +
          (cond.cash > 0 ? (r.fin.need <= cond.cash ? ' <span class="tagmini ok">실행 가능</span>' : ' <span class="tagmini no">부족 ' + eok(r.fin.need - cond.cash) + "</span>") : "") + "</div>" +
        radar + rationale +
        '<div class="btnrow" style="margin-top:8px">' +
          '<button class="btn sm ghost" data-rc="danji" data-k="' + r.key + '">단지 보기</button>' +
          '<button class="btn sm ghost" data-rc="map" data-k="' + r.key + '">지도에서 보기</button>' +
          '<button class="btn sm ghost" data-rc="move" data-k="' + r.key + '">갈아타기 분석</button></div>' +
        "</div>" +
        '<div class="money"><div class="grade ' + grade + '" style="font-size:1.1rem;padding:4px 10px">' + grade + "</div>" +
        '<div class="score" style="margin-top:4px">' + r.total.toFixed(1) + "</div></div></div>";
    }).join("");
    topEl.querySelectorAll("button[data-rc]").forEach(function (b) {
      b.addEventListener("click", function () {
        var k2 = b.dataset.k;
        if (b.dataset.rc === "danji") {
          showTab("danji");
          var sel = document.getElementById("dj-region");
          if (sel && LAWD[k2]) sel.value = LAWD[k2];
        } else if (b.dataset.rc === "map") {
          showTab("mapx"); renderMapx();
          if (COORDS[k2]) showMapDetail(k2);
        } else {
          MOVE.target = k2; showTab("move");
        }
      });
    });
  }

  /* 백테스트 카드 (매 렌더 계산 — 가볍고 데이터 갱신에 자동 대응) */
  var e = latestYM("sale");
  var bt = [];
  RANKED.forEach(function (k) {
    var p16 = getVal("salePm", k, e[0] - 10, e[1]);
    var i16 = getVal("sale", ik(k), e[0] - 10, e[1]);
    var iN = getVal("sale", ik(k), e[0], e[1]);
    if (p16 != null && i16 != null && iN != null) bt.push([p16, (iN / i16 - 1) * 100]);
  });
  bt.sort(function (a, b) { return b[0] - a[0]; });
  function seg(a, b) {
    var part = bt.slice(Math.floor(bt.length * a / 10), Math.ceil(bt.length * b / 10));
    if (!part.length) return null;
    return part.reduce(function (s, x) { return s + x[1]; }, 0) / part.length;
  }
  var g1 = seg(0, 3), g2 = seg(3, 6), g3 = seg(6, 10);
  var btEl = document.getElementById("rc-bt");
  btEl.innerHTML =
    statBox("상위 1~3분위 (" + (e[0] - 10) + "→" + e[0] + ")", g1 != null ? pct(g1, 1) : "—", cls(g1)) +
    statBox("중위 4~6분위", g2 != null ? pct(g2, 1) : "—", cls(g2)) +
    statBox("하위 7~10분위", g3 != null ? pct(g3, 1) : "—", cls(g3)) +
    statBox("표본", bt.length + "개 지역");

  /* 전체 표 */
  var tb = document.querySelector("#rc-table tbody");
  tb.innerHTML = list.map(function (r, i) {
    var hit = cond.cash > 0 && r.fin.need <= cond.cash;
    return '<tr class="' + (hit ? "hit" : "") + '"><td>' + (i + 1) + "</td>" +
      "<td>" + (r.fin.reg ? "⛔ " : "") + disp(r.key) + "</td>" +
      "<td><b>" + r.total.toFixed(1) + "</b></td>" +
      "<td>" + r.s.rank.toFixed(0) + "</td>" +
      "<td>" + r.s.perf.toFixed(0) + "</td>" +
      "<td>" + r.s.supply.toFixed(0) + "</td>" +
      "<td>" + r.s.timing.toFixed(0) + "</td>" +
      "<td>" + r.s.cash.toFixed(0) + "</td>" +
      "<td>" + r.fin.modeName + "</td>" +
      "<td><b>" + eok(r.fin.need) + "</b></td>" +
      "<td>" + (r.dist != null ? r.dist + "km" : "—") + "</td></tr>";
  }).join("");
}

var VOL = { lawd: "", regionKey: "", months: 24, rows: [] };
var chartVol = null;

function buildVol(root) {
  root.innerHTML =
    '<div class="card">' +

function median(arr) {
  if (!arr.length) return null;
  var s = arr.slice().sort(function (a, b) { return a - b; });
  var m = Math.floor(s.length / 2);
  return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2;
}

function loadVol() {
  var manual = (document.getElementById("vl-lawd").value || "").trim();
  var lawd = /^\d{5}$/.test(manual) ? manual : document.getElementById("vl-region").value;
  if (!lawd) { alert("지역을 선택하세요."); return; }
  VOL.lawd = lawd;
  var btn = document.getElementById("vl-go");
  btn.disabled = true;
  var months = ymList(VOL.months).reverse();   /* 과거→현재 순 */
  var done = 0;
  btn.textContent = "불러오는 중… (0/" + months.length + ")";
  Promise.all(months.map(function (ym) {
    return fetchTrade(lawd, "sale", ym)
      .then(function (j) {
        done++; btn.textContent = "불러오는 중… (" + done + "/" + months.length + ")";
        if (j.error) throw new Error(j.error + (j.msg ? " · " + j.msg : ""));
        var deals = (j.items || []).filter(function (t) { return !t.canceled && t.amount > 0 && t.area > 0; });
        return { ym: ym, cnt: deals.length,
                 pyMed: median(deals.map(function (t) { return t.amount / t.area * 3.3058; })) };
      });
  })).then(function (rows) {
    VOL.rows = rows;
    var totalDeals = rows.reduce(function (a, r) { return a + r.cnt; }, 0);
    if (!totalDeals) {
      alert("이 지역 코드로 조회된 실거래가 없습니다.\n신설 구는 국토부 코드가 아직 확정 반영되지 않았을 수 있으니 상위 지역(예: 화성시 전체)으로 시도해보세요.");
    }
    renderVolResult();
  }).catch(function (e) {
    var m = String(e.message || e);
    alert("거래량 조회 실패: " + m + (/제한|초과|502/i.test(m)
      ? "\n\n공공데이터 서버 요청이 몰린 상태입니다. 20~30초 뒤 다시 시도하거나, 조회 기간을 12개월로 줄여보세요." : ""));
  }).finally(function () {
    btn.disabled = false; btn.textContent = "거래량 불러오기";
  });
}

function renderVolResult() {
  var rows = VOL.rows;
  /* 12개월 이동평균 */
  rows.forEach(function (r, i) {
    if (i >= 11) {
      var s = 0;
      for (var j = i - 11; j <= i; j++) s += rows[j].cnt;
      r.ma = s / 12;
    } else r.ma = null;
  });
  /* 최근 1개월은 신고 지연으로 제외하고 판정 */
  var solid = rows.slice(0, -1);
  var last3 = solid.slice(-3), prev3 = solid.slice(-6, -3);
  var avg3 = last3.reduce(function (a, r) { return a + r.cnt; }, 0) / last3.length;
  var ma12 = solid[solid.length - 1].ma;
  var ratio = ma12 ? avg3 / ma12 : null;
  var p3 = median(last3.map(function (r) { return r.pyMed; }).filter(function (v) { return v != null; }));
  var p3prev = median(prev3.map(function (r) { return r.pyMed; }).filter(function (v) { return v != null; }));
  var priceChg = (p3 && p3prev) ? (p3 / p3prev - 1) * 100 : null;

  var phase, phaseC;
  var volUp = ratio != null && ratio >= 1.0, priceUp = priceChg != null && priceChg > 0;
  if (priceUp && volUp) { phase = "강한 상승"; phaseC = "up"; }
  else if (priceUp) { phase = "상승 동력 둔화"; phaseC = "down"; }
  else if (volUp) { phase = "손바뀜 · 바닥 탐색"; phaseC = "flat"; }
  else { phase = "침체 지속"; phaseC = "flat"; }

  document.getElementById("vl-kpi").innerHTML =
    statBox("최근 3개월 월평균", Math.round(avg3) + "건") +
    statBox("거래량 배율 (3m÷12m)", ratio != null ? ratio.toFixed(2) + "배" : "—", ratio != null ? (ratio >= 1.3 ? "up" : (ratio <= 0.7 ? "down" : "")) : "") +
    statBox("평당가 3개월", priceChg != null ? pct(priceChg, 1) : "—", cls(priceChg)) +
    statBox("국면 판정", phase, phaseC);

  var read = document.getElementById("vl-read");
  read.style.display = "";
  read.innerHTML = "<b>어떤 인사이트를 얻나</b> — 가격은 호가만으로도 오르지만 거래량은 거짓말을 못 합니다. " +
    "실제로 사는 사람이 있는지, 파는 사람만 호가를 올려둔 것인지를 여기서 구분합니다. 매수는 거래가 붙기 " +
    "시작하는 초입이, 매도는 거래가 마르기 전이 낫습니다.<br>" +
    "<b>가격 × 거래량 조합</b> — 가격↑거래↑ 강한 상승 (매수세가 실제로 붙음) · " +
    "가격↑거래↓ 상승 동력 둔화 (호가만 오르고 손바뀜 없음) · 가격↓거래↑ 손바뀜·바닥 탐색 · 가격↓거래↓ 침체 지속. " +
    "배율 1.3 이상이면 뚜렷한 유입, 0.7 이하면 관망입니다.";

  var css = getComputedStyle(document.documentElement);
  var cUp = css.getPropertyValue("--up").trim(), cDown = css.getPropertyValue("--down").trim();
  document.getElementById("vl-chartcard").style.display = "";
  if (chartVol) chartVol.destroy();
  chartVol = new Chart(document.getElementById("vl-chart"), {
    data: {
      labels: rows.map(function (r) { return r.ym.slice(0, 4) + "." + Number(r.ym.slice(4)); }),
      datasets: [
        { type: "bar", label: "월 거래건수", data: rows.map(function (r) { return r.cnt; }),
          backgroundColor: cUp + "99", borderRadius: 2, order: 2 },
        { type: "line", label: "12개월 이동평균", data: rows.map(function (r) { return r.ma; }),
          borderColor: cDown, borderWidth: 2, pointRadius: 0, tension: .2, order: 1 }
      ]
    },
    options: chartOpts("건")
  });

  document.getElementById("vl-tablecard").style.display = "";
  var tb = document.querySelector("#vl-table tbody");
  tb.innerHTML = rows.slice().reverse().map(function (r, i, arr) {
    var prev = arr[i + 1];
    var chg = (prev && prev.cnt > 0) ? (r.cnt / prev.cnt - 1) * 100 : null;
    return "<tr><td>" + r.ym.slice(0, 4) + "." + r.ym.slice(4) + "</td>" +
      "<td><b>" + r.cnt + "건</b></td>" +
      '<td class="' + cls(chg) + '">' + (chg != null ? pct(chg, 1) : "—") + "</td>" +
      "<td>" + (r.ma != null ? r.ma.toFixed(1) + "건" : "—") + "</td>" +
      "<td>" + (r.pyMed != null ? fmt(r.pyMed) + "만" : "—") + "</td></tr>";
  }).join("");
}

/* KB 지역키 → 코드 (기존 호출 호환). onDataReady에서 채움 */
var LAWD = {};
var NEW_DISTRICT = { "인천광역시|제물포구": "중구", "인천광역시|영종구": "중구",
  "인천광역시|검단구": "서구", "인천광역시|서해구": "서구" };
var PARENT_CITY = { "화성시": "경기|화성" };
var KB_SIDO = { "강북14개구": "서울", "강남11개구": "서울", "부산광역시": "부산", "대구광역시": "대구",
  "인천광역시": "인천", "(구)광주광역시": "광주", "전남광주통합특별시": "광주", "대전광역시": "대전",
  "울산광역시": "울산", "세종특별자치시": "세종", "강원특별자치도": "강원", "충청북도": "충북",
  "충청남도": "충남", "전북특별자치도": "전북", "(구)전라남도": "전남", "경상북도": "경북",
  "경상남도": "경남", "제주특별자치도": "제주" };
function buildLawdMap() {
  var idx = {};
  function norm(s) { return String(s).replace(/\s/g, "").replace(/시$/, ""); }
  LAWD_GROUPS.forEach(function (g) {
    g.items.forEach(function (it) {
      idx[g.sido + "|" + norm(it[0])] = it[1];
      var parts = it[0].split(" ");
      if (parts.length === 2) idx[g.sido + "|" + norm(parts[0] + parts[1])] = it[1];
    });
  });
  LAWD = {};
  if (!DB) return;
  Object.keys(DB.salePm.series).forEach(function (k) {
    var top = k.indexOf("|") >= 0 ? k.split("|")[0] : k;
    var sub = k.indexOf("|") >= 0 ? k.split("|")[1] : "";
    var sido = KB_SIDO[top];
    var cand = [];
    if (sido && !sub) { cand.push(sido + "|" + norm(sido)); cand.push(sido + "|" + norm(top)); }
    else if (sido) { cand.push(sido + "|" + norm(sub)); cand.push(sido + "|" + norm(NEW_DISTRICT[k] || "")); }
    else if (sub) {
      ["경기", "충북", "충남", "전북", "경북", "경남", "강원"].forEach(function (s) {
        cand.push(s + "|" + norm(top) + norm(sub));
        cand.push(s + "|" + norm(sub));
      });
    } else {
      ["경기", "강원", "충북", "충남", "전북", "전남", "경북", "경남", "제주"].forEach(function (s) {
        cand.push(s + "|" + norm(top));
      });
    }
    if (sub && PARENT_CITY[top]) cand.push(PARENT_CITY[top]);
    for (var i = 0; i < cand.length; i++) if (idx[cand[i]]) { LAWD[k] = idx[cand[i]]; return; }
  });
}

/* 지역 셀렉트: 시·도 그룹(optgroup)으로 접히는 구조. 값은 법정동코드 */
/* KB 지역키의 시·도 이름과 표시명 */
function kbSido(k) {
  var top = (k.indexOf("|") >= 0 ? k.split("|")[0] : k).replace(/\s/g, "");
  if (KB_SIDO[top]) return KB_SIDO[top];
  var code = LAWD[k];
  if (code) {
    var c = String(code).split(":")[0];
    for (var i = 0; i < LAWD_GROUPS.length; i++) {
      var g = LAWD_GROUPS[i];
      for (var j = 0; j < g.items.length; j++) {
        if (String(g.items[j][1]).split(":")[0] === c) return g.sido;
      }
    }
  }
  return "기타";
}
function kbLabel(k) {
  var top = (k.indexOf("|") >= 0 ? k.split("|")[0] : k).replace(/\s/g, "");
  var sub = k.indexOf("|") >= 0 ? k.split("|")[1] : "";
  if (KB_SIDO[top]) return sub || top;              /* 광역시 산하 구 → "강남구" */
  return sub ? top.replace(/시$/, "") + " " + sub : top;   /* "수원 영통구", "과천시" */
}
/* KB 통계 기반 탭용: 시·도 그룹 + 정리된 이름, 값은 KB 키 */
/* minMonths를 주면 salePm 표본이 그보다 짧은 지역(신설구 등)은 목록에서 뺀다 */
function fillKbRegionSelect(id, keys, selected, minMonths) {
  var sel = document.getElementById(id);
  if (!sel) return;
  if (minMonths) {
    var kept = [], parents = [];
    keys.forEach(function (k) {
      var s = DB.salePm.series[ik(k)] || DB.salePm.series[k];
      if (s && s.v.length >= minMonths) { kept.push(k); return; }
      /* 표본 부족으로 빠지는 하위 구 → 상위 지역으로 대체 (예: 화성 신설구 → 화성시) */
      if (k.indexOf("|") >= 0) {
        var p = k.split("|")[0];
        var ps = DB.salePm.series[p];
        if (ps && ps.v.length >= minMonths && kept.indexOf(p) < 0 && parents.indexOf(p) < 0 &&
            keys.indexOf(p) < 0) parents.push(p);
      }
    });
    keys = kept.concat(parents);
  }
  var order = ["전국·권역"].concat(LAWD_GROUPS.map(function (g) { return g.sido; }));
  var byS = {};
  keys.forEach(function (k) {
    var s = kbSido(k);
    if (s === "기타") s = "전국·권역";
    (byS[s] = byS[s] || []).push(k);
  });
  sel.innerHTML = "";
  order.forEach(function (s) {
    if (!byS[s]) return;
    var og = document.createElement("optgroup");
    og.label = s;
    byS[s].forEach(function (k) {
      var o = document.createElement("option");
      o.value = k; o.textContent = kbLabel(k);
      og.appendChild(o);
    });
    sel.appendChild(og);
  });
  if (selected && sel.querySelector('option[value="' + selected.replace(/"/g, '\\"') + '"]')) sel.value = selected;
}

function fillRegionSelects(ids) {
  ids.forEach(function (id) {
    var sel = document.getElementById(id);
    if (!sel || sel.options.length) return;
    LAWD_GROUPS.forEach(function (g) {
      var og = document.createElement("optgroup");
      og.label = g.sido;
      g.items.forEach(function (it) {
        var o = document.createElement("option");
        o.value = it[1]; o.textContent = it[0];
        og.appendChild(o);
      });
      sel.appendChild(og);
    });
  });
}

function lawdName(code) {

    for (var j = 0; j < g.items.length; j++) if (g.items[j][1] === code) return g.sido + " " + g.items[j][0];
  }

}
function kbKeyOfLawd(code) {
