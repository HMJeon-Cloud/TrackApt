var SUPPLY_MEMO = {};
function loadSupply() {
  SP.loading = true;
  var btn = document.getElementById("sp-go");
  btn.disabled = true;
  var mySido = SP.sido;
  function one(s) {
    if (SUPPLY_MEMO[s]) return Promise.resolve(SUPPLY_MEMO[s]);
    return apiGet("/api/supply?sido=" + encodeURIComponent(s)).then(function (j) {
      if (!j.error) SUPPLY_MEMO[s] = j;
      return j;
    });
  }
  var p;
  if (mySido === "전국") {
    var sidos = Object.keys(SIDO_POP);
    var done = 0;
    btn.textContent = "전국 불러오는 중… (0/" + sidos.length + ")";
    p = Promise.all(sidos.map(function (s) {
      return one(s).then(function (j) {
        done++;
        btn.textContent = "전국 불러오는 중… (" + done + "/" + sidos.length + ")";
        return { s: s, j: j };
      });
    })).then(function (res) {
      var items = [], count = 0, from = "", errs = [];
      res.forEach(function (x) {
        if (x.j.error) { errs.push(x.s); return; }
        count += x.j.count || 0;
        from = x.j.from || from;
        (x.j.items || []).forEach(function (it) {
          it.sido = x.s;
          items.push(it);
        });
      });
      if (!items.length && errs.length) throw new Error("전 시·도 조회 실패 (" + errs.join(",") + ")");
      return { sido: "전국", from: from, count: count, items: items, failed: errs };
    });
  } else {
    p = one(mySido).then(function (j) {
      if (j.error) throw new Error(j.error + (j.detail ? " · " + j.detail : "") + (j.hint ? "\n" + j.hint : ""));
      (j.items || []).forEach(function (it) { it.sido = mySido; });
      return j;
    });
  }
  p.then(function (j) {
      if (SP.sido !== mySido) return;      /* 조회 중 지역이 바뀌면 버림 */
      SP.data = j;
      renderSupply();
    })
    .catch(function (e) { alert("입주물량 조회 실패: " + e.message); })
    .finally(function () { SP.loading = false; btn.disabled = false; btn.textContent = "입주물량 불러오기"; });
}

function sigunguOf(addr, sido) {
  var t = String(addr).split(/\s+/);
  /* "경기도 수원시 영통구 …" → 수원시 영통구, "충청북도 청주시 …" → 청주시 … */
  var i = 1;
  if (t.length < 2) return "기타";
  var out = t[1] || "";
  if (t[2] && /구$/.test(t[2])) out += " " + t[2];
  return out || "기타";
}

function renderSupply() {
  var now = new Date();
  var curYm = now.getFullYear() * 100 + (now.getMonth() + 1);
  function ymAdd(ym, n) {
    var y = Math.floor(ym / 100), m = ym % 100 + n;
    y += Math.floor((m - 1) / 12); m = ((m - 1) % 12) + 1;
    return y * 100 + m;
  }
  var horizon12 = ymAdd(curYm, 12);
  var items = SP.data.items.filter(function (it) { return it.moveInYm && Number(it.moveInYm) >= curYm; });

  /* 월별 합산 (향후 24개월) */
  var byYm = {};
  var next12 = 0, totalAll = 0;
  items.forEach(function (it) {
    var ym = Number(it.moveInYm);
    totalAll += it.households;
    if (ym <= horizon12) next12 += it.households;
    if (ym <= ymAdd(curYm, 24)) byYm[ym] = (byYm[ym] || 0) + it.households;
  });
  var yms = Object.keys(byYm).map(Number).sort(function (a, b) { return a - b; });

  var next24 = 0;
  items.forEach(function (it) {
    if (Number(it.moveInYm) <= ymAdd(curYm, 24)) next24 += it.households;
  });
  var pop = SP.sido === "전국"
    ? Object.keys(SIDO_POP).reduce(function (a, s) { return a + SIDO_POP[s]; }, 0)
    : SIDO_POP[SP.sido];
  var demand = Math.round(pop * 0.005);
  var ratio = demand ? next12 / demand : null;

  document.getElementById("sp-kpi").innerHTML =
    statBox("향후 12개월 입주물량", fmt(next12) + "세대") +
    statBox("24개월 누적", fmt(next24) + "세대") +
    statBox("연간 추정 수요", fmt(demand) + "세대", "", "인구 " + fmt(pop) + "명 × 0.5% 가정") +
    statBox("수급 배율", ratio != null ? ratio.toFixed(2) + "배" : "—",
      ratio != null ? (ratio >= 1.3 ? "down" : (ratio <= 0.7 ? "up" : "")) : "") +
    statBox("공고 기준", SP.data.count + "건 (" + SP.data.from + "~)" +
      (SP.data.failed && SP.data.failed.length ? " · 실패 " + SP.data.failed.join(",") : ""));

  /* 수급 읽기 — 참고 앱 형식의 자동 요약 */
  var readEl = document.getElementById("sp-read");
  if (readEl) {
    var lines = [];
    lines.push("<b>" + SP.sido + "</b> 향후 12개월 입주물량은 <b>" + fmt(next12) + "세대</b>, 연간 추정 수요 " +
      fmt(demand) + "세대 대비 <b>" + (ratio != null ? ratio.toFixed(2) + "배" : "—") + "</b>입니다. " +
      (ratio == null ? "" : ratio >= 1.3 ? "공급이 수요를 크게 웃돌아 전세 하방 압력을 봐야 합니다."
        : ratio <= 0.7 ? "공급이 부족한 편이라 물량 부담이 적습니다." : "수요와 공급이 대체로 균형입니다."));
    if (SP.sido === "전국") {
      /* 시·도별 배율 상·하위 */
      var bySido = {};
      items.forEach(function (it) {
        if (Number(it.moveInYm) > horizon12) return;
        bySido[it.sido] = (bySido[it.sido] || 0) + it.households;
      });
      var ranks = Object.keys(SIDO_POP).map(function (s) {
        var d = SIDO_POP[s] * 0.005;
        return { s: s, r: d ? (bySido[s] || 0) / d : 0 };
      }).sort(function (a, b) { return b.r - a.r; });
      var hi = ranks.slice(0, 3).map(function (x) { return x.s + " " + x.r.toFixed(2) + "배"; });
      var lo = ranks.slice(-3).reverse().map(function (x) { return x.s + " " + x.r.toFixed(2) + "배"; });
      lines.push("배율이 높은 곳(공급 과다) — " + hi.join(" · ") + ". 전세 하방 압력이 큰 지역입니다.");
      lines.push("배율이 낮은 곳(공급 부족) — " + lo.join(" · ") + ". 물량 부담이 적은 지역입니다.");
    }
    readEl._lines = lines;
    readEl.style.display = "";
    readEl.innerHTML = "<b>수급 읽기</b><br>" + lines.map(function (l) { return "• " + l; }).join("<br>");
  }

  var css = getComputedStyle(document.documentElement);
  var cUp = css.getPropertyValue("--up").trim();
  document.getElementById("sp-chartcard").style.display = "";
  if (chartSupply) chartSupply.destroy();
  chartSupply = new Chart(document.getElementById("sp-chart"), {
    type: "bar",
    data: { labels: yms.map(function (ym) { return Math.floor(ym / 100) + "." + (ym % 100); }),
      datasets: [{ label: "입주 예정 세대", data: yms.map(function (ym) { return byYm[ym]; }),
        backgroundColor: cUp + "99", borderRadius: 2 }] },
    options: chartOpts("세대")
  });

  /* ── 확장 데이터 렌더 ── */
  var extMiss = document.getElementById("sp-extmiss");
  if (extMiss) extMiss.style.display = SUPPLY_EXT ? "none" : "";
  renderSupplyExt();

  /* 시군구별 */
  var byRegion = {};
  items.forEach(function (it) {
    var r = sigunguOf(it.addr, it.sido || SP.sido);
    if (SP.sido === "전국" && it.sido) r = it.sido + " " + r;
    var g = byRegion[r] = byRegion[r] || { r: r, n12: 0, all: 0, cnt: 0 };
    g.all += it.households; g.cnt++;
    if (Number(it.moveInYm) <= horizon12) g.n12 += it.households;
  });
  var regions = Object.keys(byRegion).map(function (r) { return byRegion[r]; })
    .sort(function (a, b) { return b.n12 - a.n12; });
  if (readEl) {
    var t3 = regions.slice(0, 3).filter(function (g) { return g.n12 > 0; })
      .map(function (g) { return g.r + "(" + fmt(g.n12) + "세대)"; });
    if (t3.length) {
      var extra = "물량이 몰리는 곳은 <b>" + t3.join(" · ") + "</b>입니다. 입주 직전 6개월은 전세가 밀리는 " +
        "구간이라 갭투자 진입 시점으로는 유리하지만, 역전세 위험도 같이 커집니다.";
      readEl.innerHTML = "<b>수급 읽기</b><br>" +
        readEl._lines.concat([extra]).map(function (l) { return "• " + l; }).join("<br>");
    }
  }
  document.getElementById("sp-tablecard").style.display = "";
  var extPop = SUPPLY_EXT && SUPPLY_EXT.population && SUPPLY_EXT.population.sigungu;
  var extUnD = SUPPLY_EXT && SUPPLY_EXT.unsoldDone;
  var extUnA = SUPPLY_EXT && SUPPLY_EXT.unsold ? SUPPLY_EXT.unsold : null;
  var thead = document.querySelector("#sp-table thead tr");
  if (thead) thead.innerHTML = "<th>시·군·구</th><th>12개월 물량</th><th>24개월</th><th>공고</th>" +
    (extPop ? "<th>인구</th><th>추정 수요</th><th>자체 배율</th>" : "") +
    (extUnA ? "<th>미분양</th>" : "") + (extUnD ? "<th>준공후</th>" : "");
  document.querySelector("#sp-table tbody").innerHTML = regions.map(function (g) {
    var full = g.r.indexOf(" ") > 0 || SP.sido === "전국" ? g.r : SP.sido + " " + g.r;
    var popG = extPop ? (extPop[full] || extPop[g.r]) : null;
    var demG = popG ? Math.round(popG * 0.005) : null;
    var ratG = demG ? g.n12 / demG : null;
    /* 미분양은 시 단위까지만 집계된다 — "수원시 영통구"는 "수원시"로 되짚는다 */
    function unsoldOf(blk) {
      if (!blk) return null;
      var v = extLast(blk, full);
      if (v == null) v = extLast(blk, g.r);
      if (v == null) v = extLast(blk, full.replace(/\s\S+구$/, ""));
      return v;
    }
    var unA = unsoldOf(extUnA), unD = unsoldOf(extUnD);
    return '<tr class="' + (ratG != null ? (ratG >= 1.3 ? "hit" : "") : (g.n12 >= 5000 ? "hit" : "")) +
      '"><td>' + g.r + "</td>" +
      "<td><b>" + fmt(g.n12) + "</b></td><td>" + fmt(g.all) + "</td><td>" + g.cnt + "</td>" +
      (extPop ? "<td>" + (popG ? fmt(popG) : "—") + "</td><td>" + (demG ? fmt(demG) : "—") + "</td><td>" +
        (ratG != null ? '<span class="' + (ratG >= 1.3 ? "neg" : (ratG <= 0.7 ? "pos" : "")) + '">' +
          ratG.toFixed(2) + "배</span>" : "—") + "</td>" : "") +
      (extUnA ? "<td>" + (unA != null ? fmt(unA) + "호" : "—") + "</td>" : "") +
      (extUnD ? "<td>" + (unD != null ?
        '<span class="' + (unA && unD / unA >= 0.5 ? "neg" : "") + '">' + fmt(unD) + "호</span>" : "—") +
        "</td>" : "") + "</tr>";
  }).join("");
}

/* ══ 백테스트 탭 (상급지 중간 vs 중급지 대장) ══ */
var BT = { a: "", b: "", band: 84, mode: "rank", years: 10 };
/* 비교 모드 정의 — cats: 표에 나올 그룹, pair: 판정에 쓸 [A그룹, B그룹] */
var BT_MODES = {
  rank: { name: "평당가 순위 (대장 vs 중간)", cats: ["대장", "중간"], pair: ["중간", "대장"],
    note: "<b>평당가 순위 기준</b> — 검증 시작 시점 평당가로 줄 세워 상위 20%를 <b>대장</b>, " +
      "40~60%를 <b>중간</b>으로 나눕니다. 핵심 비교는 \"상급지 중간 vs 중급지 대장\"입니다." },
  size: { name: "세대수 (나홀로 vs 대단지)", cats: ["나홀로", "대단지"], pair: ["나홀로", "대단지"],
    note: "<b>세대수 기준</b> — 300세대 미만을 <b>나홀로</b>, 1000세대 이상을 <b>대단지</b>로 나눕니다. " +
      "K-apt에서 세대수를 조회하므로 시간이 조금 더 걸립니다." },
  area: { name: "평형 (소형 vs 중형 vs 대형)", cats: ["소형", "중형", "대형"], pair: ["소형", "대형"],
    note: "<b>평형 기준</b> — <b>소형</b> 55㎡ 미만(14·18평), <b>중형</b> 55~95㎡(59·84), " +
      "<b>대형</b> 95㎡ 이상. 위 평형 선택은 무시하고 전체 거래를 봅니다." },
  age: { name: "노후도 (신축 vs 구축)", cats: ["신축", "준구축", "구축"], pair: ["구축", "신축"],
    note: "<b>노후도 기준</b> — <b>검증 시작 시점</b>의 연차로 나눕니다(지금 연차가 아닙니다). " +
      "10년 미만 <b>신축</b>, 10~24년 <b>준구축</b>, 25년 이상 <b>구축</b>. 실거래에 딸려오는 " +
      "건축년도를 쓰므로 추가 조회는 없습니다. <b>평형을 84㎡대로 고정</b>하고 돌려야 평형 효과와 " +
      "섞이지 않습니다." }
};
function areaClass(a) { return a < 55 ? "소형" : (a < 95 ? "중형" : "대형"); }
function ageClass(y) { return y < 10 ? "신축" : (y < 25 ? "준구축" : "구축"); }
function sizeClass(hh) { return hh == null ? null : (hh < 300 ? "나홀로" : (hh >= 1000 ? "대단지" : null)); }

/* K-apt로 단지 세대수 채우기 (size 모드 전용, 후보 상한으로 호출 억제) */
function attachHouseholds(region, groups, onTick) {
  var top = groups.slice(0, 40);      /* 호출 상한: 평당가 상위 40개 단지 */
  return fetchKaptList(lawdCandidates(region)[0]).then(function (list) {
    return Promise.all(top.map(function (g) {
      var hit = matchKapt(list, g.apt, g.dong);
      if (!hit) { if (onTick) onTick(); return null; }
      if (KAPT_INFO_MEMO[hit.kaptCode]) {
        g.hh = KAPT_INFO_MEMO[hit.kaptCode].households || null;
        if (onTick) onTick(); return null;
      }
      return apiGet("/api/apt?kind=info&kapt=" + hit.kaptCode).then(function (j) {
        if (!j.error && j.info) { KAPT_INFO_MEMO[hit.kaptCode] = j.info; g.hh = j.info.households || null; }
        if (onTick) onTick();
      }).catch(function () { if (onTick) onTick(); });
    }));
  });
}

function renderBtestShell() {
  if (!DB) return;
  fillRegionSelects(["bt-a", "bt-b"]);
  var b = document.getElementById("bt-b");
  if (b && b.selectedIndex === 0 && b.options.length > 25) b.selectedIndex = 25;

function ymShift(ym, n) {
  /* 월을 0기준 절대개월수로 바꿔 계산 — 음수 이동에도 안전 */
  var t = Math.floor(ym / 100) * 12 + (ym % 100 - 1) + n;
  return Math.floor(t / 12) * 100 + (((t % 12) + 12) % 12) + 1;
}

/* 특정 (lawd, 과거 3개월) 매매 조회 — 캐시 포함 */
var OLD_CACHE = {};
function fetchOldQuarter(lawd, yms, onTick) {
  var key = lawd + ":" + yms.join(",");
  if (OLD_CACHE[key]) { return Promise.resolve(OLD_CACHE[key]); }
  return Promise.all(yms.map(function (ym) {
    return fetchTrade(lawd, "sale", ym)
      .then(function (j) {
        if (onTick) onTick();
        if (j.error) throw new Error(j.error + (j.msg ? " · " + j.msg : ""));
        return (j.items || []).filter(function (t) { return !t.canceled && t.amount > 0 && t.area > 0; });
      });
  })).then(function (lists) {
    var all = [].concat.apply([], lists);
    OLD_CACHE[key] = all;
    return all;
  });
}

function groupComplexes(deals, band) {
  var byApt = {};
  deals.forEach(function (t) {
    if (!inBand(t.area, band)) return;
    var id = t.dong + "|" + t.apt;
    (byApt[id] = byApt[id] || { id: id, apt: t.apt, dong: t.dong, amounts: [], areas: [] }).amounts.push(t.amount);
    byApt[id].areas.push(t.area);
  });
  return Object.keys(byApt).map(function (id) {
    var g = byApt[id];
    if (g.amounts.length < 2) return null;
    g.py = median(g.amounts) / median(g.areas) * 3.3058;
    return g;
  }).filter(Boolean).sort(function (a, b) { return b.py - a.py; });
}

function runBtest() {
  BT.a = document.getElementById("bt-a").value;
  BT.b = document.getElementById("bt-b").value;
  if (BT.a === BT.b) { alert("서로 다른 두 지역을 고르세요."); return; }
  var mode = BT.mode, band = mode === "area" ? 0 : BT.band;
  var btn = document.getElementById("bt-go");
  btn.disabled = true;
  var now = new Date();
  var curYm = now.getFullYear() * 100 + (now.getMonth() + 1);
  var mBack = BT.years * 12;
  var oldYms = [ymShift(curYm, -(mBack + 2)), ymShift(curYm, -(mBack + 1)), ymShift(curYm, -mBack)].map(String);
  var pastYear = Math.floor(Number(oldYms[2]) / 100);
  var done = 0;
  function tick() { done++; btn.textContent = "검증 중… (" + done + ")"; }
  btn.textContent = "검증 중… (0)";

  Promise.all([
    fetchOldQuarter(BT.a, oldYms, tick),
    fetchOldQuarter(BT.b, oldYms, tick),
    fetchMonths(BT.a, 6, tick),
    fetchMonths(BT.b, 6, tick)
  ]).then(function (res) {
    var work = [[BT.a, res[0], res[2]], [BT.b, res[1], res[3]]].map(function (trio) {
      var region = trio[0];
      var oldG = groupComplexesBt(trio[1], band, mode);
      var curDeals = [];
      trio[2].sale.forEach(function (m) { curDeals = curDeals.concat(m.deals); });
      var curG = groupComplexesBt(curDeals, band, mode);
      var curMap = {};
      curG.forEach(function (g) { curMap[g.id] = g; });
      oldG.forEach(function (g) {
        var cur = curMap[g.id];
        if (cur) { g.rise = (cur.py / g.py - 1) * 100; g.curPy = cur.py; }
      });
      /* 상승률 계산 가능한 단지만 남긴다 (생존 표본) */
      var alive = oldG.filter(function (g) { return g.rise != null; });
      return { region: region, groups: alive };
    });

    /* 모드별 분류 라벨 부여 */
    var classify = Promise.resolve();
    if (mode === "size") {
      classify = Promise.all(work.map(function (w) {
        return attachHouseholds(w.region, w.groups, tick);
      })).then(function () {
        work.forEach(function (w) {
          w.groups.forEach(function (g) { g.cat = sizeClass(g.hh); });
        });
      });
    } else {
      work.forEach(function (w) {
        if (mode === "rank") {
          var nn = w.groups.length;
          w.groups.forEach(function (g, i) {
            g.cat = i < nn * 0.2 ? "대장" : (i >= nn * 0.4 && i < nn * 0.6 ? "중간" : null);
          });
        } else if (mode === "area") {
          w.groups.forEach(function (g) { g.cat = g.cls; });
        } else {                     /* age */
          w.groups.forEach(function (g) {
            g.cat = g.buildYear ? ageClass(pastYear - g.buildYear) : null;
          });
        }
      });
    }

    return classify.then(function () {
      var out = [];
      work.forEach(function (w) {
        BT_MODES[mode].cats.forEach(function (cat) {
          var grp = w.groups.filter(function (g) { return g.cat === cat; });
          if (!grp.length) { out.push({ region: w.region, tier: cat, cnt: 0 }); return; }
          out.push({
            region: w.region, tier: cat, cnt: grp.length,
            oldPy: grp.reduce(function (s, g) { return s + g.py; }, 0) / grp.length,
            curPy: grp.reduce(function (s, g) { return s + g.curPy; }, 0) / grp.length,
            rise: grp.reduce(function (s, g) { return s + g.rise; }, 0) / grp.length
          });
        });
      });
      BT.out = out; BT.outMode = mode;
      renderBtestResult(oldYms);
    });
  }).catch(function (e) {
    alert("백테스트 실패: " + e.message);
  }).finally(function () {
    btn.disabled = false; btn.textContent = "검증하기";
  });
}

/* 백테스트용 단지 묶기 — 평형 모드는 (단지×평형대)로 쪼갠다 */
function groupComplexesBt(deals, band, mode) {
  var byApt = {};
  deals.forEach(function (t) {
    if (band && !inBand(t.area, band)) return;
    var cls = mode === "area" ? areaClass(t.area) : "";
    var id = t.dong + "|" + t.apt + (cls ? "|" + cls : "");
    var g = byApt[id] || (byApt[id] = { id: id, apt: t.apt, dong: t.dong, cls: cls,
                                        amounts: [], areas: [], buildYear: t.buildYear });
    g.amounts.push(t.amount); g.areas.push(t.area);
    if (t.buildYear && !g.buildYear) g.buildYear = t.buildYear;
  });
  return Object.keys(byApt).map(function (id) {
    var g = byApt[id];
    if (g.amounts.length < 2) return null;
    g.py = median(g.amounts) / median(g.areas) * 3.3058;
    return g;
  }).filter(Boolean).sort(function (a, b) { return b.py - a.py; });
}

var BT_SUB = { "대장": " (상위 20%)", "중간": " (40~60%)", "나홀로": " (300세대↓)", "대단지": " (1000세대↑)",
  "소형": " (55㎡↓)", "중형": " (55~95㎡)", "대형": " (95㎡↑)",
  "신축": " (10년↓)", "준구축": " (10~24년)", "구축": " (25년↑)" };
function renderBtestResult(oldYms) {
  var out = BT.out, md = BT_MODES[BT.outMode], pair = md.pair;
  document.getElementById("bt-resultcard").style.display = "";
  document.querySelector("#bt-table tbody").innerHTML = out.map(function (g) {
    var name = lawdName(g.region) + " " + g.tier + (BT_SUB[g.tier] || "");
    if (!g.cnt) return "<tr><td>" + name + '</td><td colspan="4" style="color:var(--miss)">표본 없음</td></tr>';
    var isKey = (g.region === BT.a && g.tier === pair[0]) || (g.region === BT.b && g.tier === pair[1]);
    return '<tr class="' + (isKey ? "hit" : "") + '"><td>' + name + "</td>" +
      "<td>" + g.cnt + "곳</td>" +
      "<td>" + fmt(g.oldPy) + "만</td>" +
      "<td>" + fmt(g.curPy) + "만</td>" +
      '<td class="' + cls(g.rise) + '"><b>' + pct(g.rise, 1) + "</b></td></tr>";
  }).join("");

  var aG = out.filter(function (g) { return g.region === BT.a && g.tier === pair[0] && g.cnt; })[0];
  var bG = out.filter(function (g) { return g.region === BT.b && g.tier === pair[1] && g.cnt; })[0];
  var v = document.getElementById("bt-verdict");
  if (aG && bG) {
    var diff = aG.rise - bG.rise;
    var aName = "<b>" + lawdName(BT.a) + " " + pair[0] + " " + pct(aG.rise, 1) + "</b>";
    var bName = "<b>" + lawdName(BT.b) + " " + pair[1] + " " + pct(bG.rise, 1) + "</b>";
    v.innerHTML = "핵심 비교 — " + aName + " vs " + bName +
      " (" + oldYms[0].slice(0, 4) + "년 → 현재). " +
      (diff > 3 ? "이 구간에서는 <b>" + lawdName(BT.a) + " " + pair[0] + "</b>이 앞섰습니다 (" + pct(diff, 1) + "p). " +
          "당시 가격대가 비슷했다면 급지를 올리는 선택이 나았다는 뜻입니다."
        : diff < -3 ? "이 구간에서는 <b>" + lawdName(BT.b) + " " + pair[1] + "</b>이 앞섰습니다 (" + pct(-diff, 1) + "p). " +
          "급지 원칙의 예외 구간이니 왜 그랬는지(신축 공급·호재) 확인해볼 가치가 있습니다."
        : "두 선택의 차이가 " + pct(diff, 1) + "p로 크지 않았습니다. 이 조합에서는 조건보다 개별 단지 선택이 결과를 갈랐습니다.");
  } else {
    v.innerHTML = "표본이 부족해 핵심 비교를 만들 수 없습니다. 거래가 더 많은 지역 조합·긴 기간·84㎡대로 다시 시도해보세요." +
      (BT.outMode === "size" ? " (세대수는 K-apt 등록 단지만 알 수 있습니다 — 소규모 단지가 많은 지역은 표본이 적습니다.)" : "");
  }
}

/* 시·도 단위 KB 키 (집계 그룹 제외) */
function tierSidoKeys() {
  var skip = { "전국": 1, "수도권": 1, "6개광역시": 1, "5개광역시": 1, "기타지방": 1,
               "전남광주 통합특별시": 1 };
  return Object.keys(DB.salePm.series).filter(function (k) {
    return k.indexOf("|") < 0 && !skip[k] && /(특별시|광역시|자치시|도)$/.test(k) &&
      (DB.salePm.series[k].v || []).length >= 24;
  }).sort(function (a, b) { return lastVal("salePm", b) - lastVal("salePm", a); });
}

/* 전체 기간 연복리 — 지수 시작(o)부터 최신까지 */
function fullCagr(region) {
  var arr = pmSeries("salePm", ik(region)) || pmSeries("salePm", region);
  if (!arr) return null;
  var i0 = -1, i1 = -1;
  for (var i = 0; i < arr.length; i++) if (arr[i] != null) { if (i0 < 0) i0 = i; i1 = i; }
  if (i0 < 0 || i1 - i0 < 24 || !arr[i0]) return null;
  var yrs = (i1 - i0) / 12;
  return (Math.pow(arr[i1] / arr[i0], 1 / yrs) - 1) * 100;
}

function tierRow(k, rankNo, decile, nAll) {
  var pm = lastVal("salePm", k), jpm = lastVal("jeonsePm", k);
  var arr = pmSeries("salePm", k);
  var band = arr ? bandStats(arr, 120) : null;
  var r3 = idxChange("sale", ik(k), 36);
  var r10 = idxChange("sale", ik(k), 120);
  var cagr10 = r10 != null ? (Math.pow(1 + r10 / 100, 1 / 10) - 1) * 100 : null;
  var cagrAll = fullCagr(k);
  return { k: k, rank: rankNo, decile: decile, nAll: nAll, pm: pm, jpm: jpm,
           band: band, r3: r3, r10: r10, cagr10: cagr10, cagrAll: cagrAll,
           jr: (pm && jpm) ? jpm / pm * 100 : null };
}

function renderTiers() {
  if (!DB || !RANKED.length) return;
  var kpi = document.getElementById("tr-kpi");
  if (!kpi) return;

  /* KPI — 통과 수·서울/전국 10년 */
  var passN = 0;
  RANKED.forEach(function (k) {
    var v = idxChange("sale", ik(k), 120);
    if (v != null && v >= 100) passN++;
  });
  var seoul10 = idxChange("sale", ik("서울특별시"), 120);
  var nat10 = idxChange("sale", ik("전국"), 120);
  function cagrSub(v) { return v == null ? "" : "CAGR " + ((Math.pow(1 + v / 100, 1 / 10) - 1) * 100).toFixed(1) + "%"; }
  kpi.innerHTML =
    statBox("10년 100% 통과", passN + " / " + RANKED.length, "", "시군구 중 10년간 두 배 이상 오른 곳") +
    statBox("서울 평균 10년", seoul10 != null ? pct(seoul10, 1) : "—", cls(seoul10), cagrSub(seoul10)) +
    statBox("전국 평균 10년", nat10 != null ? pct(nat10, 1) : "—", cls(nat10), cagrSub(nat10)) +
    statBox("통과 기준", "100%", "cash", "10년 2배 = CAGR 7.2%");

  /* 시·도 칩 (전국 순으로) */
  var chips = document.getElementById("tr-sido");
  if (chips && !chips.children.length) {
    var sidos = [], seen = {};
    RANKED.forEach(function (k) {
      var sd = kbSido(k);
      if (sd !== "기타" && !seen[sd]) { seen[sd] = 1; sidos.push(sd); }
    });
    chips.innerHTML =
      '<button type="button" data-s="" class="on">전국 시군구</button>' +
      sidos.map(function (sd) { return '<button type="button" data-s="' + sd + '">' + sd + "</button>"; }).join("") +
      '<button type="button" data-s="__sido">시·도 단위 (' + tierSidoKeys().length + "곳)</button>";
  }

  /* 행 계산 — 서열·분위는 항상 전국 기준 */
  var rows;
  if (TIERS.sido === "__sido") {
    var sk = tierSidoKeys();
    rows = sk.map(function (k, i) { return tierRow(k, i + 1, Math.ceil((i + 1) / sk.length * 10), sk.length); });
  } else {
    var nAll = RANKED.length;
    rows = RANKED.map(function (k, i) {
      return tierRow(k, i + 1, Math.min(10, Math.ceil((i + 1) / nAll * 10)), nAll);
    }).filter(function (r) {
      return !TIERS.sido || kbSido(r.k) === TIERS.sido;
    });
  }
  if (TIERS.top3) rows = rows.filter(function (r) { return r.decile <= 3; });

  var hd = document.getElementById("tr-salehd");
  if (hd) hd.textContent = TIERS.area + "㎡ 매매";
  var cond = getCond();
  document.querySelector("#tr-table tbody").innerHTML = rows.map(function (r) {
    var sale = r.pm ? r.pm * TIERS.area : null;
    var je = r.jpm ? r.jpm * TIERS.area : null;
    var bandCell = (r.band && r.band.count >= 24) ? bandBar(r.band.pctile, false)
      : '<span style="color:var(--miss)">표본 부족</span>';
    return '<tr class="' + (cond.home === r.k ? "mine" : "") + '">' +
      "<td>" + regionCell(r.k) + "</td>" +
      "<td>" + r.rank + "</td>" +
      '<td><span class="tier t' + r.decile + '">' + r.decile + "분위</span></td>" +
      "<td>" + (r.pm ? fmt(r.pm * 3.3058) : "—") + "</td>" +
      "<td>" + (sale ? eok(sale) : "—") + "</td>" +
      "<td>" + (je ? eok(je) : "—") + "</td>" +
      "<td>" + (r.jr ? r.jr.toFixed(1) + "%" : "—") + "</td>" +
      "<td>" + bandCell + "</td>" +
      '<td class="' + cls(r.r3) + '">' + (r.r3 != null ? pct(r.r3, 1) : "—") + "</td>" +
      '<td class="' + cls(r.r10) + '">' + (r.r10 != null ? "<b>" + pct(r.r10, 1) + "</b><br>" +
        '<span style="font-size:.72rem;color:var(--ink-soft)">연복리 ' + r.cagr10.toFixed(1) + "%</span>" : "—") + "</td>" +
      "<td>" + (r.cagr10 != null ? r.cagr10.toFixed(1) + "%" : "—") + "</td>" +
      "<td>" + (r.cagrAll != null ? r.cagrAll.toFixed(1) + "%" : "—") + "</td>" +
      "<td>" + (r.r10 == null ? "—" : (r.r10 >= 100 ? '<span class="tagmini ok">합격</span>'
        : '<span class="tagmini no">미달</span>')) + "</td>" +
      "<td>" + (isRegulated(r.k) ? '<span class="tagmini warn">규제</span>' : "") + "</td>" +
    "</tr>";
  }).join("") || '<tr><td colspan="14" style="color:var(--miss)">조건에 맞는 지역이 없습니다.</td></tr>';
}

function funIdxAt(arr, t0, ym, fwd) {
  /* ym(YYYYMM)의 지수. 없으면 앞뒤 3개월 내에서 찾는다 */
  var t = Math.floor(ym / 100) * 12 + (ym % 100);
  for (var d = 0; d <= 3; d++) {
    var i = t - t0 + (fwd ? d : -d);
    if (i >= 0 && i < arr.length && arr[i] != null) return arr[i];
  }
  return null;
}

/* 셀렉트는 DB 로드 후 첫 렌더에서 채운다 (buildFun은 부팅 시점이라 DB가 없다) */
function fillFunSelects() {
  var sel = document.getElementById("fun-region");
  if (!sel || sel.options.length) return;
  var groups = { "전국·권역": [], "서울": [], "그 외": [] };
  Object.keys(DB.sale.series).forEach(function (k) {
    if (k.indexOf("|") >= 0) { groups["서울"].push(k); return; }
    if (/전국|수도권|광역시$|광역시\)|기타지방/.test(k) && k.indexOf("특별") < 0) groups["전국·권역"].push(k);
    else if (/^서울|강북|강남/.test(k)) groups["서울"].push(k);
    else groups["그 외"].push(k);
  });
  sel.innerHTML = Object.keys(groups).map(function (g) {
    if (!groups[g].length) return "";
    return "<optgroup label=\"" + g + "\">" + groups[g].map(function (k) {
      return '<option value="' + k + '"' + (k === FUN.region ? " selected" : "") + ">" + k + "</option>";
    }).join("") + "</optgroup>";
  }).join("");
  /* ㎡당가 지역 셀렉트 (RANKED, 시·도 그룹) */
  var ws = document.getElementById("fun-wreg");
  var bySido = {};
  RANKED.forEach(function (k) {
    var sd = kbSido(k);
    (bySido[sd] = bySido[sd] || []).push(k);
  });
  if (!FUN.wageRegion) FUN.wageRegion = RANKED[0];
  ws.innerHTML = Object.keys(bySido).map(function (sd) {
    return "<optgroup label=\"" + sd + "\">" + bySido[sd].map(function (k) {
      return '<option value="' + k + '"' + (k === FUN.wageRegion ? " selected" : "") + ">" + kbLabel(k) + "</option>";
    }).join("") + "</optgroup>";
  }).join("");
  try { upgradeRegionSelects(sel.closest(".tab")); } catch (e) {}
}

function funChart(id, cfg) {
  if (FUN.charts[id]) { try { FUN.charts[id].destroy(); } catch (e) {} }
  var el = document.getElementById(id);
  if (!el) return;
  FUN.charts[id] = new Chart(el.getContext("2d"), cfg);
}

function renderFun() {
  if (!DB || !document.getElementById("fun-termtable")) return;
  fillFunSelects();
  var t0 = ymNum(DB.sale.dates[0]);
  var latest = latestYM("sale");
  var latestYm = latest[0] * 100 + latest[1];
  var nat = pmSeries("sale", "전국");
  var reg = pmSeries("sale", ik(FUN.region)) || nat;

  /* ── 정권별 ── */
  var labels = [], barNat = [], barReg = [], rowsHtml = "";
  FUN_TERMS.forEach(function (tm) {
    var name = tm[0], a = tm[1], b = tm[2] || latestYm, memo = tm[3];
    var months = (Math.floor(b / 100) * 12 + b % 100) - (Math.floor(a / 100) * 12 + a % 100);
    function chg(arr) {
      var v0 = funIdxAt(arr, t0, a, true), v1 = funIdxAt(arr, t0, b, false);
      return (v0 && v1) ? (v1 / v0 - 1) * 100 : null;
    }
    function cagr(c) { return c == null ? null : (Math.pow(1 + c / 100, 12 / months) - 1) * 100; }
    var cN = chg(nat), cR = chg(reg), gR = cagr(cR);
    labels.push(name);
    barNat.push(cagr(cN)); barReg.push(gR);
    rowsHtml += "<tr><td><b>" + name + "</b></td><td>" +
      Math.floor(a / 100) + "." + (a % 100) + "~" + (tm[2] ? Math.floor(b / 100) + "." + (b % 100) : "현재") +
      "</td><td class=\"" + cls(cN) + "\">" + (cN != null ? pct(cN, 1) : "—") + "</td>" +
      "<td class=\"" + cls(cR) + "\"><b>" + (cR != null ? pct(cR, 1) : "—") + "</b></td>" +
      "<td class=\"" + cls(gR) + "\">" + (gR != null ? pct(gR, 1) + "/년" : "—") + "</td>" +
      "<td style=\"color:var(--ink-soft)\">" + memo + "</td></tr>";
  });
  document.getElementById("fun-th-region").textContent = FUN.region;
  document.querySelector("#fun-termtable tbody").innerHTML = rowsHtml;
  funChart("fun-terms", { type: "bar", data: { labels: labels, datasets: [
    { label: "전국 연평균", data: barNat, backgroundColor: "rgba(212,175,106,.35)" },
    { label: FUN.region + " 연평균", data: barReg, backgroundColor: "#d4af6a" }] },
    options: { responsive: true, maintainAspectRatio: false,
      plugins: { legend: { position: "bottom" } },
      scales: { y: { title: { display: true, text: "%/년 (연복리)" } } } } });

  /* ── 정책 연표 ── */
  var pol = FUN_POLICIES.map(function (p) {
    function after(arr, m) {
      var v0 = funIdxAt(arr, t0, p[0], true);
      var t = Math.floor(p[0] / 100) * 12 + p[0] % 100 + m;
      var yy = Math.floor((t - 1) / 12), mm = ((t - 1) % 12) + 1;
      var v1 = funIdxAt(arr, t0, yy * 100 + mm, false);
      return (v0 && v1) ? (v1 / v0 - 1) * 100 : null;
    }
    return { ym: p[0], name: p[1], desc: p[2], c6: after(reg, 6), c12: after(reg, 12) };
  });
  document.querySelector("#fun-poltable tbody").innerHTML = pol.map(function (p) {
    return "<tr><td>" + Math.floor(p.ym / 100) + "." + (p.ym % 100) + "</td><td><b>" + p.name + "</b></td>" +
      "<td style=\"color:var(--ink-soft)\">" + p.desc + "</td>" +
      "<td class=\"" + cls(p.c6) + "\">" + (p.c6 != null ? pct(p.c6, 1) : "—") + "</td>" +
      "<td class=\"" + cls(p.c12) + "\">" + (p.c12 != null ? pct(p.c12, 1) : "진행 중") + "</td></tr>";
  }).join("");
  /* 지수 라인 + 정책 점 */
  var lineLabels = [], lineData = [], polPts = [];
  for (var i = 0; i < reg.length; i += 2) {
    var t = t0 + i, yy = Math.floor((t - 1) / 12), mm = ((t - 1) % 12) + 1;
    lineLabels.push(yy + "." + mm); lineData.push(reg[i]);
  }
  FUN_POLICIES.forEach(function (p) {
    var t = Math.floor(p[0] / 100) * 12 + p[0] % 100;
    var i = Math.round((t - t0) / 2);
    polPts.push({ x: i, y: (lineData[i] != null ? lineData[i] : null) });
  });
  funChart("fun-policy", { type: "line", data: { labels: lineLabels, datasets: [
    { label: FUN.region + " 매매지수", data: lineData, borderColor: "#d4af6a", pointRadius: 0, borderWidth: 1.5 },
    { label: "정책 시점", type: "scatter", showLine: false, pointRadius: 4,
      pointBackgroundColor: "#e08c3a",
      data: (function () { var arr = new Array(lineData.length).fill(null);
        polPts.forEach(function (pt) { if (pt.x >= 0 && pt.x < arr.length) arr[pt.x] = pt.y; });
        return arr; })() }] },
    options: { responsive: true, maintainAspectRatio: false,
      plugins: { legend: { position: "bottom" } }, scales: { x: { ticks: { maxTicksLimit: 12 } } } } });

  /* ── 시급·환율 ── */
  var wk = FUN.wageRegion, pmArr = pmSeries("salePm", wk);
  var pt0 = ymNum(DB.salePm.dates[0]);
  var years = Object.keys(FUN_WAGE).map(Number).sort();
  var wrows = [], normA = [], normW = [], normF = [], wlabels = [];
  var base = null;
  years.forEach(function (y) {
    /* 그해 12월(마지막 해는 최신월) ㎡당가 */
    var idx = null;
    for (var m = 12; m >= 1; m--) {
      var i = y * 12 + m - pt0;
      if (i >= 0 && i < pmArr.length && pmArr[i] != null) { idx = pmArr[i]; break; }
    }
    if (idx == null) return;
    var price = idx * 84;                      /* 만원 */
    var wage = FUN_WAGE[y], fx = FUN_FX[y];
    var hours = price * 10000 / wage;
    var yrs = hours / 2080;
    var usd = fx ? price * 10000 / fx : null;
    wrows.push({ y: y, price: price, wage: wage, hours: hours, yrs: yrs, usd: usd });
    if (base == null) base = { p: price, w: wage, f: fx };
    wlabels.push(y);
    normA.push(price / base.p * 100);
    normW.push(wage / base.w * 100);
    normF.push(fx ? fx / base.f * 100 : null);
  });
  var lastW = wrows[wrows.length - 1], firstW = wrows[0];
  document.getElementById("fun-wkpi").innerHTML = lastW ?
    statBox("지금 " + kbLabel(wk) + " 84㎡", eok(lastW.price), "", lastW.y + "년 기준") +
    statBox("최저시급 노동", lastW.yrs.toFixed(1) + "년치", "cash", "주 40시간 · 세전 전액 저축 가정") +
    statBox("기간 상승", pct((lastW.price / firstW.price - 1) * 100, 0), cls(lastW.price - firstW.price),
      firstW.y + "→" + lastW.y + " 아파트") +
    statBox("같은 기간 시급", pct((lastW.wage / firstW.wage - 1) * 100, 0), "",
      firstW.wage + "→" + lastW.wage + "원") : "";
  document.querySelector("#fun-wagetable tbody").innerHTML = wrows.map(function (r) {
    return "<tr><td>" + r.y + "</td><td><b>" + eok(r.price) + "</b></td><td>" + fmt(r.wage) + "원</td>" +
      "<td>" + fmt(Math.round(r.hours)) + "시간 (" + r.yrs.toFixed(1) + "년)</td>" +
      "<td>" + (r.usd ? "$" + fmt(Math.round(r.usd / 1000) * 1000) : "—") + "</td></tr>";
  }).join("");
  funChart("fun-wage", { type: "line", data: { labels: wlabels, datasets: [
    { label: "84㎡ 가격", data: normA, borderColor: "#d4af6a", pointRadius: 2 },
    { label: "최저시급", data: normW, borderColor: "#2fbf9b", pointRadius: 2 },
    { label: "원/달러", data: normF, borderColor: "#8a93a6", pointRadius: 2, borderDash: [4, 3] }] },
    options: { responsive: true, maintainAspectRatio: false,
      plugins: { legend: { position: "bottom" } },
      scales: { y: { title: { display: true, text: firstW ? firstW.y + "년 = 100" : "" } } } } });

  /* ── 자산 대결 ── */
  var arows = wrows.filter(function (r) { return FUN_GOLD[r.y] && FUN_FX[r.y]; });
  if (arows.length) {
    var a0 = arows[0], aN = arows[arows.length - 1];
    function goldKrwG(y) { return FUN_GOLD[y] / 31.1035 * FUN_FX[y]; }        /* 원/g */
    function btcKrw(y) { return FUN_BTC[y] * FUN_FX[y]; }                     /* 원/개 */
    document.querySelector("#fun-assettable tbody").innerHTML = arows.map(function (r) {
      var kg = r.price * 10000 / goldKrwG(r.y) / 1000;
      var btc = r.price * 10000 / btcKrw(r.y);
      return "<tr><td>" + r.y + "</td><td><b>" + eok(r.price) + "</b></td>" +
        "<td>금 " + kg.toFixed(1) + "kg</td>" +
        "<td>" + (btc >= 100 ? fmt(Math.round(btc)) : btc.toFixed(1)) + " BTC</td>" +
        "<td style=\"color:var(--ink-soft)\">$" + fmt(FUN_GOLD[r.y]) + "/oz</td>" +
        "<td style=\"color:var(--ink-soft)\">$" + fmt(FUN_BTC[r.y]) + "</td></tr>";
    }).join("");
    /* 첫해 아파트값으로 각 자산을 샀다면 지금 아파트 몇 채인가 */
    var goldX = goldKrwG(aN.y) / goldKrwG(a0.y);
    var btcX = btcKrw(aN.y) / btcKrw(a0.y);

/* ══ 자산 레이스 ══════════════════════════════ */
var RACE = { rep: null };   /* rep: 대표 단지 {압구정:{y:v}, 삼익:{y:v}} */

function raceSeries(useFx) {
  var years = [];
  for (var y = 2013; y <= 2025; y++) years.push(y);
  function krw(tbl, y) { return tbl[y] != null && FUN_FX[y] ? tbl[y] * FUN_FX[y] : null; }
  function raw(tbl, y) { return tbl[y] != null ? tbl[y] : null; }
  var usd = useFx ? krw : raw;
  var defs = [
    { name: "강남구 84㎡ (KB)", color: "#d4af6a", get: null },
    { name: "코스피", color: "#5b8def", get: function (y) { return raw(FUN_KOSPI, y); } },
    { name: "코스닥", color: "#5b8def", dash: [4, 3], hide: 1, get: function (y) { return raw(FUN_KOSDAQ, y); } },
    { name: "S&P500", color: "#c46be0", get: function (y) { return usd(FUN_SPX, y); } },
    { name: "나스닥", color: "#c46be0", dash: [4, 3], hide: 1, get: function (y) { return usd(FUN_NASDAQ, y); } },
    { name: "삼성전자", color: "#2fbf9b", get: function (y) { return raw(FUN_SAMSUNG, y); } },
    { name: "엔비디아 (시총 1위)", color: "#76d672", get: function (y) { return usd(FUN_NVDA, y); } },
    { name: "금", color: "#e8b04b", dash: [5, 3], get: function (y) { return usd(FUN_GOLD, y); } },
    { name: "비트코인", color: "#e08c3a", get: function (y) { return usd(FUN_BTC, y); } }
  ];
  /* 강남 84㎡ — 그해 12월 KB ㎡당가 */
  var pmArr = pmSeries("salePm", "강남11개구|강남구");
  var pt0 = ymNum(DB.salePm.dates[0]);
  defs[0].get = function (y) {
    for (var m = 12; m >= 1; m--) {
      var i = y * 12 + m - pt0;
      if (i >= 0 && i < pmArr.length && pmArr[i] != null) return pmArr[i];
    }
    return null;
  };
  /* 대표 단지 (로드된 경우) */
  if (RACE.rep) {
    Object.keys(RACE.rep).forEach(function (nm) {
      var tbl = RACE.rep[nm];
      defs.push({ name: nm + " (실거래)", color: nm.indexOf("압구정") >= 0 ? "#f2d9a4" : "#9bb7d4",
        get: function (y) { return tbl[y] != null ? tbl[y] : null; } });
    });
  }
  return { years: years, defs: defs };
}

function renderRace() {
  if (!document.getElementById("fun-race")) return;
  var useFx = !document.getElementById("fun-racefx") || document.getElementById("fun-racefx").checked;
  var rs = raceSeries(useFx);
  var rows = [];
  var datasets = rs.defs.map(function (d) {
    var base = null, data = rs.years.map(function (y) {
      var v = d.get(y);
      if (v == null) return null;
      if (base == null) base = v;
      return v / base * 100;
    });
    var vals = data.filter(function (x) { return x != null; });
    if (vals.length >= 2) {
      var mult = vals[vals.length - 1] / 100;
      var yrs = rs.years.length - 1;
      rows.push({ name: d.name, mult: mult, cagr: (Math.pow(mult, 1 / yrs) - 1) * 100 });
    }
    return { label: d.name, data: data, borderColor: d.color, backgroundColor: d.color,
      pointRadius: 2, borderWidth: 1.6, borderDash: d.dash || [], spanGaps: true,
      hidden: !!d.hide };
  });
  funChart("fun-race", { type: "line", data: { labels: rs.years, datasets: datasets },
    options: { responsive: true, maintainAspectRatio: false,
      plugins: { legend: { position: "bottom" } },
      scales: { y: { type: "logarithmic", title: { display: true, text: "2013년 말 = 100 (로그)" } } } } });
  rows.sort(function (a, b) { return b.mult - a.mult; });
  document.querySelector("#fun-racetable tbody").innerHTML = rows.map(function (r, i) {
    return "<tr" + (r.name.indexOf("84㎡") >= 0 || r.name.indexOf("실거래") >= 0 ? ' class="hit"' : "") +
      "><td>" + (i + 1) + "</td><td><b>" + r.name + "</b></td>" +
      "<td>×" + (r.mult >= 20 ? Math.round(r.mult) : r.mult.toFixed(1)) + "</td>" +
      '<td class="' + cls(r.cagr) + '">' + pct(r.cagr, 1) + "/년</td></tr>";
  }).join("");
}

/* 대표 단지 실거래: 매년 11·12월 + 올해 최근 3개월, 이름 필터 중위 평당 */
var RACE_TARGETS = [
  { name: "압구정 현대", lawd: "11680", dong: "압구정동", match: /현대|신현대/ },
  { name: "부산 삼익비치", lawd: "26500", dong: "남천동", match: /삼익/ }
];
function loadRepComplexes() {
  var btn = document.getElementById("fun-repgo");
  var hint = document.getElementById("fun-rephint");
  btn.disabled = true;
  var now = new Date();
  var curYm = now.getFullYear() * 100 + (now.getMonth() + 1);
  var done = 0, total = RACE_TARGETS.length * (13 * 2 + 3);
  function tick() { done++; btn.textContent = "불러오는 중… (" + done + "/" + total + ")"; }
  Promise.all(RACE_TARGETS.map(function (tg) {
    var yms = [];
    for (var y = 2013; y <= 2025; y++) yms.push([y, String(y * 100 + 11)], [y, String(y * 100 + 12)]);
    for (var k = 3; k >= 1; k--) yms.push([Math.floor(ymShift(curYm, -k) / 100), String(ymShift(curYm, -k))]);
    return Promise.all(yms.map(function (pair) {
      return fetchTrade(tg.lawd, "sale", pair[1]).then(function (j) {
        tick();
        return { y: pair[0], items: (j && j.items) || [] };
      }).catch(function () { tick(); return { y: pair[0], items: [] }; });
    })).then(function (parts) {
      var byYear = {};
      parts.forEach(function (p) {
        p.items.forEach(function (t) {
          if (t.canceled) return;
          if (String(t.dong).indexOf(tg.dong.replace("동", "")) < 0) return;
          if (!tg.match.test(String(t.apt))) return;
          (byYear[p.y] = byYear[p.y] || []).push(t.amount / t.area * 3.3058);
        });
      });
      var out = {};
      Object.keys(byYear).forEach(function (y) {
        if (byYear[y].length >= 2) out[y] = median(byYear[y]);
      });
      return { name: tg.name, series: out, n: Object.keys(out).length };
    });
  })).then(function (res) {
    RACE.rep = {};
    var msgs = [];
    res.forEach(function (r) {
      if (r.n >= 4) { RACE.rep[r.name] = r.series; msgs.push(r.name + " " + r.n + "개 연도"); }
      else msgs.push(r.name + " 표본 부족(" + r.n + "개 연도) — 제외");
    });
    if (!Object.keys(RACE.rep).length) RACE.rep = null;
    hint.textContent = "완료 — " + msgs.join(" · ") + ". 같은 연도라도 거래된 평형 구성이 달라 들쭉날쭉할 수 있습니다.";
    renderRace();
  }).catch(function (e) {
    hint.textContent = "불러오기 실패: " + (e.message || e);
  }).finally(function () {
    btn.disabled = false; btn.textContent = "대표 단지 실거래 얹기 (압구정 현대 · 부산 삼익비치)";
  });
}

/* 내 현금으로 최대 매수가 역산 (이분 탐색) */
function maxPriceForCash(cond, flags) {
  if (cond.cash <= 0) return null;
  var lo = 0, hi = 2000000;   /* 최대 200억 */
  for (var i = 0; i < 40; i++) {
    var mid = (lo + hi) / 2;
    if (finance("", mid, cond, flags).need <= cond.cash) lo = mid; else hi = mid;
  }
  return lo;
}

function renderCalc() {
  if (!DB) return;
  var cond = getCond();
  var flags = { reg: CALC.reg, metro: CALC.metro };
  var f = finance("", CALC.price, cond, flags);
  var maxP = maxPriceForCash(cond, flags);

  document.getElementById("cl-kpi").innerHTML =
    statBox("총 필요현금", eok(f.need), (cond.cash > 0 && f.need <= cond.cash) ? "up" : "down") +
    statBox("대출 가능액", f.loan > 0 ? eok(f.loan) + " (" + f.tag + ")" : "대출불가") +
    statBox("취득세 등", eok(f.acq)) +
    statBox("내 현금으로 최대", maxP != null ? eok(maxP) : "현금 미입력");

  var rows = [
    ["매수가", eok(f.price), ""],
    ["− 대출 가능액", f.loan > 0 ? "−" + eok(f.loan) : "0", f.tag],
    ["= 자기자금", eok(f.price - f.loan), ""],
    ["+ 취득세·교육세 등", "+" + eok(f.acq), ""],
    ["+ 중개보수", "+" + eok(f.broker), RULES.broker + "%"],
    ["+ 등기·이사·기타", "+" + eok(f.etc), ""],
    ["총 필요현금", eok(f.need), cond.cash > 0 ? (f.need <= cond.cash ? "가능" : "부족 " + eok(f.need - cond.cash)) : ""]
  ];
  document.querySelector("#cl-break tbody").innerHTML = rows.map(function (r, i) {
    return '<tr' + (i === rows.length - 1 ? ' class="hit"' : "") + "><td>" + r[0] + "</td><td><b>" + r[1] + "</b></td><td>" + r[2] + "</td></tr>";
  }).join("");

  var prices = [50000, 90000, 120000, RULES.capT1Lim, RULES.capT1Lim + 1, 200000, RULES.capT2Lim, RULES.capT2Lim + 1, 300000];
  document.querySelector("#cl-table tbody").innerHTML = prices.map(function (p) {
    var x = finance("", p, cond, flags);
    var ok = cond.cash > 0 && x.need <= cond.cash;
    return '<tr class="' + (ok ? "hit" : "") + '"><td>' + eok(p) + "</td>" +
      "<td>" + (x.loan > 0 ? eok(x.loan) : "—") + "</td>" +
      "<td>" + x.tag + "</td>" +
      "<td>" + eok(x.acq) + "</td>" +
      "<td>" + eok(x.broker) + "</td>" +
      "<td><b>" + eok(x.need) + "</b></td>" +
      '<td class="' + (ok ? "up" : "down") + '">' + (cond.cash > 0 ? (ok ? "가능" : "부족") : "—") + "</td></tr>";
  }).join("");
}

};
var TOUR = { mode: null, idx: -1 };   /* 진행 중인 안내 */

function startTour(mode, idx) {
  TOUR.mode = mode; TOUR.idx = idx;
  try { localStorage.setItem("trackapt_tour", JSON.stringify(TOUR)); } catch (e) {}
  showTab(TOURS[mode].steps[idx].go);
  window.scrollTo(0, 0);
}
function stopTour() {
  TOUR.mode = null; TOUR.idx = -1;
  try { localStorage.removeItem("trackapt_tour"); } catch (e) {}
  renderStepBar();
}
function restoreTour() {
  try {
    var t = JSON.parse(localStorage.getItem("trackapt_tour") || "null");
    if (t && TOURS[t.mode]) TOUR = t;
  } catch (e) {}
}
/* 현재 탭 위에 이전/다음 단계 바를 그린다 */
function renderStepBar() {
  document.querySelectorAll(".stepbar").forEach(function (el) { el.remove(); });
  if (!TOUR.mode || TOUR.idx < 0) return;
  var steps = TOURS[TOUR.mode].steps;
  var cur = steps[TOUR.idx];
  var onTab = document.querySelector("section.tab.on");
  if (!onTab || onTab.id !== "tab-" + cur.go) return;   /* 안내에서 벗어나면 숨김 */

  var bar = document.createElement("div");
  bar.className = "stepbar";
  bar.innerHTML =
    '<div class="lbl">' + TOURS[TOUR.mode].name + " · " + (TOUR.idx + 1) + "/" + steps.length +
      " 단계 — " + cur.t + "<small>" + cur.d + "</small></div>" +
    (TOUR.idx > 0 ? '<button class="btn sm ghost" data-tour="prev">← 이전</button>' : "") +
    (TOUR.idx < steps.length - 1
      ? '<button class="btn sm" data-tour="next">다음: ' + steps[TOUR.idx + 1].t + " →</button>"
      : '<button class="btn sm" data-tour="done">안내 마치기</button>') +
    '<button class="btn sm ghost" data-tour="exit">✕</button>';
  onTab.insertBefore(bar, onTab.firstChild);
  bar.querySelectorAll("button[data-tour]").forEach(function (b) {
    b.addEventListener("click", function () {
      var a = b.dataset.tour;
      if (a === "prev") startTour(TOUR.mode, TOUR.idx - 1);
      else if (a === "next") startTour(TOUR.mode, TOUR.idx + 1);
      else { stopTour(); if (a === "done") showTab("guide"); }
    });
  });
}

function loadRules() {
  var raw = null;
  try { raw = localStorage.getItem(LS_RULES); } catch (e) {}
  if (!raw) return;
  try {
    var r = JSON.parse(raw);
    Object.keys(DEFAULT_RULES).forEach(function (k) { if (r[k] != null) RULES[k] = r[k]; });
    /* 규제지역 기준일이 올라갔으면 저장본 대신 새 기본 목록을 쓴다 */
    if (Number(r.regVer || 0) < DEFAULT_RULES.regVer) {
      RULES.regulated = DEFAULT_RULES.regulated.slice();
      RULES.regVer = DEFAULT_RULES.regVer;
    }
  } catch (e) {}
}
function saveRules() { try { localStorage.setItem(LS_RULES, JSON.stringify(RULES)); } catch (e) {} }




/* ── FAQ 라이브 재계산 ──
   Q1·Q2·Q12·Q15는 내장 KB 시계열만으로 재현 가능해서, 데이터가 갱신되면
   수치를 다시 계산해 넣는다. 나머지 문항은 실거래·미분양·금리 등 별도
   원자료가 필요한 고정 검증이라 그대로 둔다. */
var LS_FAQ_PERIOD = "trackapt_faq_period";   /* auto | 7 | 30 | always */
var LS_FAQ_CACHE  = "trackapt_faq_cache_v1";

/* 인덱스 기반 시계열 접근 (blk: salePm 등) */
function faqSeries(blkName) {
  var blk = DB[blkName], t0 = ymNum(blk.dates[0]), nAll = blk.dates[2];
  function at(key, i) {
    var s = blk.series[key];
    if (!s) return null;
    var j = i - s.o;
    return (j >= 0 && j < s.v.length) ? s.v[j] : null;
  }
  function ymOf(i) {
    var t = t0 + i;
    return Math.floor((t - 1) / 12) + "." + String(((t - 1) % 12) + 1).padStart(2, "0");
  }
  function idxOfYm(y, m) { return y * 12 + m - t0; }
  return { at: at, ymOf: ymOf, idxOfYm: idxOfYm, n: nAll, keys: Object.keys(blk.series) };
}
/* FAQ 전용: 분수(0.28) 입력 — 전역 pct(퍼센트 입력)와 다르다. v3.9에서 이름 충돌 수정:
   이전엔 전역 pct를 덮어써 앱 전체 %% 표시가 100배 부풀려졌다. */
function fpct(x, d) { return (x >= 0 ? "+" : "") + (x * 100).toFixed(d == null ? 1 : d) + "%"; }
function avg(a) { return a.length ? a.reduce(function (x, y) { return x + y; }, 0) / a.length : null; }

function faqCompute() {
  var pm = faqSeries("salePm");
  var last = pm.n - 1, anchor = last - 120;             /* 10년 전 */
  var out = { dataYm: pm.ymOf(last), anchorYm: pm.ymOf(anchor) };

  /* 대상 지역: RANKED(집계·표본부족 제외) 중 10년 전 값이 있는 곳 */
  var regs = RANKED.map(function (k) {
    return { k: k, v0: pm.at(k, anchor), v1: pm.at(k, last) };
  }).filter(function (r) { return r.v0 > 0 && r.v1 > 0; });
  regs.sort(function (a, b) { return b.v0 - a.v0; });
  var N = regs.length;
  out.sample = N;

  /* ── Q1: 10년 전 가격 10분위 → 10년 배수 ── */
  var dec = [];
  for (var d = 0; d < 10; d++) {
    var seg = regs.slice(Math.round(N * d / 10), Math.round(N * (d + 1) / 10));
    dec.push({
      pm0: avg(seg.map(function (r) { return r.v0; })),
      mult: avg(seg.map(function (r) { return r.v1 / r.v0; }))
    });
  }
  var inv = 0;
  for (var d2 = 1; d2 < 10; d2++) if (dec[d2].mult > dec[d2 - 1].mult) inv++;
  var top30 = regs.slice(0, Math.round(N * 0.3));
  var mid = regs.slice(Math.round(N * 0.4), Math.round(N * 0.6));
  out.q1 = {
    inv: inv,
    rows: [
      ["가장 비싼 10%", dec[0].pm0, dec[0].mult],
      ["그 다음 10%", dec[1].pm0, dec[1].mult],
      ["상위 30%까지", avg(top30.map(function (r) { return r.v0; })), avg(top30.map(function (r) { return r.v1 / r.v0; }))],
      ["중간쯤", avg(mid.map(function (r) { return r.v0; })), avg(mid.map(function (r) { return r.v1 / r.v0; }))],
      ["가장 싼 10%", dec[9].pm0, dec[9].mult]
    ]
  };

  /* ── Q2: 모멘텀 역전 — 장기 지수(sale, 1986~)로 측정 ── */
  var ix = faqSeries("sale");
  var AGG2 = { "전국": 1, "수도권": 1, "6개광역시": 1, "5개광역시(인천外)": 1, "5개광역시": 1,
               "기타지방": 1, "서울특별시": 1, "경기도": 1, "강남 11개구": 1, "강북 14개구": 1 };
  var ixKeys = ix.keys.filter(function (k) { return !AGG2[k] && k.indexOf("|") >= 0; });
  var pts = 0, revs = 0, topF = [], botF = [];
  for (var t = 120; t + 36 <= ix.n - 1; t += 4) {
    var rows2 = [];
    for (var ki = 0; ki < ixKeys.length; ki++) {
      var k2 = ixKeys[ki];
      var a0 = ix.at(k2, t - 120), a1 = ix.at(k2, t), a2 = ix.at(k2, t + 36);
      if (a0 > 0 && a1 > 0 && a2 > 0) rows2.push({ tr: a1 / a0, fw: a2 / a1 - 1 });
    }
    if (rows2.length < 20) continue;
    rows2.sort(function (a, b) { return b.tr - a.tr; });
    var q = Math.max(3, Math.round(rows2.length * 0.2));
    var ft = avg(rows2.slice(0, q).map(function (r) { return r.fw; }));
    var fb = avg(rows2.slice(-q).map(function (r) { return r.fw; }));
    pts++; topF.push(ft); botF.push(fb);
    if (ft < fb) revs++;
  }
  out.q2 = { pts: pts, revs: revs, topF: avg(topF), botF: avg(botF) };

  /* ── Q12: 고점 대비 낙폭·기간·회복 (2020.01~2022.12 고점 기준) ── */
  var pkFrom = pm.idxOfYm(2020, 1), pkTo = Math.min(pm.idxOfYm(2022, 12), last);
  function drawdown(k) {
    var pi = -1, pv = -1;
    for (var i = pkFrom; i <= pkTo; i++) {
      var v = pm.at(k, i);
      if (v != null && v > pv) { pv = v; pi = i; }
    }
    if (pi < 0) return null;
    var ti = pi, tv = pv;
    for (var i2 = pi; i2 <= last; i2++) {
      var v2 = pm.at(k, i2);
      if (v2 != null && v2 < tv) { tv = v2; ti = i2; }
    }
    var cur = pm.at(k, last);
    return { fall: tv / pv - 1, months: ti - pi, nowVs: cur / pv - 1, rec: cur >= pv };
  }
  function ddBucket(seg) {
    var ds = seg.map(function (r) { return drawdown(r.k); }).filter(Boolean);
    return { fall: avg(ds.map(function (x) { return x.fall; })),
             months: avg(ds.map(function (x) { return x.months; })),
             nowVs: avg(ds.map(function (x) { return x.nowVs; })),
             rec: ds.filter(function (x) { return x.rec; }).length, n: ds.length };
  }
  out.q12 = {
    rows: [
      ["가장 비싼 10%", ddBucket(regs.slice(0, Math.round(N * 0.1)))],
      ["그 다음 10%", ddBucket(regs.slice(Math.round(N * 0.1), Math.round(N * 0.2)))],
      ["중간쯤", ddBucket(mid)],
      ["가장 싼 10%", ddBucket(regs.slice(Math.round(N * 0.9)))]
    ]
  };

  /* ── Q15: 국면별 3분위 성과 — 경계는 전국 지수의 저점·고점으로 자동 판정 ── */
  function argExt(k, from, to, wantMax) {
    var bi = -1, bv = wantMax ? -Infinity : Infinity;
    for (var i = from; i <= to; i++) {
      var v = pm.at(k, i);
      if (v == null) continue;
      if (wantMax ? v > bv : v < bv) { bv = v; bi = i; }
    }
    return bi;
  }
  var natKey = DB.salePm.series["전국"] ? "전국" : regs[0].k;
  var b0 = Math.max(0, pm.idxOfYm(2016, 7));
  var b1 = argExt(natKey, pm.idxOfYm(2018, 10), pm.idxOfYm(2019, 12), false);   /* 상승 초기 끝 = 2019 부근 저점 */
  var peak = argExt(natKey, pm.idxOfYm(2021, 1), Math.min(pm.idxOfYm(2022, 12), last), true);
  var trough = argExt(natKey, peak, Math.min(peak + 40, last), false);
  if (b1 < 0) b1 = pm.idxOfYm(2019, 9);
  var ter = [regs.slice(0, Math.round(N / 3)),
             regs.slice(Math.round(N / 3), Math.round(2 * N / 3)),
             regs.slice(Math.round(2 * N / 3))];
  function phase(from, to) {
    return ter.map(function (seg) {
      return avg(seg.map(function (r) {
        var a = pm.at(r.k, from), b = pm.at(r.k, to);
        return (a > 0 && b > 0) ? b / a - 1 : null;
      }).filter(function (x) { return x != null; }));
    });
  }
  out.q15 = {
    bounds: [pm.ymOf(b0), pm.ymOf(b1), pm.ymOf(peak), pm.ymOf(trough), pm.ymOf(last)],
    rows: [
      ["조용했던 상승 초기", phase(b0, b1)],
      ["급등기", phase(b1, peak)],
      ["하락기", phase(peak, trough)],
      ["회복기", phase(trough, last)]
    ]
  };
  return out;
}

/* 주기 판단 + 캐시 */
function faqRefresh(force) {
  if (!DB) return;
  var cache = null;
  try { cache = JSON.parse(localStorage.getItem(LS_FAQ_CACHE) || "null"); } catch (e) {}
  var pmLast = faqSeries("salePm");
  var curYm = pmLast.ymOf(pmLast.n - 1);
  /* kb_data.json이 새 달로 교체되면 자동 재계산 */
  var need = force || !cache || cache.dataYm !== curYm;
  var r;
  if (need) {
    r = faqCompute();
    r.at = Date.now();
    try { localStorage.setItem(LS_FAQ_CACHE, JSON.stringify(r)); } catch (e) {}
  } else r = cache;
  faqRender(r);
  var st = document.getElementById("fq-status");
  if (st) {
    var d = new Date(r.at);
    st.innerHTML = "내장 KB 데이터 <b>" + r.dataYm + "</b> 기준 · 마지막 계산 " +
      (d.getMonth() + 1) + "." + d.getDate() + " " + String(d.getHours()).padStart(2, "0") + ":" +
      String(d.getMinutes()).padStart(2, "0") +
      (need ? ' <span class="tagmini ok">방금 재계산됨</span>' : "") +
      " — kb_data.json을 새 달로 교체하면 자동으로 다시 계산됩니다.";
  }
}

    saveRules();
    buildSetting(root);
    document.getElementById("r-hint").textContent = "기본값으로 복원했습니다.";
  });
}
function regCount() {
  var el = document.getElementById("r-regcount");
  if (el) el.textContent = RULES.regulated.length + "곳";
}

/* ══ 시장 현황 탭 ═════════════════════════════ */
function buildMarket(root) {
  root.innerHTML =
    '<div class="card">' +
      '<div class="eyebrow">Market</div><h2>시장 현황 · 장기 성과</h2>' +
      '<p class="desc">지역을 고르면 연도별 상승률과 지수 흐름, 2년 단위 실제 수익률을 매매·전세로 나눠 봅니다. ' +
        '지역마다 조사 시작 시점이 다릅니다 — 시작 연도는 아래 카드에 표시됩니다.</p>' +
      '<div class="grid">' +
        '<div class="field full"><label for="mk-region">지역</label><select id="mk-region"></select></div>' +
        '<div class="field full"><label>표시 구간</label><div class="seg" id="mk-span">' +
          '<button data-s="all" class="on">전체</button><button data-s="30">30년</button>' +
          '<button data-s="20">20년</button><button data-s="10">10년</button></div></div>' +
      '</div>' +
      '<div class="callout warn" id="mk-fallback" style="display:none;margin-top:10px"></div>' +
      '<div class="status" id="mk-kpi" style="margin-top:12px"></div>' +
      '<div class="note" id="mk-read" style="margin-top:10px"></div>' +
      '<div class="note"><b>연복리를 왜 보나</b> — 10억짜리를 샀는데 연복리 7%라면 <b>매년 평균 7천만원씩</b> ' +
        '불어난다는 뜻입니다. 10년에 두 배(연복리 7.2%)를 통과선으로 쓰는 이유입니다. 10년 상승률을 단순히 ' +
        '10으로 나누면 실제보다 부풀려지니 반드시 복리 기준으로 보세요.</div>' +
    '</div>' +
    '<div class="card"><div class="eyebrow">Annual</div><h2>연도별 상승률</h2>' +
      '<p class="desc">막대가 매매, 선이 전세입니다. 청록 막대가 상승, 호박 막대가 하락한 해입니다.</p>' +
      '<div class="chartbox"><canvas id="mk-annual"></canvas></div></div>' +
    '<div class="card"><div class="eyebrow">Index</div><h2>지수 추이</h2>' +
      '<p class="desc">누적 지수 자체를 봅니다. 기울기가 곧 그 구간의 속도입니다.</p>' +
      '<div class="chartbox"><canvas id="mk-index"></canvas></div></div>' +
    '<div class="card"><div class="eyebrow">Year by Year</div><h2>연도별 기록</h2><div class="expbar"><button class="btn sm ghost" data-exp="img" data-name="연도별기록">이미지 저장</button><button class="btn sm ghost" data-exp="xlsx" data-table="mk-table" data-name="연도별기록">엑셀 저장</button></div>' +
      '<div class="tblwrap"><table id="mk-table"><thead><tr>' +
      '<th>연도</th><th>매매</th><th>전세</th><th>매매지수</th><th>전세지수</th></tr></thead><tbody></tbody></table></div></div>' +
    '<div class="card"><div class="eyebrow">2-Year</div><h2>2년 단위 수익률</h2>' +
      '<p class="desc">2년씩 끊어 실제 누적 수익률을 봅니다. 복리와 산술합의 차이가 복리 효과입니다.</p>' +
      '<div class="status" id="mk-kpi2" style="margin-bottom:10px"></div>' +
      '<div class="tblwrap"><table id="mk-table2"><thead><tr>' +
      '<th>구간</th><th>매매 2년</th><th>산술합</th><th>전세 2년</th><th>매매−전세</th></tr></thead><tbody></tbody></table></div>' +
      '<div class="note"><b>왜 두 값이 다른가</b> — 1년차 +20%, 2년차 −10%면 산술합은 +10%지만 ' +
        '실제 누적은 1.20 × 0.90 − 1 = <b>+8%</b>입니다. 변동이 클수록 산술합이 부풀려집니다. ' +
        '장기 성과는 복리 기준으로 읽으세요.</div>' +
      '<div class="note">KB 지수는 표본조사 기반이라 실거래 평균가와 다르며, 표본 개편 시점(2022.11 · 2026.4 등)의 ' +
        '단절이 일부 포함될 수 있습니다. 연도 값은 12월 기준이고 마지막 해는 최신월 기준입니다.</div></div>';

  root.querySelector("#mk-region").addEventListener("change", function () {
    MK.region = this.value; renderMarket();
  });
  root.querySelectorAll("#mk-span button").forEach(function (b) {
    b.addEventListener("click", function () {
      MK.span = b.dataset.s;
      root.querySelectorAll("#mk-span button").forEach(function (x) { x.classList.toggle("on", x === b); });
      renderMarket();

}

function annualRows(region) {
  var e = latestYM("sale");
  var start = seriesStartYM("sale", region);
  if (!start) return [];
  var rows = [];
  for (var y = start[0] + 1; y <= e[0]; y++) {
    var s0 = decVal("sale", region, y - 1), s1 = decVal("sale", region, y);
    var j0 = decVal("jeonse", region, y - 1), j1 = decVal("jeonse", region, y);
    var r = { y: y,
      sale:   (s0 && s1) ? (s1 / s0 - 1) * 100 : null,
      jeonse: (j0 && j1) ? (j1 / j0 - 1) * 100 : null,
      saleIdx: s1, jeonseIdx: j1 };
    if (r.sale != null || r.jeonse != null) rows.push(r);
  }
  return rows;
}

/* 표본이 부족한 신설구 등은 상위 지역 키로 대체 (예: 화성시|효행구 → 화성시) */
function fallbackKey(blk, k, minMonths) {
  var s = DB[blk] && DB[blk].series[k];
  if (s && s.v.length >= minMonths) return { key: k, note: "" };
  if (k.indexOf("|") >= 0) {
    var parent = k.split("|")[0];
    var p = DB[blk] && DB[blk].series[parent];
    if (p && p.v.length >= minMonths) {
      return { key: parent, note: kbLabel(k) + "는 " + (s ? s.v.length + "개월" : "0개월") +
        " 표본뿐이라 <b>" + kbLabel(parent) + " 전체</b> 기준으로 보여드립니다." };
    }
  }
  return { key: k, note: s && s.v.length < minMonths ? "이 지역은 표본이 " + s.v.length + "개월뿐입니다. 장기 분석에는 부족합니다." : "" };
}

function renderMarket() {
  if (!DB) return;
  var fb = fallbackKey("sale", MK.region, 36);
  var region = fb.key;
  var mkNote = document.getElementById("mk-fallback");
  if (mkNote) { mkNote.innerHTML = fb.note; mkNote.style.display = fb.note ? "" : "none"; }
  var e = latestYM("sale");
  var rows = annualRows(region);
  if (MK.span !== "all") {
    var nSpan = Number(MK.span);
    rows = rows.filter(function (r) { return r.y > e[0] - nSpan; });
  }
  if (!rows.length) return;

  var start = seriesStartYM("sale", region);
  var firstY = rows[0].y, lastY = rows[rows.length - 1].y;
  var months = (MK.span === "all")
    ? (e[0] * 12 + e[1]) - (start[0] * 12 + start[1])
    : Number(MK.span) * 12;
  var sN = getVal("sale", region, e[0], e[1]);
  var s0m = (e[0] * 12 + e[1]) - months;
  var s0 = getVal("sale", region, Math.floor((s0m - 1) / 12), ((s0m - 1) % 12) + 1);
  var jN = getVal("jeonse", region, e[0], e[1]);
  var j0 = getVal("jeonse", region, Math.floor((s0m - 1) / 12), ((s0m - 1) % 12) + 1);
  var yrs = months / 12;
  var cagrS = (s0 && sN) ? (Math.pow(sN / s0, 1 / yrs) - 1) * 100 : null;
  var cagrJ = (j0 && jN) ? (Math.pow(jN / j0, 1 / yrs) - 1) * 100 : null;
  var cumS = (s0 && sN) ? (sN / s0 - 1) * 100 : null;
  var k = "";
  k += statBox("조사 시작", start[0] + "." + start[1]);
  k += statBox("구간 누적 (매매)", cumS != null ? pct(cumS, 1) : "—", cls(cumS));
  k += statBox("연복리 (매매)", cagrS != null ? pct(cagrS, 2) + "/년" : "—", cls(cagrS));
  k += statBox("연복리 (전세)", cagrJ != null ? pct(cagrJ, 2) + "/년" : "—", cls(cagrJ));
  document.getElementById("mk-kpi").innerHTML = k;

  /* 시장 읽기 — 구간 해석 문장 */
  var best = rows.reduce(function (a, b) { return (b.sale != null && (a == null || b.sale > a.sale)) ? b : a; }, null);
  var worst = rows.reduce(function (a, b) { return (b.sale != null && (a == null || b.sale < a.sale)) ? b : a; }, null);
  var downs = rows.filter(function (r) { return r.sale != null && r.sale < 0; }).length;
  var jCmp = (cagrS != null && cagrJ != null) ? cagrJ - cagrS : null;
  var read = [];
  if (cumS != null) read.push(disp(region) + " 매매지수는 이 구간 누적 <b>" + pct(cumS, 1) + "</b> (연복리 " + cagrS.toFixed(1) + "%)입니다.");
  if (best && worst) read.push("가장 크게 오른 해는 <b>" + best.y + "년 " + pct(best.sale) + "</b>, 가장 크게 빠진 해는 <b>" + worst.y + "년 " + pct(worst.sale) + "</b>입니다.");
  read.push("구간 " + rows.length + "개 연도 중 하락한 해는 <b>" + downs + "번</b>(" + Math.round(downs / rows.length * 100) + "%)입니다.");
  if (jCmp != null) read.push("같은 기간 전세 연복리는 매매보다 " + (jCmp >= 0 ? "<b>" + jCmp.toFixed(1) + "%p 높습니다</b> — 사용 가치가 더 빠르게 오른 구간입니다." : "<b>" + (-jCmp).toFixed(1) + "%p 낮습니다</b>."));
  document.getElementById("mk-read").innerHTML = read.join("<br>");

  var labels = rows.map(function (r) { return String(r.y); });
  var css = getComputedStyle(document.documentElement);
  var cUp = css.getPropertyValue("--up").trim(), cDown = css.getPropertyValue("--down").trim();
  var cBrand = css.getPropertyValue("--brand").trim();
  if (chartAnnual) chartAnnual.destroy();
  chartAnnual = new Chart(document.getElementById("mk-annual"), {
    data: {
      labels: labels,
      datasets: [
        { type: "bar", label: "매매", data: rows.map(function (r) { return r.sale; }),
          backgroundColor: rows.map(function (r) { return (r.sale != null && r.sale < 0) ? cDown : cUp; }),
          borderRadius: 3, order: 2 },
        { type: "line", label: "전세", data: rows.map(function (r) { return r.jeonse; }),
          borderColor: cBrand, backgroundColor: cBrand, borderWidth: 2,
          pointRadius: rows.length > 25 ? 0 : 2.5, tension: .25, order: 1 }
      ]
    },
    options: chartOpts("%")
  });

  var startM = (e[0] * 12 + e[1]) - months;
  var mLabels = [], mSale = [], mJeon = [];
  for (var t = startM; t <= e[0] * 12 + e[1]; t++) {
    var yy = Math.floor((t - 1) / 12), mm = ((t - 1) % 12) + 1;
    mLabels.push(yy + "." + mm);
    mSale.push(getVal("sale", region, yy, mm));
    mJeon.push(getVal("jeonse", region, yy, mm));
  }
  if (chartIndex) chartIndex.destroy();
  chartIndex = new Chart(document.getElementById("mk-index"), {
    type: "line",
    data: { labels: mLabels, datasets: [
      { label: "매매지수", data: mSale, borderColor: cUp, borderWidth: 2, pointRadius: 0, tension: .1 },
      { label: "전세지수", data: mJeon, borderColor: cBrand, borderWidth: 2, pointRadius: 0, tension: .1 }
    ]},
    options: chartOpts("")
  });

  var tb = document.querySelector("#mk-table tbody");
  tb.innerHTML = rows.slice().reverse().map(function (r) {
    var yLabel = (r.y === e[0] && e[1] !== 12) ? r.y + " (~" + e[1] + "월)" : String(r.y);
    return "<tr><td>" + yLabel + "</td>" +
      '<td class="' + cls(r.sale) + '">' + pct(r.sale) + "</td>" +
      '<td class="' + cls(r.jeonse) + '">' + pct(r.jeonse) + "</td>" +
      "<td>" + (r.saleIdx != null ? r.saleIdx.toFixed(1) : "—") + "</td>" +
      "<td>" + (r.jeonseIdx != null ? r.jeonseIdx.toFixed(1) : "—") + "</td></tr>";
  }).join("");

  var by = {};
  rows.forEach(function (r) { by[r.y] = r; });
  var out = [];
  for (var y2 = lastY; y2 - 1 >= firstY; y2 -= 2) {
    var a = by[y2 - 1], b = by[y2];
    if (!a || !b || a.sale == null || b.sale == null) continue;
    var comp = ((1 + a.sale / 100) * (1 + b.sale / 100) - 1) * 100;
    var arith = a.sale + b.sale;
    var compJ = (a.jeonse != null && b.jeonse != null)
      ? ((1 + a.jeonse / 100) * (1 + b.jeonse / 100) - 1) * 100 : null;
    var label = (y2 - 1) + "–" + ((y2 === e[0] && e[1] !== 12) ? y2 + "." + e[1] : y2);
    out.push({ label: label, comp: comp, arith: arith, compJ: compJ,
               diff: compJ != null ? comp - compJ : null });
  }
  /* 2년 KPI: 평균·중위·전세 평균·플러스 구간 */
  var comps = out.map(function (r) { return r.comp; });
  var compJs = out.map(function (r) { return r.compJ; }).filter(function (v) { return v != null; });
  var plus = comps.filter(function (v) { return v > 0; }).length;
  var k2el = document.getElementById("mk-kpi2");
  if (k2el) {
    k2el.innerHTML = comps.length
      ? statBox("2년 수익률 평균 (매매)", pct(comps.reduce(function (a, b) { return a + b; }, 0) / comps.length, 1), "up") +
        statBox("중위", pct(median(comps), 1)) +
        statBox("2년 평균 (전세)", compJs.length ? pct(compJs.reduce(function (a, b) { return a + b; }, 0) / compJs.length, 1) : "—") +
        statBox("플러스 구간", plus + " / " + comps.length + " (" + Math.round(plus / comps.length * 100) + "%)")
      : "";
  }
  var tb2 = document.querySelector("#mk-table2 tbody");
  tb2.innerHTML = out.map(function (r) {
    return "<tr><td>" + r.label + "</td>" +
      '<td class="' + cls(r.comp) + '">' + pct(r.comp) + "</td>" +
      "<td>" + pct(r.arith) + "</td>" +
      '<td class="' + cls(r.compJ) + '">' + pct(r.compJ) + "</td>" +
      '<td class="' + cls(r.diff) + '">' + pct(r.diff) + "</td></tr>";
  }).join("");
}

function chartOpts(unit) {
  return {
    responsive: true, maintainAspectRatio: false, animation: false,
    interaction: { mode: "index", intersect: false },
    plugins: {
      legend: { labels: { boxWidth: 12, font: { family: "Pretendard Variable", size: 11 } } },
      tooltip: { callbacks: { label: function (c) {
        var v = c.parsed.y;
        return c.dataset.label + ": " + (v == null ? "—" : v.toFixed(1) + unit);
      } } }
    },
    scales: {
      x: { ticks: { maxTicksLimit: 10, font: { size: 10 } }, grid: { display: false } },
      y: { ticks: { font: { size: 10 }, callback: function (v) { return v + unit; } },
           grid: { color: "#1e2836" } }
    }
  };
}
