<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="TrackApt — KB 시계열로 보는 전국 아파트 가격 서열과 투자 타이밍">
<title>TrackApt</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#f7f8fa; --panel:#ffffff; --ink:#1c2430; --ink-soft:#5b6675;
  --line:#e3e7ee; --brand:#0f4c5c; --up:#0e7c66; --down:#c47f17;
  --miss:#98a1ad; --cash:#e2571b; --radius:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px}
body{font-family:"Pretendard Variable",Pretendard,-apple-system,system-ui,sans-serif;
  background:var(--bg);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased}
header{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line);
  padding:calc(env(safe-area-inset-top) + 10px) 16px 0}
.brand{display:flex;align-items:baseline;gap:8px;padding-bottom:8px}
.brand h1{font-size:1.15rem;font-weight:800;letter-spacing:-.02em}
.brand h1 .accent{color:var(--brand)}
.brand .ver{font-size:.72rem;color:var(--ink-soft);font-weight:600}
nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:none;border:1px solid var(--line);background:var(--bg);color:var(--ink-soft);
  font:inherit;font-size:.82rem;font-weight:600;padding:7px 13px;border-radius:999px;cursor:pointer;white-space:nowrap}
nav button.on{background:var(--brand);border-color:var(--brand);color:#fff}
nav button:focus-visible,.seg button:focus-visible{outline:2px solid var(--cash);outline-offset:2px}
main{max-width:860px;margin:0 auto;padding:16px 16px calc(env(safe-area-inset-bottom) + 48px)}
section.tab{display:none} section.tab.on{display:block}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px 16px;margin-bottom:14px}
.card h2{font-size:1rem;font-weight:800;letter-spacing:-.01em;margin-bottom:4px}
.card .eyebrow{font-size:.68rem;font-weight:700;letter-spacing:.14em;color:var(--brand);text-transform:uppercase;margin-bottom:6px}
.card p.desc{font-size:.85rem;color:var(--ink-soft);margin-bottom:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px 12px}
.field{display:flex;flex-direction:column;gap:4px}
.field.full{grid-column:1 / -1}
.field label{font-size:.76rem;font-weight:700;color:var(--ink-soft)}
.field input,.field select,.field textarea{font:inherit;font-size:.92rem;padding:9px 10px;border:1px solid var(--line);
  border-radius:8px;background:#fff;color:var(--ink);width:100%}
.field textarea{min-height:120px;line-height:1.6;font-size:.84rem}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--brand);outline-offset:-1px;border-color:var(--brand)}
.check{display:flex;align-items:center;gap:8px;font-size:.88rem;font-weight:600}
.check input{width:18px;height:18px;accent-color:var(--brand)}
.btn{font:inherit;font-weight:700;font-size:.92rem;border:0;border-radius:10px;padding:12px 16px;
  cursor:pointer;background:var(--brand);color:#fff;width:100%}
.btn.ghost{background:#fff;color:var(--brand);border:1.5px solid var(--brand)}
.btnrow{display:flex;gap:10px;margin-top:12px}
.hint{font-size:.76rem;color:var(--ink-soft);margin-top:8px}
.status{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:var(--bg);border-radius:8px;padding:10px 12px}
.stat .k{font-size:.72rem;color:var(--ink-soft);font-weight:600}
.stat .v{font-size:1.05rem;font-weight:800;letter-spacing:-.01em}
.stat .v.up{color:var(--up)} .stat .v.down{color:var(--down)}
.badge{display:inline-block;font-size:.7rem;font-weight:700;padding:2px 8px;border-radius:999px}
.badge.ok{background:#e4f3ef;color:var(--up)} .badge.err{background:#fbeee0;color:var(--down)}
.placeholder{border:1.5px dashed var(--line);border-radius:var(--radius);padding:28px 16px;
  text-align:center;color:var(--miss);font-size:.85rem;margin-bottom:14px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{font:inherit;font-size:.8rem;font-weight:600;padding:7px 12px;border:0;background:#fff;
  color:var(--ink-soft);cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--brand);color:#fff}
.chartbox{position:relative;height:280px}
.tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:.84rem;white-space:nowrap}
th{font-size:.74rem;color:var(--ink-soft);font-weight:700;text-align:right;padding:7px 10px;border-bottom:1.5px solid var(--line)}
th:first-child,td:first-child{text-align:left}
th:nth-child(2),td:nth-child(2){text-align:left}
td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
td.up{color:var(--up);font-weight:600} td.down{color:var(--down);font-weight:600} td.flat{color:var(--miss)}
tr.hit td{background:#f0f8f5}
tr.hit td:first-child{border-left:3px solid var(--up)}
tr:last-child td{border-bottom:0}
.note{background:var(--bg);border-radius:8px;padding:12px;font-size:.8rem;color:var(--ink-soft);margin-top:12px;line-height:1.6}
.note b{color:var(--ink)}
.callout{border-left:4px solid var(--up);background:#f0f8f5;border-radius:8px;padding:12px 14px;
  font-size:.9rem;margin-bottom:12px;line-height:1.6}
.callout.warn{border-color:var(--down);background:#fbf4e8}
.callout b{font-weight:800}
.btn.sm{width:auto;padding:6px 10px;font-size:.76rem;border-radius:7px}
.expbar{display:flex;gap:8px;margin:8px 0 10px}
.capturing .expbar,.capturing button{display:none!important}
.grade{font-size:1.5rem;font-weight:800;min-width:44px;text-align:center;border-radius:10px;padding:6px 0}
.grade.A{background:#e4f3ef;color:var(--up)} .grade.B{background:#eaf2f4;color:var(--brand)}
.grade.C{background:#fbf4e8;color:var(--down)} .grade.D{background:#f1f3f6;color:var(--miss)}
.btn.sm.ghost{border-width:1px}
.rowinfo{font-size:.74rem;color:var(--ink-soft);background:var(--bg);border-radius:6px;padding:6px 8px;margin-top:4px;line-height:1.5}
.reco{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:8px}
.reco.best{border-color:var(--up);background:#f0f8f5}
.reco .no{font-size:1.3rem;font-weight:800;color:var(--brand);min-width:28px;text-align:center}
.reco .body{flex:1;min-width:0}
.reco .name{font-weight:800;font-size:.95rem}
.reco .chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.chip{font-size:.68rem;font-weight:700;background:var(--bg);border-radius:5px;padding:2px 6px;color:var(--ink-soft)}
.chip b{color:var(--ink)}
.reco .money{text-align:right;white-space:nowrap}
.reco .money .score{font-size:1.15rem;font-weight:800;color:var(--brand)}
.reco .money .need{font-size:.78rem;color:var(--ink-soft);margin-top:2px}
@media (max-width:480px){ html{font-size:15px} .chartbox{height:240px} .grid3{grid-template-columns:1fr 1fr} }
@media (prefers-reduced-motion:reduce){ *{transition:none!important;animation:none!important} }
</style>
</head>
<body>

<header>
  <div class="brand">
    <h1>Track<span class="accent">Apt</span></h1>
    <span class="ver">v0.11</span>
  </div>
  <nav id="nav" aria-label="주요 메뉴"></nav>
</header>

<div id="condbar" style="max-width:860px;margin:0 auto;padding:10px 16px 0;font-size:.78rem;color:var(--ink-soft);cursor:pointer" title="시작 탭으로 이동"></div>
<main id="main"></main>

<footer style="max-width:860px;margin:0 auto;padding:0 16px 40px;font-size:.72rem;color:var(--miss);line-height:1.7">
  TrackApt는 KB부동산 월간 시계열 등 공개 통계를 계산해 보여주는 정보 제공 도구이며 투자 자문이 아닙니다.
  통계는 표본조사 기반이라 실제 거래가와 다를 수 있고, 대출·세금 규정은 수시로 바뀝니다.
  실행 전 반드시 은행·세무 전문가와 확인하세요. 모든 판단의 책임은 이용자 본인에게 있습니다.
</footer>

<script>
"use strict";

var DB = null;
var LS_COND = "trackapt_cond_v1";
var LS_RULES = "trackapt_rules_v1";
var MK = { region: "전국", span: "all" };
var GAP = { region: "" };
var MOVE = { target: "" };
var chartAnnual = null, chartIndex = null, chartRank = null, chartGap = null, chartMove = null;
var RANKED = [];   // 급지표 대상 지역 키 (서열 내림차순)
var METRO = {};    // 수도권 여부

/* ── 대출·세금 기준 기본값 (기준·설정 탭에서 수정 가능) ── */
var DEFAULT_RULES = {
  ltvReg: 40,          // 규제지역 LTV %
  ltvFree: 70,         // 비규제지역 LTV %
  ltvFirstLocal: 80,   // 생애최초 · 비수도권 LTV %
  ltvMulti: 60,        // 추가매수 · 비규제 LTV % (수도권·규제는 0)
  capT1: 60000, capT1Lim: 150000,   // 15억 이하 → 상한 6억
  capT2: 40000, capT2Lim: 250000,   // 15~25억 → 상한 4억
  capT3: 20000,                      // 25억 초과 → 상한 2억
  dsr: 40,             // DSR %
  stress: 1.5,         // 스트레스 가산 %p
  loanYears: 30,       // 대출 만기 (년)
  acq2Reg: 8,          // 조정지역 2주택 취득세 %
  acq3Reg: 12,         // 조정지역 3주택 이상 취득세 %
  wRank: 35, wPerf: 25, wSupply: 15, wTiming: 15, wCash: 10,   // 추천 가중치
  broker: 0.4,         // 중개보수 요율 %
  etcRate: 0.3,        // 등기 등 부대비용 요율 %
  etcFixed: 300,       // 이사 등 고정비 (만원)
  regulated: [
    "강북14개구|강북구","강북14개구|광진구","강북14개구|노원구","강북14개구|도봉구",
    "강북14개구|동대문구","강북14개구|마포구","강북14개구|서대문구","강북14개구|성동구",
    "강북14개구|성북구","강북14개구|용산구","강북14개구|은평구","강북14개구|종로구",
    "강북14개구|중구","강북14개구|중랑구",
    "강남11개구|강남구","강남11개구|강동구","강남11개구|강서구","강남11개구|관악구",
    "강남11개구|구로구","강남11개구|금천구","강남11개구|동작구","강남11개구|서초구",
    "강남11개구|송파구","강남11개구|양천구","강남11개구|영등포구",
    "과천시","광명시","성남시|분당구","성남시|수정구","성남시|중원구",
    "수원시|영통구","수원시|장안구","수원시|팔달구","안양시|동안구",
    "용인시|수지구","의왕시","하남시"
  ]
};
var RULES = JSON.parse(JSON.stringify(DEFAULT_RULES));

var TABS = [
  { id: "start",   name: "시작",        build: buildStart },
  { id: "market",  name: "시장 현황",   build: buildMarket },
  { id: "quad",    name: "4분면",       build: buildQuad },
  { id: "vol",     name: "거래량",      build: buildVol },
  { id: "rank",    name: "전국 급지표", build: buildRank },
  { id: "gap",     name: "갭투자",      build: buildGap },
  { id: "move",    name: "갈아타기",    build: buildMove },
  { id: "rota",    name: "순환매",      build: buildRota },
  { id: "reco",    name: "맞춤 추천",   build: buildReco },
  { id: "danji",   name: "단지 찾기",   build: buildDanji },
  { id: "flag",    name: "대장 아파트", build: buildFlag },
  { id: "cmpx",    name: "단지 비교",   build: buildCmpx },
  { id: "calc",    name: "자금 계산기", build: buildCalc },
  { id: "setting", name: "기준·설정",   build: buildSetting }
];

document.addEventListener("DOMContentLoaded", function () {
  loadRules();
  var nav = document.getElementById("nav");
  var main = document.getElementById("main");
  TABS.forEach(function (t) {
    var b = document.createElement("button");
    b.textContent = t.name; b.dataset.tab = t.id;
    b.addEventListener("click", function () { showTab(t.id); });
    nav.appendChild(b);
    var s = document.createElement("section");
    s.className = "tab"; s.id = "tab-" + t.id;
    main.appendChild(s);   /* build 전에 먼저 DOM에 붙여야 getElementById가 동작 */
    if (t.build) t.build(s);
    else s.innerHTML = '<div class="placeholder">「' + t.name + '」 화면은 다음 버전에서 구현됩니다.</div>';
  });
  showTab("start");
  loadData();
});

function showTab(id) {
  document.querySelectorAll("nav button").forEach(function (b) { b.classList.toggle("on", b.dataset.tab === id); });
  document.querySelectorAll("section.tab").forEach(function (s) { s.classList.toggle("on", s.id === "tab-" + id); });
  if (!DB) return;
  if (id === "market") renderMarket();
  if (id === "rank") renderRank();
  if (id === "gap") renderGap();
  if (id === "move") renderMove();
  if (id === "reco") renderReco();
  if (id === "danji") renderDanjiShell();
  if (id === "quad") renderQuad();
  if (id === "vol") renderVolShell();
  if (id === "flag") renderFlagShell();
  if (id === "cmpx") renderCmpxShell();
  if (id === "rota") renderRota();
  if (id === "calc") renderCalc();
}

/* ══ 시작 탭 ══════════════════════════════════ */
function buildStart(root) {
  root.innerHTML =
    '<div class="card">' +
      '<div class="eyebrow">My Condition</div><h2>내 조건</h2>' +
      '<p class="desc">여기 값이 모든 탭의 계산에 쓰입니다. 금액 단위는 <b>만원</b>입니다.</p>' +
      '<div class="grid">' +
        '<div class="field"><label for="f-cash">동원 가능 현금 (만원)</label><input id="f-cash" type="number" inputmode="numeric" placeholder="예: 30000"></div>' +
        '<div class="field"><label for="f-area">기준 전용면적</label><select id="f-area">' +
          '<option value="36">36㎡ · 14평형</option><option value="46">46㎡ · 18평형</option>' +
          '<option value="59">59㎡ · 24평형</option><option value="84" selected>84㎡ · 34평형</option>' +
          '<option value="101">101㎡ · 40평형</option></select></div>' +
        '<div class="field full"><label for="f-home">지금 사는 지역</label><select id="f-home"><option value="">데이터 로드 중…</option></select></div>' +
        '<div class="field"><label for="f-income">연소득 (만원 · DSR용)</label><input id="f-income" type="number" inputmode="numeric" placeholder="0이면 미적용"></div>' +
        '<div class="field"><label for="f-rate">주담대 금리 (%)</label><input id="f-rate" type="number" step="0.1" inputmode="decimal" placeholder="예: 4.0"></div>' +
        '<div class="field"><label for="f-own">보유 주택 상태</label><select id="f-own">' +
          '<option value="none" selected>무주택</option><option value="switch">1주택 · 갈아타기 (기존 처분)</option>' +
          '<option value="add">1주택 · 추가 매수 (유지)</option><option value="multi">2주택 이상</option></select></div>' +
        '<div class="field"><label>&nbsp;</label><label class="check"><input type="checkbox" id="f-first"> 생애최초 구입</label></div>' +
      '</div>' +
      '<p class="hint" id="save-hint">값은 이 브라우저에만 저장됩니다.</p>' +
    '</div>' +
    '<div class="card">' +
      '<div class="eyebrow">Data</div>' +
      '<h2>데이터 상태 <span id="data-badge" class="badge err">로드 중</span></h2>' +
      '<p class="desc">KB부동산 월간 시계열이 정상적으로 붙었는지 확인하는 패널입니다.</p>' +
      '<div class="status" id="data-status"></div>' +
    '</div>';
  ["f-cash","f-area","f-home","f-income","f-rate","f-own","f-first"].forEach(function (id) {
    root.querySelector("#" + id).addEventListener("change", saveCond);
  });
}

function getCond() {
  return {
    cash:   Number(val("f-cash")) || 0,
    area:   Number(val("f-area")) || 84,
    home:   val("f-home"),
    income: Number(val("f-income")) || 0,
    rate:   Number(val("f-rate")) || 4.0,
    own:    val("f-own") || "none",
    first:  !!(document.getElementById("f-first") && document.getElementById("f-first").checked)
  };
}
function saveCond() {
  var c = getCond();
  try { localStorage.setItem(LS_COND, JSON.stringify(c)); } catch (e) {}
  renderCondBar();
  var h = document.getElementById("save-hint");
  if (h) h.textContent = "저장됨 · 값은 이 브라우저에만 보관됩니다.";
}
function restoreCond() {
  var raw = null;
  try { raw = localStorage.getItem(LS_COND); } catch (e) {}
  if (!raw) return;
  try {
    var c = JSON.parse(raw);
    setVal("f-cash", c.cash); setVal("f-area", c.area); setVal("f-home", c.home);
    setVal("f-income", c.income); setVal("f-rate", c.rate); setVal("f-own", c.own);
    var f = document.getElementById("f-first"); if (f) f.checked = !!c.first;
  } catch (e) {}
}
function val(id) { var el = document.getElementById(id); return el ? el.value : ""; }
function setVal(id, v) { var el = document.getElementById(id); if (el && v != null && v !== "") el.value = v; }

/* ══ 데이터 유틸 ═════════════════════════════ */
function loadData() {
  fetch("kb_data.json")
    .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .then(function (j) { DB = j; onDataReady(); })
    .catch(function (e) {
      var b = document.getElementById("data-badge");
      if (b) { b.className = "badge err"; b.textContent = "로드 실패"; }
      var s = document.getElementById("data-status");
      if (s) s.innerHTML = '<div class="stat" style="grid-column:1/-1"><div class="k">원인</div>' +
        '<div class="v" style="font-size:.85rem;font-weight:600">kb_data.json을 찾지 못했습니다 (' + e.message + ').</div></div>';
    });
}
function ymNum(ym) { var p = ym.split("-"); return Number(p[0]) * 12 + Number(p[1]); }
function getVal(key, region, y, m) {
  var blk = DB[key]; if (!blk) return null;
  var s = blk.series[region]; if (!s) return null;
  var i = (y * 12 + m) - ymNum(blk.dates[0]) - s.o;
  return (i >= 0 && i < s.v.length) ? s.v[i] : null;
}
function lastVal(key, region) {
  var s = DB[key].series[region]; if (!s) return null;
  return s.v[s.v.length - 1];
}
function decVal(key, region, y) {
  var e = DB[key].dates[1].split("-");
  if (y === Number(e[0])) return getVal(key, region, y, Number(e[1]));
  return getVal(key, region, y, 12);
}
function latestYM(key) { var e = DB[key].dates[1].split("-"); return [Number(e[0]), Number(e[1])]; }
function seriesStartYM(key, region) {
  var blk = DB[key]; var s = blk.series[region]; if (!s) return null;
  var n = ymNum(blk.dates[0]) + s.o;
  return [Math.floor((n - 1) / 12), ((n - 1) % 12) + 1];
}
function disp(k) { return k.replace("|", " "); }
/* salePm 키와 지수(sale/jeonse) 키의 표기 차이(공백·'시' 접미사)를 흡수 */
var IDXMAP = null;

}
function fmt(n) { return Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ","); }
function eok(n) { return (n / 10000).toFixed(n >= 100000 ? 0 : 1) + "억"; }
function pct(v, digits) {
  if (v == null) return "—";
  var d = digits == null ? 1 : digits;

/* ══ 자금 계산 (모든 탭 공용) ═════════════════ */
function isRegulated(region) { return RULES.regulated.indexOf(region) >= 0; }

/* price(만원)와 지역·내 조건으로 대출가능액과 필요현금 산출 */
function finance(region, price, cond, flags) {
  var reg = flags ? !!flags.reg : isRegulated(region);
  var metro = flags ? !!flags.metro : !!METRO[region];
  var own = cond.own;

  /* 1) LTV */
  var ltv;
  if (own === "add" || own === "multi") {
    ltv = (reg || metro) ? 0 : RULES.ltvMulti;   // 수도권·규제 추가매수는 주담대 금지
  } else {
    ltv = reg ? RULES.ltvReg : RULES.ltvFree;
    if (cond.first && !metro && !reg) ltv = Math.max(ltv, RULES.ltvFirstLocal);
  }
  var ltvAmt = price * ltv / 100;

  /* 2) 총액 상한 (수도권 또는 규제지역) */
  var capAmt = Infinity;
  if ((metro || reg) && ltv > 0) {
    capAmt = price <= RULES.capT1Lim ? RULES.capT1 : (price <= RULES.capT2Lim ? RULES.capT2 : RULES.capT3);
  }

  /* 3) DSR (연소득 0이면 미적용) */
  var dsrAmt = Infinity;
  if (cond.income > 0 && ltv > 0) {
    var r = (cond.rate + RULES.stress) / 100 / 12;
    var n = RULES.loanYears * 12;
    var pay = cond.income * RULES.dsr / 100 / 12;
    dsrAmt = r > 0 ? pay * (1 - Math.pow(1 + r, -n)) / r : pay * n;
  }

  var loan = Math.min(ltvAmt, capAmt, dsrAmt);
  var tag = loan === ltvAmt ? "LTV " + ltv + "%" : (loan === capAmt ? "총액상한" : "DSR");
  if (ltv === 0) { loan = 0; tag = "대출불가"; }

  /* 4) 취득세 */
  var acqRate;
  if ((own === "add") && reg) acqRate = RULES.acq2Reg;
  else if (own === "multi" && reg) acqRate = RULES.acq3Reg;
  else if (own === "multi") acqRate = RULES.acq2Reg;   // 비규제 3주택도 중과(기본 8%)
  else acqRate = price <= 60000 ? 1 : (price >= 90000 ? 3 : (price * 2 / 30000 - 3));
  var acq = price * acqRate / 100;

  /* 5) 부대비용 */
  var broker = price * RULES.broker / 100;
  var etc = price * RULES.etcRate / 100 + RULES.etcFixed;

  return { price: price, loan: loan, tag: tag, acq: acq, broker: broker, etc: etc,
           need: price - loan + acq + broker + etc, reg: reg, metro: metro };
}

  k += statBox("규제지역 수", RULES.regulated.length + "곳");

      if (x < a.left || x > a.right) return;
      ctx.save();

      ctx.setLineDash([]);
      ctx.fillStyle = cCash; ctx.font = "700 10px Pretendard Variable";
      ctx.fillText("내 현금 " + eok(cash), Math.min(x + 4, a.right - 70), a.top + 10);
      ctx.restore();
    }
  };
  if (chartRank) chartRank.destroy();
  chartRank = new Chart(canvas, {
    type: "bar",
    data: {
      labels: rows.map(function (r) { return (r.reg ? "⛔" : "") + disp(r.key); }),
      datasets: [{
        label: "필요현금",
        data: rows.map(function (r) { return r.need; }),
        backgroundColor: rows.map(function (r) { return (cash > 0 && r.need <= cash) ? cUp : cMiss; }),
        borderRadius: 2, barThickness: 12

  }).join("");

/* ══ 비율·배율 공용 헬퍼 ══════════════════════ */
/* salePm/jeonsePm에서 지역의 월별 값 배열(전체 구간, 결측 null) */
function pmSeries(key, region) {
  var blk = DB[key]; var s = blk.series[region]; if (!s) return null;
  var n = blk.dates[2];
  var out = new Array(n).fill(null);
  for (var i = 0; i < s.v.length; i++) out[s.o + i] = s.v[i];
  return out;
}
function pmLabels() {
  var blk = DB.salePm;
  var t0 = ymNum(blk.dates[0]);
  var out = [];
  for (var i = 0; i < blk.dates[2]; i++) {
    var t = t0 + i;
    out.push(Math.floor((t - 1) / 12) + "." + (((t - 1) % 12) + 1));
  }
  return out;
}
/* 두 배열의 비율 시계열 (둘 다 있는 달만) */
function ratioSeries(numArr, denArr, mul) {
  return numArr.map(function (a, i) {
    var b = denArr[i];
    return (a != null && b != null && b !== 0) ? a / b * (mul || 1) : null;
  });
}
/* 최근 n개월 유효값과 현재값의 백분위·밴드 */
function bandStats(arr, nMonths) {
  var tail = arr.slice(-nMonths).filter(function (v) { return v != null; });
  var cur = null;
  for (var i = arr.length - 1; i >= 0; i--) if (arr[i] != null) { cur = arr[i]; break; }
  if (!tail.length || cur == null) return null;
  var sorted = tail.slice().sort(function (a, b) { return a - b; });
  var below = sorted.filter(function (v) { return v <= cur; }).length;
  var mid = sorted[Math.floor(sorted.length / 2)];
  return { cur: cur, min: sorted[0], max: sorted[sorted.length - 1], med: mid,
           pctile: below / sorted.length * 100, count: tail.length };
}
/* 밴드 배경 + 중앙값 점선을 그리는 차트 플러그인 생성기 */
function bandPlugin(getBand, color) {
  return {
    id: "band",
    beforeDatasetsDraw: function (chart) {
      var b = getBand(); if (!b) return;
      var y = chart.scales.y, a = chart.chartArea, ctx = chart.ctx;
      var yMin = y.getPixelForValue(b.max), yMax = y.getPixelForValue(b.min);
      ctx.save();
      ctx.fillStyle = color;
      ctx.fillRect(a.left, yMin, a.right - a.left, yMax - yMin);
      var yMed = y.getPixelForValue(b.med);
      ctx.strokeStyle = "#98a1ad"; ctx.setLineDash([4, 4]); ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(a.left, yMed); ctx.lineTo(a.right, yMed); ctx.stroke();
      ctx.restore();
    }
  };
}
/* 백분위 위치 태그 (lowGood: 낮을수록 유리한 지표인가) */
function bandTag(p, lowGood) {
  if (p == null) return { t: "—", c: "flat" };
  if (p <= 30) return { t: "하단 " + p.toFixed(0) + "%", c: lowGood ? "up" : "down" };
  if (p >= 70) return { t: "상단 " + p.toFixed(0) + "%", c: lowGood ? "down" : "up" };
  return { t: "중간 " + p.toFixed(0) + "%", c: "flat" };
}
/* 표본 수까지 감안한 태그: 24개월 미만이면 백분위를 신뢰하지 않음 */
function tagOf(band, lowGood) {
  if (!band) return { t: "—", c: "flat" };
  if (band.count < 24) return { t: "표본 부족", c: "flat" };
  return bandTag(band.pctile, lowGood);
}
/* 밴드 라벨: 10년치가 안 되면 실제 개월 수를 밝힘 */
function bandLabel(band) {
  if (!band) return "10년 밴드";
  return band.count >= 120 ? "10년 밴드" : "밴드 (" + band.count + "개월)";
}
/* 앞쪽 결측 구간을 잘라 실제 데이터 구간만 차트에 표시 */
function trimSeries(labels, arr) {
  var first = 0;
  while (first < arr.length && arr[first] == null) first++;
  return { labels: labels.slice(first), data: arr.slice(first) };
}

var RECO = { sort: "rank", budgetOnly: false };

/* 시군구 → 수급조사(시도 단위) 키 매핑 */
function surveyKey(k) {
  var top = k.split("|")[0];
  var direct = ["부산광역시","대구광역시","인천광역시","대전광역시","울산광역시",
    "(구)광주광역시","세종특별자치시","강원특별자치도","충청북도","충청남도",
    "전북특별자치도","(구)전라남도","경상북도","경상남도","제주특별자치도",
    "강북14개구","강남11개구"];
  if (direct.indexOf(top) >= 0) return top;
  if (METRO[k]) return "경기도";   /* 서울·인천은 위에서 걸러졌으므로 남은 수도권 = 경기 */
  return "전국";
}
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

/* 지역 하나의 5축 점수 + 종합 */
function scoreRegion(k, idx, cond, homePmArr) {
  var N = RANKED.length;
  var pm = lastVal("salePm", k);
  var f = finance(k, pm * cond.area, cond);

  /* ① 급지: 서열 백분위 */
  var sRank = (1 - idx / (N - 1)) * 100;

  /* ② 장기성과: 매매지수 10년 연복리 (7.2%/년 = 100점) */
  var e = latestYM("sale");
  var iN = getVal("sale", ik(k), e[0], e[1]);
  var i10 = getVal("sale", ik(k), e[0] - 10, e[1]);
  var sPerf = 50, cagr = null;
  if (iN != null && i10 != null && i10 > 0) {
    cagr = (Math.pow(iN / i10, 1 / 10) - 1) * 100;
    sPerf = clamp(cagr / 7.2, 0, 1) * 100;
  }

  /* ③ 수급: 시도 단위 매수우위·전세수급 평균 → 20~100 */
  var sk = surveyKey(k);
  var buyer = lastVal("buyerIdx", sk), sup = lastVal("jeonseSupply", sk);
  var sSupply = 60;
  if (buyer != null && sup != null) sSupply = clamp(20 + (buyer + sup) / 2 / 200 * 80, 20, 100);

  /* ④ 타이밍: 무주택=전세가율 밴드(높을수록↑), 유주택=배율 밴드(낮을수록↑) → 40~100 */
  var sTiming = 70, timingNote = "중립";
  if (cond.own === "none" || !homePmArr) {
    var b = bandStats(ratioSeries(pmSeries("jeonsePm", k), pmSeries("salePm", k), 100), 120);
    if (b && b.count >= 24) { sTiming = 40 + b.pctile * 0.6; timingNote = "전세가율 " + b.pctile.toFixed(0) + "%"; }
  } else {
    var b2 = bandStats(ratioSeries(pmSeries("salePm", k), homePmArr, 1), 120);
    if (b2 && b2.count >= 24) { sTiming = 40 + (100 - b2.pctile) * 0.6; timingNote = "배율 " + b2.pctile.toFixed(0) + "%"; }
  }

  /* ⑤ 자금: 현금/필요현금 */
  var sCash = 50;
  if (cond.cash > 0 && f.need > 0) sCash = clamp(cond.cash / f.need * 100, 0, 100);

  var W = RULES;
  var wSum = W.wRank + W.wPerf + W.wSupply + W.wTiming + W.wCash;
  var total = (sRank * W.wRank + sPerf * W.wPerf + sSupply * W.wSupply +
               sTiming * W.wTiming + sCash * W.wCash) / wSum;

  return { key: k, rank: idx + 1, pm: pm, fin: f, cagr: cagr,
           s: { rank: sRank, perf: sPerf, supply: sSupply, timing: sTiming, cash: sCash },
           timingNote: timingNote, total: total };
}

    '<div class="card"><div class="eyebrow">Table</div><h2>전체 채점표</h2><div class="expbar"><button class="btn sm ghost" data-exp="img" data-name="맞춤추천">이미지 저장</button><button class="btn sm ghost" data-exp="xlsx" data-table="rc-table" data-name="맞춤추천">엑셀 저장</button></div>' +
      '<div class="tblwrap"><table id="rc-table"><thead><tr>' +
      '<th>#</th><th>지역</th><th>종합</th><th>급지</th><th>성과</th><th>수급</th><th>타이밍</th><th>자금</th><th>필요현금</th></tr>' +
      '</thead><tbody></tbody></table></div>' +
      '<div class="note">추천 카드의 필요현금은 <b>그 지역 ㎡당 평균가</b> 기준입니다. 실제 단지는 평균 위아래로 ' +
        '흩어져 있고 대장 단지는 평균보다 30~50% 비싼 경우가 흔합니다 — 단지 단위 확인은 단지 찾기 탭(다음 버전)에서 합니다.</div></div>';

  root.querySelectorAll("#rc-sort button").forEach(function (b) {
    b.addEventListener("click", function () {
      RECO.sort = b.dataset.s;

      renderReco();
    });

  root.querySelector("#rc-budget").addEventListener("change", function () {
    RECO.budgetOnly = this.checked; renderReco();

}

function renderReco() {
  if (!DB || !RANKED.length) return;
  var cond = getCond();
  var homePmArr = (cond.own !== "none" && cond.home && DB.salePm.series[cond.home])
    ? pmSeries("salePm", cond.home) : null;

  var rows = RANKED.map(function (k, i) { return scoreRegion(k, i, cond, homePmArr); });

  /* 콜아웃: 조건 요약 */
  var co = document.getElementById("rc-callout");
  if (cond.cash <= 0) {
    co.innerHTML = '<div class="callout warn">시작 탭에서 <b>동원 가능 현금</b>을 입력하면 자금 점수와 예산 필터가 정확해집니다.</div>';
  } else {
    var nHit = rows.filter(function (r) { return r.fin.need <= cond.cash; }).length;
    co.innerHTML = '<div class="callout">현금 <b>' + eok(cond.cash) + "</b> · " + cond.area + "㎡ · " +
      { none: "무주택", switch: "갈아타기", add: "추가매수", multi: "다주택" }[cond.own] +
      (cond.own !== "none" && cond.home ? " (내 지역 " + disp(cond.home) + ")" : "") +
      " — 예산 내 <b>" + nHit + "곳</b></div>";
  }

  /* 정렬·필터 */
  var list = rows.slice();
  if (RECO.budgetOnly && cond.cash > 0) list = list.filter(function (r) { return r.fin.need <= cond.cash; });
  if (RECO.sort === "rank") {
    if (cond.cash > 0) list = list.filter(function (r) { return r.fin.need <= cond.cash; });
    /* 서열순: 예산 안에서 가장 비싼 곳부터 (이미 RANKED 순) */
  } else if (RECO.sort === "score") {
    list.sort(function (a, b) { return b.total - a.total; });
  } else {
    list.sort(function (a, b) { return a.fin.need - b.fin.need; });
  }

  /* 상위 5 카드 */
  var topEl = document.getElementById("rc-top");
  if (!list.length) {
    topEl.innerHTML = '<div class="callout warn">조건에 맞는 지역이 없습니다. 예산 필터를 끄거나 평형·현금을 조정해보세요.</div>';
  } else {
    topEl.innerHTML = list.slice(0, 5).map(function (r, i) {
      return '<div class="reco' + (i === 0 ? " best" : "") + '">' +
        '<div class="no">' + (i + 1) + "</div>" +
        '<div class="body"><div class="name">' + (r.fin.reg ? "⛔ " : "") + disp(r.key) +
          ' <span style="font-weight:600;color:var(--ink-soft);font-size:.78rem">서열 ' + r.rank + "위</span></div>" +
        '<div class="chips">' +
          '<span class="chip">급지 <b>' + r.s.rank.toFixed(0) + "</b></span>" +
          '<span class="chip">성과 <b>' + r.s.perf.toFixed(0) + "</b>" + (r.cagr != null ? " (" + pct(r.cagr, 1) + "/년)" : "") + "</span>" +
          '<span class="chip">수급 <b>' + r.s.supply.toFixed(0) + "</b></span>" +
          '<span class="chip">타이밍 <b>' + r.s.timing.toFixed(0) + "</b> (" + r.timingNote + ")</span>" +
          '<span class="chip">자금 <b>' + r.s.cash.toFixed(0) + "</b></span>" +
        "</div></div>" +
        '<div class="money"><div class="score">' + r.total.toFixed(1) + "</div>" +
        '<div class="need">필요현금 ' + eok(r.fin.need) + "</div></div></div>";
    }).join("");
  }

  /* 백테스트 카드 (매 렌더 계산 — 가볍고 데이터 갱신에 자동 대응) */
  var e = latestYM("sale");
  var bt = [];
  RANKED.forEach(function (k) {
    var p16 = getVal("salePm", k, e[0] - 10, e[1]);
    var i16 = getVal("sale", ik(k), e[0] - 10, e[1]);
    var iN = getVal("sale", ik(k), e[0], e[1]);
    if (p16 != null && i16 != null && iN != null) bt.push([p16, (iN / i16 - 1) * 100]);
  });
  bt.sort(function (a, b) { return b[0] - a[0]; });
  function seg(a, b) {
    var part = bt.slice(Math.floor(bt.length * a / 10), Math.ceil(bt.length * b / 10));
    if (!part.length) return null;
    return part.reduce(function (s, x) { return s + x[1]; }, 0) / part.length;
  }
  var g1 = seg(0, 3), g2 = seg(3, 6), g3 = seg(6, 10);
  var btEl = document.getElementById("rc-bt");
  btEl.innerHTML =
    statBox("상위 1~3분위 (" + (e[0] - 10) + "→" + e[0] + ")", g1 != null ? pct(g1, 1) : "—", cls(g1)) +
    statBox("중위 4~6분위", g2 != null ? pct(g2, 1) : "—", cls(g2)) +
    statBox("하위 7~10분위", g3 != null ? pct(g3, 1) : "—", cls(g3)) +
    statBox("표본", bt.length + "개 지역");

  /* 전체 표 */
  var tb = document.querySelector("#rc-table tbody");
  tb.innerHTML = list.map(function (r, i) {
    var hit = cond.cash > 0 && r.fin.need <= cond.cash;
    return '<tr class="' + (hit ? "hit" : "") + '"><td>' + (i + 1) + "</td>" +
      "<td>" + (r.fin.reg ? "⛔ " : "") + disp(r.key) + "</td>" +
      "<td><b>" + r.total.toFixed(1) + "</b></td>" +
      "<td>" + r.s.rank.toFixed(0) + "</td>" +
      "<td>" + r.s.perf.toFixed(0) + "</td>" +
      "<td>" + r.s.supply.toFixed(0) + "</td>" +
      "<td>" + r.s.timing.toFixed(0) + "</td>" +
      "<td>" + r.s.cash.toFixed(0) + "</td>" +
      "<td>" + eok(r.fin.need) + "</td></tr>";
  }).join("");
}

/* ══ 거래량 탭 ═══════════════════════════════ */
var VOL = { lawd: "", regionKey: "", months: 24, rows: [] };
var chartVol = null;

function buildVol(root) {
  root.innerHTML =
    '<div class="card">' +
      '<div class="eyebrow">Volume</div><h2>거래량 · 국면 판정</h2>' +

        '가격과 거래량의 조합으로 지금 국면을 판정합니다 — 가격↑거래↑는 강한 상승, 가격↑거래↓는 ' +
        '호가만 오르는 상승 동력 둔화입니다.</p>' +
      '<div class="grid">' +
        '<div class="field"><label for="vl-region">지역</label><select id="vl-region"></select></div>' +
        '<div class="field"><label for="vl-lawd">법정동코드 직접 입력 (선택)</label>' +

          '<button data-m="12">12개월</button><button data-m="24" class="on">24개월</button></div></div>' +

      '</div>' +

      '<div class="note" id="vl-read" style="margin-top:10px;display:none"></div></div>' +
    '<div class="card" id="vl-chartcard" style="display:none"><div class="eyebrow">Trend</div><h2>월별 거래건수</h2>' +
      '<p class="desc">막대는 월 거래건수, 선은 12개월 이동평균입니다. 선이 우상향이면 손바뀜이 늘고 있는 국면입니다.</p>' +
      '<div class="chartbox"><canvas id="vl-chart"></canvas></div></div>' +
    '<div class="card" id="vl-tablecard" style="display:none"><div class="eyebrow">Monthly</div><h2>월별 기록</h2>' +
      '<div class="expbar"><button class="btn sm ghost" data-exp="img" data-name="거래량">이미지 저장</button>' +
      '<button class="btn sm ghost" data-exp="xlsx" data-table="vl-table" data-name="거래량">엑셀 저장</button></div>' +
      '<div class="tblwrap"><table id="vl-table"><thead><tr>' +
      '<th>월</th><th>거래건수</th><th>전월 대비</th><th>12개월 평균</th><th>평당가 중위</th></tr></thead><tbody></tbody></table></div>' +
      '<div class="note"><b>주의</b> — 실거래 신고 기한(계약 후 30일) 때문에 최근 1~2개월은 실제보다 적게 ' +
        '집계됩니다. 마지막 막대가 낮은 건 하락이 아니라 <b>아직 다 들어오지 않은 것</b>일 수 있습니다.</div></div>';

  root.querySelector("#vl-go").addEventListener("click", loadVol);

function renderVolShell() {
  if (!DB || !RANKED.length) return;
  var sel = document.getElementById("vl-region");
  if (sel && !sel.options.length) {
    RANKED.forEach(function (k) {
      if (!LAWD[k]) return;
      var o = document.createElement("option");
      o.value = k; o.textContent = disp(k);
      sel.appendChild(o);
    });
  }
}

function median(arr) {
  if (!arr.length) return null;
  var s = arr.slice().sort(function (a, b) { return a - b; });
  var m = Math.floor(s.length / 2);
  return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2;
}

function loadVol() {
  var manual = (document.getElementById("vl-lawd").value || "").trim();
  var regionKey = document.getElementById("vl-region").value;
  var lawd = /^\d{5}$/.test(manual) ? manual : LAWD[regionKey];
  if (!lawd) { alert("지역을 선택하거나 5자리 법정동코드를 입력하세요."); return; }
  VOL.lawd = lawd;
  var btn = document.getElementById("vl-go");
  btn.disabled = true;
  var months = ymList(VOL.months).reverse();   /* 과거→현재 순 */
  var done = 0;
  btn.textContent = "불러오는 중… (0/" + months.length + ")";
  Promise.all(months.map(function (ym) {
    return fetch("/api/trades?kind=sale&lawd=" + lawd + "&ym=" + ym)
      .then(function (r) { return r.json(); })
      .then(function (j) {
        done++; btn.textContent = "불러오는 중… (" + done + "/" + months.length + ")";
        if (j.error) throw new Error(j.error + (j.msg ? " · " + j.msg : ""));
        var deals = (j.items || []).filter(function (t) { return !t.canceled && t.amount > 0 && t.area > 0; });
        return { ym: ym, cnt: deals.length,
                 pyMed: median(deals.map(function (t) { return t.amount / t.area * 3.3058; })) };
      });
  })).then(function (rows) {
    VOL.rows = rows;
    renderVolResult();
  }).catch(function (e) {
    alert("거래량 조회 실패: " + e.message);
  }).finally(function () {
    btn.disabled = false; btn.textContent = "거래량 불러오기";
  });
}

function renderVolResult() {
  var rows = VOL.rows;
  /* 12개월 이동평균 */
  rows.forEach(function (r, i) {
    if (i >= 11) {
      var s = 0;
      for (var j = i - 11; j <= i; j++) s += rows[j].cnt;
      r.ma = s / 12;
    } else r.ma = null;
  });
  /* 최근 1개월은 신고 지연으로 제외하고 판정 */
  var solid = rows.slice(0, -1);
  var last3 = solid.slice(-3), prev3 = solid.slice(-6, -3);
  var avg3 = last3.reduce(function (a, r) { return a + r.cnt; }, 0) / last3.length;
  var ma12 = solid[solid.length - 1].ma;
  var ratio = ma12 ? avg3 / ma12 : null;
  var p3 = median(last3.map(function (r) { return r.pyMed; }).filter(function (v) { return v != null; }));
  var p3prev = median(prev3.map(function (r) { return r.pyMed; }).filter(function (v) { return v != null; }));
  var priceChg = (p3 && p3prev) ? (p3 / p3prev - 1) * 100 : null;

  var phase, phaseC;
  var volUp = ratio != null && ratio >= 1.0, priceUp = priceChg != null && priceChg > 0;
  if (priceUp && volUp) { phase = "강한 상승"; phaseC = "up"; }
  else if (priceUp) { phase = "상승 동력 둔화"; phaseC = "down"; }
  else if (volUp) { phase = "손바뀜 · 바닥 탐색"; phaseC = "flat"; }
  else { phase = "침체 지속"; phaseC = "flat"; }

  document.getElementById("vl-kpi").innerHTML =
    statBox("최근 3개월 월평균", Math.round(avg3) + "건") +
    statBox("거래량 배율 (3m÷12m)", ratio != null ? ratio.toFixed(2) + "배" : "—", ratio != null ? (ratio >= 1.3 ? "up" : (ratio <= 0.7 ? "down" : "")) : "") +
    statBox("평당가 3개월", priceChg != null ? pct(priceChg, 1) : "—", cls(priceChg)) +
    statBox("국면 판정", phase, phaseC);

  var read = document.getElementById("vl-read");
  read.style.display = "";
  read.innerHTML = "<b>가격 × 거래량 조합</b> — 가격↑거래↑ 강한 상승 (매수세가 실제로 붙음) · " +
    "가격↑거래↓ 상승 동력 둔화 (호가만 오르고 손바뀜 없음) · 가격↓거래↑ 손바뀜·바닥 탐색 · 가격↓거래↓ 침체 지속. " +
    "배율 1.3 이상이면 뚜렷한 유입, 0.7 이하면 관망입니다.";

  var css = getComputedStyle(document.documentElement);
  var cUp = css.getPropertyValue("--up").trim(), cDown = css.getPropertyValue("--down").trim();
  document.getElementById("vl-chartcard").style.display = "";
  if (chartVol) chartVol.destroy();
  chartVol = new Chart(document.getElementById("vl-chart"), {
    data: {
      labels: rows.map(function (r) { return r.ym.slice(0, 4) + "." + Number(r.ym.slice(4)); }),
      datasets: [
        { type: "bar", label: "월 거래건수", data: rows.map(function (r) { return r.cnt; }),
          backgroundColor: cUp + "99", borderRadius: 2, order: 2 },
        { type: "line", label: "12개월 이동평균", data: rows.map(function (r) { return r.ma; }),
          borderColor: cDown, borderWidth: 2, pointRadius: 0, tension: .2, order: 1 }
      ]
    },
    options: chartOpts("건")
  });

  document.getElementById("vl-tablecard").style.display = "";
  var tb = document.querySelector("#vl-table tbody");
  tb.innerHTML = rows.slice().reverse().map(function (r, i, arr) {
    var prev = arr[i + 1];
    var chg = (prev && prev.cnt > 0) ? (r.cnt / prev.cnt - 1) * 100 : null;
    return "<tr><td>" + r.ym.slice(0, 4) + "." + r.ym.slice(4) + "</td>" +
      "<td><b>" + r.cnt + "건</b></td>" +
      '<td class="' + cls(chg) + '">' + (chg != null ? pct(chg, 1) : "—") + "</td>" +
      "<td>" + (r.ma != null ? r.ma.toFixed(1) + "건" : "—") + "</td>" +
      "<td>" + (r.pyMed != null ? fmt(r.pyMed) + "만" : "—") + "</td></tr>";
  }).join("");
}

function ymList(n) {
  var now = new Date();
  var y = now.getFullYear(), m = now.getMonth() + 1;
  var out = [];
  for (var i = 0; i < n; i++) {
    out.push(String(y * 100 + m));
    m--; if (m === 0) { m = 12; y--; }
  }
  return out;
}

function loadDanji() {
  var manual = (document.getElementById("dj-lawd").value || "").trim();
  var regionKey = document.getElementById("dj-region").value;
  var lawd = /^\d{5}$/.test(manual) ? manual : LAWD[regionKey];
  if (!lawd) { alert("지역을 선택하거나 5자리 법정동코드를 입력하세요."); return; }
  DJ.lawd = lawd;
  DJ.regionKey = /^\d{5}$/.test(manual) ? "" : regionKey;
  DJ.kaptList = null;
  var btn = document.getElementById("dj-go");
  btn.disabled = true; btn.textContent = "불러오는 중… (0/" + DJ.months + ")";
  var months = ymList(DJ.months);
  var total = DJ.months * 2, done = 0;
  function tick() { done++; btn.textContent = "불러오는 중… (" + done + "/" + total + ")"; }
  var saleP = Promise.all(months.map(function (ym) {
    return fetch("/api/trades?kind=sale&lawd=" + lawd + "&ym=" + ym)
      .then(function (r) { return r.json(); })
      .then(function (j) {
        tick();
        if (j.error) throw new Error(j.error + (j.msg ? " · " + j.msg : ""));
        return j.items || [];
      });
  }));
  var rentP = Promise.all(months.map(function (ym) {
    return fetch("/api/trades?kind=rent&lawd=" + lawd + "&ym=" + ym)
      .then(function (r) { return r.json(); })
      .then(function (j) { tick(); return j.error ? [] : (j.items || []); })
      .catch(function () { tick(); return []; });   /* 전세 실패해도 매매는 표시 */
  }));
  Promise.all([saleP, rentP]).then(function (both) {
    var lists = both[0];
    var rentAll = [].concat.apply([], both[1]).filter(function (t) { return t.jeonse && t.deposit > 0 && t.area > 0; });
    DJ.rentAll = rentAll;
    var all = [].concat.apply([], lists).filter(function (t) { return !t.canceled && t.amount > 0 && t.area > 0; });
    /* 단지(이름+법정동)별 집계 */
    var byApt = {};
    all.forEach(function (t) {
      var id = t.dong + "|" + t.apt;
      var g = byApt[id] || (byApt[id] = { id: id, apt: t.apt, dong: t.dong, deals: [], buildYear: t.buildYear });
      g.deals.push(t);
      if (t.buildYear && !g.buildYear) g.buildYear = t.buildYear;
    });
    DJ.rows = Object.keys(byApt).map(function (id) {
      var g = byApt[id];
      var pmVals = g.deals.map(function (t) { return t.amount / t.area; });
      g.pmAvg = pmVals.reduce(function (a, b) { return a + b; }, 0) / pmVals.length;
      g.cnt = g.deals.length;
      g.areas = g.deals.map(function (t) { return t.area; });
      var last = g.deals.slice().sort(function (a, b) { return (b.ym * 100 + b.day) - (a.ym * 100 + a.day); })[0];
      g.last = last;
      /* 전세 매칭: 같은 동·단지, 대표 면적 ±8㎡의 전세 보증금 중위 */
      var medArea = median(g.areas);
      g.amtMed = median(g.deals.filter(function (t) { return Math.abs(t.area - medArea) <= 8; })
                        .map(function (t) { return t.amount; }));
      var jv = rentAll.filter(function (t) {
        return t.dong === g.dong && t.apt === g.apt && Math.abs(t.area - medArea) <= 8;
      }).map(function (t) { return t.deposit; });
      g.jeonse = median(jv);
      g.jCnt = jv.length;
      g.gap = (g.amtMed != null && g.jeonse != null) ? g.amtMed - g.jeonse : null;
      g.jr = (g.amtMed && g.jeonse) ? g.jeonse / g.amtMed * 100 : null;
      return g;
    }).sort(function (a, b) { return b.pmAvg - a.pmAvg; });
    document.getElementById("dj-resultcard").style.display = "";
    renderDanjiTable();
  }).catch(function (e) {
    alert("실거래 조회 실패: " + e.message + "\n\nVercel 환경변수 MOLIT_API_KEY가 설정돼 있는지, /api/trades가 배포됐는지 확인하세요.");
  }).finally(function () {
    btn.disabled = false; btn.textContent = "실거래 불러오기";
  });
}

function renderDanjiTable() {
  var cond = getCond();
  var rows = DJ.rows.filter(function (g) { return g.cnt >= DJ.minCnt; });
  if (DJ.areaFilter === "my") {
    rows = rows.filter(function (g) {
      return g.areas.some(function (a) { return Math.abs(a - cond.area) <= 8; });
    });
  }
  document.getElementById("dj-count").textContent = rows.length + "단지";
  var cart = getCart();
  var tb = document.querySelector("#dj-table tbody");
  tb.innerHTML = rows.map(function (g, i) {
    var inCart = cart.some(function (c) { return c.id === DJ.lawd + "|" + g.id; });
    return '<tr data-id="' + g.id + '"><td>' + (i + 1) + "</td>" +
      "<td><b>" + g.apt + "</b> <span style='color:var(--ink-soft);font-size:.76rem'>" + g.dong + "</span>" +
        '<div class="rowinfo" id="ki-' + i + '" style="display:none"></div></td>' +
      "<td><b>" + fmt(g.pmAvg) + "</b></td>" +
      "<td>" + fmt(g.pmAvg * 3.3058) + "</td>" +
      "<td>" + (g.jeonse != null ? eok(g.jeonse) : "—") + "</td>" +
      "<td>" + (g.gap != null ? "<b>" + eok(g.gap) + "</b>" : "—") + "</td>" +
      '<td class="' + (g.jr != null && g.jr >= 70 ? "up" : "") + '">' + (g.jr != null ? g.jr.toFixed(0) + "%" : "—") + "</td>" +
      "<td>" + g.cnt + "</td>" +
      "<td>" + String(g.last.ym).slice(0, 4) + "." + (g.last.ym % 100) + " · " + eok(g.last.amount) + " · " + g.last.floor + "층</td>" +
      "<td>" + (g.buildYear || "—") + "</td>" +
      '<td style="white-space:nowrap"><button class="btn sm ghost" data-act="info" data-i="' + i + '">단지정보</button> ' +
        '<button class="btn sm" data-act="cart" data-i="' + i + '"' + (inCart ? " disabled" : "") + ">" +
        (inCart ? "담김" : "담기") + "</button></td></tr>";
  }).join("");
  tb.querySelectorAll("button").forEach(function (b) {
    b.addEventListener("click", function () {
      var g = rows[Number(b.dataset.i)];
      if (b.dataset.act === "info") loadKaptInfo(g, Number(b.dataset.i));
      else addToCart(g, b);
    });
  });
}

/* K-apt 매칭: 이름 정규화 후 목록에서 검색 */
function normName(s) { return String(s).replace(/[\s()\[\]0-9단지차동아파트]/g, "").toLowerCase(); }
function loadKaptInfo(g, i) {
  var box = document.getElementById("ki-" + i);
  box.style.display = ""; box.textContent = "K-apt 조회 중…";
  var listP = DJ.kaptList
    ? Promise.resolve(DJ.kaptList)
    : fetch("/api/apt?kind=list&lawd=" + DJ.lawd).then(function (r) { return r.json(); })
        .then(function (j) { if (j.error) throw new Error(j.error); DJ.kaptList = j.items || []; return DJ.kaptList; });
  listP.then(function (list) {
    var n = normName(g.apt);
    var hit = null;
    for (var x = 0; x < list.length; x++) {
      var m = normName(list[x].name);
      if (m && (m.indexOf(n) >= 0 || n.indexOf(m) >= 0)) { hit = list[x]; break; }
    }
    if (!hit) { box.textContent = "K-apt 목록에서 같은 이름을 찾지 못했습니다 (오피스텔·나홀로 단지는 미등록일 수 있음)."; return null; }
    return fetch("/api/apt?kind=info&kapt=" + hit.kaptCode).then(function (r) { return r.json(); });
  }).then(function (j) {
    if (!j) return;
    if (j.error) throw new Error(j.error);
    var inf = j.info;
    g.kapt = inf;
    var parts = [];
    if (inf.households) parts.push("세대수 <b>" + fmt(inf.households) + "</b>" + (inf.households >= 500 ? " ✓" : ""));
    if (inf.parkingTotal) parts.push("주차 " + fmt(inf.parkingTotal) + "대" +
      (inf.households ? " (세대당 " + (inf.parkingTotal / inf.households).toFixed(2) + ")" : ""));
    if (inf.builder) parts.push("시공 " + inf.builder);
    if (inf.useDate) parts.push("승인 " + String(inf.useDate).slice(0, 4) + "." + String(inf.useDate).slice(4, 6));
    if (inf.subwayLine || inf.subwayStation) parts.push("지하철 " + [inf.subwayLine, inf.subwayStation].filter(Boolean).join(" "));
    if (inf.heat) parts.push(inf.heat);
    box.innerHTML = parts.length ? parts.join(" · ") : "상세 정보 없음";
  }).catch(function (e) { box.textContent = "K-apt 조회 실패: " + e.message; });
}

function addToCart(g, btn) {
  var cart = getCart();
  var id = DJ.lawd + "|" + g.id;
  if (cart.some(function (c) { return c.id === id; })) return;
  cart.push({
    id: id, lawd: DJ.lawd, regionKey: DJ.regionKey, apt: g.apt, dong: g.dong,
    pmAvg: Math.round(g.pmAvg), cnt: g.cnt, buildYear: g.buildYear,
    jeonse: g.jeonse != null ? Math.round(g.jeonse) : null,
    gap: g.gap != null ? Math.round(g.gap) : null,
    households: g.kapt ? g.kapt.households : null,
    parkingTotal: g.kapt ? g.kapt.parkingTotal : null,
    builder: g.kapt ? g.kapt.builder : null,
    lastAmount: g.last.amount, lastYm: g.last.ym
  });
  setCart(cart);
  btn.disabled = true; btn.textContent = "담김";
  renderCart();
}

function renderCart() {
  var cart = getCart();
  var cc = document.getElementById("cart-count");
  if (cc) cc.textContent = cart.length + "곳";
  var tb = document.querySelector("#cart-table tbody");
  if (!tb) return;
  tb.innerHTML = cart.length ? cart.map(function (c, i) {
    return "<tr><td><b>" + c.apt + "</b> <span style='color:var(--ink-soft);font-size:.76rem'>" + c.dong + "</span></td>" +
      "<td>" + (c.regionKey ? disp(c.regionKey) : c.lawd) + "</td>" +
      "<td>" + fmt(c.pmAvg) + "</td>" +
      "<td>" + (c.households ? fmt(c.households) : "—") + "</td>" +
      '<td><button class="btn sm ghost" data-i="' + i + '">빼기</button></td></tr>';
  }).join("") : '<tr><td colspan="5" style="color:var(--miss)">아직 담은 단지가 없습니다.</td></tr>';
  tb.querySelectorAll("button").forEach(function (b) {
    b.addEventListener("click", function () {
      var cart2 = getCart();
      cart2.splice(Number(b.dataset.i), 1);
      setCart(cart2);
      renderCart();
      renderDanjiTable();
    });
  });
}

  var name = "TrackApt_" + (b.dataset.name || "표") + "_" + new Date().toISOString().slice(0, 10).replace(/-/g, "");
  if (b.dataset.exp === "xlsx") {
    if (typeof XLSX === "undefined") { alert("엑셀 라이브러리를 아직 불러오지 못했습니다. 잠시 후 다시 시도하세요."); return; }
    var tbl = document.getElementById(b.dataset.table);
    if (!tbl) return;
    var wb = XLSX.utils.table_to_book(tbl, { sheet: b.dataset.name || "표" });
    XLSX.writeFile(wb, name + ".xlsx");
  } else {
    if (typeof html2canvas === "undefined") { alert("이미지 라이브러리를 아직 불러오지 못했습니다. 잠시 후 다시 시도하세요."); return; }
    var card = b.closest(".card");
    if (!card) return;
    card.classList.add("capturing");
    html2canvas(card, { backgroundColor: "#ffffff", scale: 2, useCORS: true }).then(function (canvas) {
      card.classList.remove("capturing");
      var a = document.createElement("a");
      a.download = name + ".png";
      a.href = canvas.toDataURL("image/png");
      a.click();
    }).catch(function () { card.classList.remove("capturing"); alert("이미지 저장에 실패했습니다."); });
  }
});

/* ══ 장바구니 채점 보고서 (6축) ═══════════════ */
/* 가중치: 급지25 · 장기성과20 · 타이밍15 · 수급10 · 단지15 · 자금15 */
var CART_W = { rank: 25, perf: 20, timing: 15, supply: 10, danji: 15, cash: 15 };

function scoreDanjiAxis(c) {
  var s = 50, notes = [];
  if (c.households != null) {
    if (c.households >= 500) { s += 20; notes.push("세대수 " + fmt(c.households) + " ✓"); }
    else if (c.households < 300) { s -= 10; notes.push("세대수 " + fmt(c.households) + " (소규모)"); }
    else notes.push("세대수 " + fmt(c.households));
    if (c.parkingTotal) {
      var pr = c.parkingTotal / c.households;
      if (pr >= 1.2) s += 15; else if (pr >= 1.0) s += 5; else if (pr < 0.7) s -= 10;
      notes.push("세대당 주차 " + pr.toFixed(2));
    }
  } else notes.push("K-apt 정보 없음 (담기 전 단지정보를 누르면 반영)");
  if (c.buildYear) {
    var age = new Date().getFullYear() - c.buildYear;
    if (age <= 15) s += 15; else if (age >= 30) s += 5;   /* 신축 프리미엄 / 재건축 기대 */
    notes.push(c.buildYear + "년식");
  }
  return { score: clamp(s, 0, 100), note: notes.join(" · ") };
}

function scoreCartItem(c, cond, homePmArr) {
  var axes = {}, notes = {};
  var idx = c.regionKey ? RANKED.indexOf(c.regionKey) : -1;
  if (idx >= 0) {
    var r = scoreRegion(c.regionKey, idx, cond, homePmArr);
    axes.rank = r.s.rank; axes.perf = r.s.perf; axes.supply = r.s.supply; axes.timing = r.s.timing;
    notes.rank = "서열 " + r.rank + "위"; notes.perf = r.cagr != null ? pct(r.cagr, 1) + "/년" : "—";
    notes.timing = r.timingNote;
  } else {
    axes.rank = axes.perf = axes.supply = axes.timing = 50;
    notes.rank = notes.perf = notes.timing = "지역 미상 (코드 직접 입력 조회)";
  }
  var dj = scoreDanjiAxis(c);
  axes.danji = dj.score; notes.danji = dj.note;

  var price = c.pmAvg * cond.area;
  var fin = finance(c.regionKey || "", price, cond);
  axes.cash = (cond.cash > 0 && fin.need > 0) ? clamp(cond.cash / fin.need * 100, 0, 100) : 50;
  notes.cash = "필요현금 " + eok(fin.need) + " (" + fin.tag + ")";

  var wSum = 0, total = 0;
  Object.keys(CART_W).forEach(function (k) { wSum += CART_W[k]; total += axes[k] * CART_W[k]; });
  total /= wSum;
  var grade = total >= 80 ? "A" : (total >= 65 ? "B" : (total >= 50 ? "C" : "D"));
  var weakest = Object.keys(CART_W).sort(function (a, b) { return axes[a] - axes[b]; })[0];
  return { axes: axes, notes: notes, total: total, grade: grade, weakest: weakest, fin: fin, price: price };
}

var AXIS_NAME = { rank: "급지", perf: "장기성과", supply: "수급", timing: "타이밍", danji: "단지", cash: "자금" };

function renderCartReport() {
  var cart = getCart();
  var box = document.getElementById("cart-report");
  if (!cart.length) { box.innerHTML = '<div class="callout warn">담은 단지가 없습니다. 단지 목록에서 먼저 담아주세요.</div>'; return; }
  var cond = getCond();
  var homePmArr = (cond.own !== "none" && cond.home && DB.salePm.series[cond.home])
    ? pmSeries("salePm", cond.home) : null;
  var scored = cart.map(function (c) {
    var s = scoreCartItem(c, cond, homePmArr);
    s.item = c; return s;
  }).sort(function (a, b) { return b.total - a.total; });

  box.innerHTML =
    '<div class="callout">채점 기준 — 급지 25 · 장기성과 20 · 타이밍 15 · 수급 10 · 단지 15 · 자금 15. ' +
      '내 조건: 현금 ' + (cond.cash > 0 ? eok(cond.cash) : "미입력") + " · " + cond.area + "㎡</div>" +
    scored.map(function (s, i) {
      var c = s.item;
      return '<div class="reco' + (i === 0 ? " best" : "") + '">' +
        '<div class="grade ' + s.grade + '">' + s.grade + "</div>" +
        '<div class="body"><div class="name">' + c.apt +
          ' <span style="font-weight:600;color:var(--ink-soft);font-size:.78rem">' +
          (c.regionKey ? disp(c.regionKey) : c.lawd) + " " + c.dong + " · ㎡당 " + fmt(c.pmAvg) + "만원</span></div>" +
        '<div class="chips">' +
          Object.keys(CART_W).map(function (k) {
            return '<span class="chip">' + AXIS_NAME[k] + ' <b>' + s.axes[k].toFixed(0) + "</b>" +
              (s.notes[k] ? " (" + s.notes[k] + ")" : "") + "</span>";
          }).join("") +
        "</div>" +
        '<div class="rowinfo">약한 축: <b>' + AXIS_NAME[s.weakest] + "</b>" +
          (s.weakest === "cash" && cond.cash > 0 && s.fin.need > cond.cash
            ? " — 부족액 " + eok(s.fin.need - cond.cash) + ". 평형을 낮추거나 갭투자 탭에서 전세 낀 매수를 검토하세요."
            : (s.weakest === "danji" && c.households == null
              ? " — K-apt 정보를 불러오면 점수가 정확해집니다."
              : " — 같은 예산이면 이 축이 강한 대안을 추천 탭에서 찾아보세요.")) + "</div>" +
        "</div>" +
        '<div class="money"><div class="score">' + s.total.toFixed(1) + "</div>" +
        '<div class="need">' + eok(s.price) + " · 필요 " + eok(s.fin.need) + "</div></div></div>";
    }).join("");
  document.getElementById("cart-img").style.display = "";
}

/* ══ 4분면 탭 ════════════════════════════════ */
var QD = { months: 12, scope: "metro" };
var chartQuad = null;

function idxChange(key, region, months) {
  var e = latestYM(key);
  var cur = getVal(key, region, e[0], e[1]);
  var t = e[0] * 12 + e[1] - months;
  var prev = getVal(key, region, Math.floor((t - 1) / 12), ((t - 1) % 12) + 1);
  return (cur != null && prev != null && prev !== 0) ? (cur / prev - 1) * 100 : null;
}
function quadPhase(s, j) {
  if (s > 0 && j > 0) return { t: "동반 상승", c: "up" };
  if (s > 0) return { t: "매매 주도", c: "down" };
  if (j > 0) return { t: "전세 주도", c: "flat" };
  return { t: "동반 하락", c: "flat" };
}

function buildQuad(root) {
  root.innerHTML =
    '<div class="card">' +
      '<div class="eyebrow">Quadrant</div><h2>매매 · 전세 4분면</h2>' +

        '<b>전세가 함께 오르는 상승</b>은 실수요가 받치는 국면이고, 매매만 오르면 기대가 앞서 갭이 벌어지는 국면입니다. ' +
        '원이 클수록 ㎡당가가 비쌉니다.</p>' +
      '<div class="grid">' +
        '<div class="field"><label>기간</label><div class="seg" id="qd-months">' +
          '<button data-m="3">3개월</button><button data-m="6">6개월</button>' +
          '<button data-m="12" class="on">12개월</button><button data-m="24">24개월</button></div></div>' +
        '<div class="field"><label>범위</label><div class="seg" id="qd-scope">' +
          '<button data-s="metro" class="on">수도권</button><button data-s="all">전국</button></div></div>' +
      '</div>' +
      '<div class="status" id="qd-kpi" style="margin-top:12px"></div>' +
      '<div class="chartbox" style="height:380px;margin-top:12px"><canvas id="qd-chart"></canvas></div></div>' +
    '<div class="card"><div class="eyebrow">Table</div><h2>지역별 국면</h2>' +
      '<div class="expbar"><button class="btn sm ghost" data-exp="img" data-name="4분면">이미지 저장</button>' +
      '<button class="btn sm ghost" data-exp="xlsx" data-table="qd-table" data-name="4분면">엑셀 저장</button></div>' +

        '매매 주도는 기대가 값에 먼저 실린 상태라 갭이 커지고 하방이 얇아집니다. 전세 주도는 사용가치가 먼저 ' +
        '움직이는 국면으로, 갭이 좁혀져 진입이 쉬워집니다.</div></div>';

      renderQuad();
    });

function renderQuad() {
  if (!DB || !RANKED.length) return;
  var list = RANKED.filter(function (k) { return QD.scope === "all" || METRO[k]; });
  var rows = list.map(function (k) {
    var s = idxChange("sale", ik(k), QD.months);
    var j = idxChange("jeonse", ik(k), QD.months);
    if (s == null || j == null) return null;
    var pmv = lastVal("salePm", k), jv = lastVal("jeonsePm", k);
    return { key: k, s: s, j: j, pm: pmv, jr: (pmv && jv) ? jv / pmv * 100 : null, ph: quadPhase(s, j) };
  }).filter(Boolean);

  var cnt = { "동반 상승": 0, "매매 주도": 0, "전세 주도": 0, "동반 하락": 0 };
  rows.forEach(function (r) { cnt[r.ph.t]++; });
  document.getElementById("qd-kpi").innerHTML =
    statBox("동반 상승", cnt["동반 상승"] + "곳", "up") +
    statBox("매매 주도", cnt["매매 주도"] + "곳", "down") +
    statBox("전세 주도", cnt["전세 주도"] + "곳") +
    statBox("동반 하락", cnt["동반 하락"] + "곳");

  var css = getComputedStyle(document.documentElement);
  var cUp = css.getPropertyValue("--up").trim(), cDown = css.getPropertyValue("--down").trim();
  var pmMax = Math.max.apply(null, rows.map(function (r) { return r.pm; }));
  if (chartQuad) chartQuad.destroy();
  chartQuad = new Chart(document.getElementById("qd-chart"), {
    type: "bubble",
    data: { datasets: [{
      data: rows.map(function (r) { return { x: r.s, y: r.j, r: 4 + Math.sqrt(r.pm / pmMax) * 14 }; }),
      backgroundColor: rows.map(function (r) {
        return r.ph.t === "동반 상승" ? cUp + "b3" : (r.ph.t === "매매 주도" ? cDown + "b3" : "#9aa4b099");
      })
    }]},
    options: {
      responsive: true, maintainAspectRatio: false, animation: false,
      plugins: { legend: { display: false }, tooltip: { callbacks: { label: function (c) {
        var r = rows[c.dataIndex];
        return disp(r.key) + " · 매매 " + pct(r.s) + " · 전세 " + pct(r.j);
      } } } },
      scales: {
        x: { title: { display: true, text: "매매 변화 (%)", font: { size: 10 } }, grid: { color: "#eef1f5" }, ticks: { font: { size: 10 } } },
        y: { title: { display: true, text: "전세 변화 (%)", font: { size: 10 } }, grid: { color: "#eef1f5" }, ticks: { font: { size: 10 } } }
      }
    },
    plugins: [{
      id: "axes0",
      beforeDatasetsDraw: function (ch) {
        var a = ch.chartArea, x0 = ch.scales.x.getPixelForValue(0), y0 = ch.scales.y.getPixelForValue(0);
        var ctx = ch.ctx;
        ctx.save(); ctx.strokeStyle = "#c9d0d9"; ctx.lineWidth = 1;
        if (x0 >= a.left && x0 <= a.right) { ctx.beginPath(); ctx.moveTo(x0, a.top); ctx.lineTo(x0, a.bottom); ctx.stroke(); }
        if (y0 >= a.top && y0 <= a.bottom) { ctx.beginPath(); ctx.moveTo(a.left, y0); ctx.lineTo(a.right, y0); ctx.stroke(); }
        ctx.restore();
      }
    }]
  });

  var tb = document.querySelector("#qd-table tbody");
  tb.innerHTML = rows.slice().sort(function (a, b) { return b.s - a.s; }).map(function (r) {
    return "<tr><td>" + (isRegulated(r.key) ? "⛔ " : "") + disp(r.key) + "</td>" +
      '<td class="' + cls(r.s) + '">' + pct(r.s) + "</td>" +
      '<td class="' + cls(r.j) + '">' + pct(r.j) + "</td>" +
      '<td class="' + r.ph.c + '">' + r.ph.t + "</td>" +
      "<td>" + fmt(r.pm) + "</td>" +
      "<td>" + (r.jr != null ? r.jr.toFixed(1) + "%" : "—") + "</td></tr>";
  }).join("");
}

/* ══ 순환매 탭 ═══════════════════════════════ */
var RT = { base: "", cvMax: 8 };

function buildRota(root) {
  root.innerHTML =
    '<div class="card">' +
      '<div class="eyebrow">Rotation</div><h2>순환매 후보</h2>' +
      '<p class="desc">한 문장으로: <b>"평소 같이 움직이던 두 동네인데, 지금 한쪽만 튀었다면 나머지 한쪽에 ' +
        '여지가 있지 않을까?"</b>를 데이터로 찾습니다. 기준 지역(많이 오른 곳)을 고르면, 10년간 배율이 ' +
        '안정적이던(변동계수 낮음) 짝 중에 지금 뒤처진 곳을 보여줍니다.</p>' +
      '<div class="grid">' +
        '<div class="field"><label for="rt-base">기준 지역 (많이 오른 곳)</label><select id="rt-base"></select></div>' +
        '<div class="field"><label>동행성 기준 (변동계수)</label><div class="seg" id="rt-cv">' +
          '<button data-c="5">엄격 5%</button><button data-c="8" class="on">보통 8%</button>' +
          '<button data-c="12">느슨 12%</button></div></div>' +
      '</div>' +
      '<div class="status" id="rt-kpi" style="margin-top:12px"></div>' +
    '</div>' +
    '<div class="card"><div class="eyebrow">Pairs</div><h2>뒤처진 짝 (밴드 낮은 순)</h2>' +
      '<div class="expbar"><button class="btn sm ghost" data-exp="img" data-name="순환매">이미지 저장</button>' +
      '<button class="btn sm ghost" data-exp="xlsx" data-table="rt-table" data-name="순환매">엑셀 저장</button></div>' +
      '<div class="tblwrap"><table id="rt-table"><thead><tr>' +
      '<th>짝 지역</th><th>㎡당가</th><th>현재 배율</th><th>10년 평균</th><th>변동계수</th><th>밴드</th><th>회귀 여력</th><th>3년 상승률 차</th>' +
      '</tr></thead><tbody></tbody></table></div>' +
      '<div class="note"><b>읽는 법</b> — 배율이 1이면 두 지역 가격이 똑같다는 뜻이고, 중요한 건 절대값이 아니라 ' +
        '<b>안정성</b>입니다. 변동계수가 작을수록 "같이 가던 동네"입니다. 밴드 0%는 상대 지역이 역대 가장 뒤처진 ' +
        '상태, 회귀 여력은 배율이 10년 평균으로만 돌아가도 몇 % 오를 여지가 있는지 — 목표가 아니라 <b>가설</b>입니다.</div>' +
      '<div class="note"><b>가장 큰 한계</b> — 격차가 신규 노선·재건축·일자리 유입 때문에 벌어졌다면 그건 ' +
        '새 균형이지 이상현상이 아닙니다. 이 표는 후보를 좁히는 용도로만 쓰고, 반드시 "최근 3년 사이 저쪽에 ' +
        '무슨 일이 있었나"를 직접 확인하세요. 호재가 있으면 후보에서 빼야 합니다.</div></div>';

  root.querySelector("#rt-base").addEventListener("change", function () { RT.base = this.value; renderRota(); });
  root.querySelectorAll("#rt-cv button").forEach(function (b) {
    b.addEventListener("click", function () {
      RT.cvMax = Number(b.dataset.c);
      root.querySelectorAll("#rt-cv button").forEach(function (x) { x.classList.toggle("on", x === b); });
      renderRota();
    });
  });
}

function renderRota() {
  if (!DB || !RANKED.length) return;
  var sel = document.getElementById("rt-base");
  if (!sel.options.length) {
    RANKED.forEach(function (k) {
      var o = document.createElement("option");
      o.value = k; o.textContent = disp(k);
      sel.appendChild(o);
    });
    RT.base = RANKED[0];
  }
  if (RT.base) sel.value = RT.base; else RT.base = sel.value;

  var baseArr = pmSeries("salePm", RT.base);
  var base3y = idxChange("sale", ik(RT.base), 36);
  var out = [];
  RANKED.forEach(function (k) {
    if (k === RT.base) return;
    var mult = ratioSeries(pmSeries("salePm", k), baseArr, 1);
    var tail = mult.slice(-120).filter(function (v) { return v != null; });
    if (tail.length < 60) return;   /* 5년 미만 짝은 제외 */
    var cur = null;
    for (var i = mult.length - 1; i >= 0; i--) if (mult[i] != null) { cur = mult[i]; break; }
    var mean = tail.reduce(function (a, b) { return a + b; }, 0) / tail.length;
    var sd = Math.sqrt(tail.reduce(function (a, b) { return a + (b - mean) * (b - mean); }, 0) / tail.length);
    var cv = sd / mean * 100;
    if (cv > RT.cvMax) return;
    var sorted = tail.slice().sort(function (a, b) { return a - b; });
    var band = sorted.filter(function (v) { return v <= cur; }).length / sorted.length * 100;
    var room = (mean / cur - 1) * 100;
    var p3 = idxChange("sale", ik(k), 36);
    out.push({ key: k, pm: lastVal("salePm", k), cur: cur, mean: mean, cv: cv, band: band,
               room: room, d3: (p3 != null && base3y != null) ? p3 - base3y : null });
  });
  out.sort(function (a, b) { return a.band - b.band; });

  document.getElementById("rt-kpi").innerHTML =
    statBox("동행 짝", out.length + "곳") +
    statBox("밴드 10% 이하", out.filter(function (r) { return r.band <= 10; }).length + "곳", "up") +
    statBox("기준 3년 상승", base3y != null ? pct(base3y, 1) : "—", cls(base3y)) +
    statBox("기준 ㎡당가", fmt(lastVal("salePm", RT.base)) + "만원");

  var tb = document.querySelector("#rt-table tbody");
  tb.innerHTML = out.map(function (r) {
    return '<tr class="' + (r.band <= 10 ? "hit" : "") + '"><td>' + (isRegulated(r.key) ? "⛔ " : "") + disp(r.key) + "</td>" +
      "<td>" + fmt(r.pm) + "</td>" +
      "<td>" + r.cur.toFixed(3) + "</td>" +
      "<td>" + r.mean.toFixed(3) + "</td>" +
      "<td>" + r.cv.toFixed(1) + "%</td>" +
      "<td>" + r.band.toFixed(0) + "%</td>" +
      '<td class="' + cls(r.room) + '">' + pct(r.room, 1) + "</td>" +
      '<td class="' + cls(r.d3) + '">' + (r.d3 != null ? pct(r.d3, 1) + "p" : "—") + "</td></tr>";
  }).join("") || '<tr><td colspan="8" style="color:var(--miss)">이 기준을 만족하는 짝이 없습니다. 변동계수를 느슨하게 바꿔보세요.</td></tr>';
}

/* ══ 평형대·월별 중위 공용 헬퍼 ═══════════════ */
var BANDS = { 36: [20, 45], 46: [45, 55], 59: [55, 70], 84: [70, 95], 101: [95, 120] };
function bandLabel2(b) { return b + "㎡대 (" + BANDS[b][0] + "~" + BANDS[b][1] + ")"; }
function inBand(area, b) { return area >= BANDS[b][0] && area < BANDS[b][1]; }

/* (lawd → 월별 매매·전세) 메모리 캐시 — 대장·비교 탭 공용 */
var TRADE_CACHE = {};
function fetchMonths(lawd, nMonths, onTick) {
  var key = lawd + ":" + nMonths;
  if (TRADE_CACHE[key]) return Promise.resolve(TRADE_CACHE[key]);
  var months = ymList(nMonths).reverse();
  var saleP = Promise.all(months.map(function (ym) {
    return fetch("/api/trades?kind=sale&lawd=" + lawd + "&ym=" + ym)
      .then(function (r) { return r.json(); })
      .then(function (j) {
        if (onTick) onTick();
        if (j.error) throw new Error(j.error + (j.msg ? " · " + j.msg : ""));
        return { ym: ym, deals: (j.items || []).filter(function (t) { return !t.canceled && t.amount > 0 && t.area > 0; }) };
      });
  }));
  var rentP = Promise.all(months.map(function (ym) {
    return fetch("/api/trades?kind=rent&lawd=" + lawd + "&ym=" + ym)
      .then(function (r) { return r.json(); })
      .then(function (j) { if (onTick) onTick(); return { ym: ym, deals: j.error ? [] : (j.items || []).filter(function (t) { return t.jeonse && t.deposit > 0 && t.area > 0; }) }; })
      .catch(function () { if (onTick) onTick(); return { ym: ym, deals: [] }; });
  }));
  return Promise.all([saleP, rentP]).then(function (both) {
    var out = { months: months, sale: both[0], rent: both[1] };
    TRADE_CACHE[key] = out;
    return out;
  });
}
/* 단지·평형대 기준 월별 중위 시계열 */
function monthlyMedian(monthsData, apt, dong, band, field) {
  return monthsData.map(function (m) {
    var vals = m.deals.filter(function (t) {
      return t.apt === apt && t.dong === dong && inBand(t.area, band);
    }).map(function (t) { return t[field]; });
    return median(vals);
  });
}

function loadFlag() {
  var regions = FG.scope === "one"
    ? [document.getElementById("fg-region").value]
    : RANKED.filter(function (k) { return LAWD[k]; }).slice(0, FG.scope);
  var btn = document.getElementById("fg-go");
  btn.disabled = true;
  var total = regions.length * 12, done = 0;
  function tick() { done++; btn.textContent = "불러오는 중… (" + done + "/" + total + ")"; }
  tick(); done = 0; btn.textContent = "불러오는 중… (0/" + total + ")";

  /* 지역 순차 처리 (API 부하 완화) */
  var results = [];
  var chain = Promise.resolve();
  regions.forEach(function (rk) {
    chain = chain.then(function () {
      return fetchMonths(LAWD[rk], 6, tick).then(function (data) {
        var byApt = {};
        data.sale.forEach(function (m) {
          m.deals.forEach(function (t) {
            if (!inBand(t.area, FG.band)) return;
            var id = t.dong + "|" + t.apt;
            (byApt[id] = byApt[id] || { apt: t.apt, dong: t.dong, amounts: [], areas: [], buildYear: t.buildYear }).amounts.push(t.amount);
            byApt[id].areas.push(t.area);
          });
        });
        var apts = Object.keys(byApt).map(function (id) {
          var g = byApt[id];
          if (g.amounts.length < 2) return null;
          g.med = median(g.amounts);
          g.max = Math.max.apply(null, g.amounts);
          g.areaMed = median(g.areas);
          g.py = g.med / g.areaMed * 3.3058;
          var jv = [];
          data.rent.forEach(function (m) {
            m.deals.forEach(function (t) {
              if (t.apt === g.apt && t.dong === g.dong && inBand(t.area, FG.band)) jv.push(t.deposit);
            });
          });
          g.jeonse = median(jv);
          g.jr = (g.jeonse && g.med) ? g.jeonse / g.med * 100 : null;
          g.gap = g.jeonse != null ? g.med - g.jeonse : null;
          g.cnt = g.amounts.length;
          return g;
        }).filter(Boolean).sort(function (a, b) { return b.py - a.py; }).slice(0, 3);
        results.push({ region: rk, apts: apts });
      });
    });
  });
  chain.then(function () {

    btn.disabled = false; btn.textContent = "대장 아파트 불러오기";
  });
}

function cmpSeries(s) {
  var p = s.apt.split("|");
  var saleArr = monthlyMedian(s.data.sale, p[1], p[0], s.band, "amount");
  var rentArr = monthlyMedian(s.data.rent, p[1], p[0], s.band, "deposit");
  return { name: disp(s.region) + " " + p[1] + " " + s.band + "㎡대", sale: saleArr, rent: rentArr,
           labels: s.data.months.map(function (ym) { return ym.slice(0, 4) + "." + Number(ym.slice(4)); }) };
}

function renderCmpx() {
  var active = CMP.slots.filter(function (s) { return s.data && s.apt; });
  if (active.length < 2) return;
  var series = active.map(cmpSeries);
  var labels = series[0].labels;

  /* 비교 표 + 해석 */
  var tb = document.querySelector("#cx-table tbody");
  var reads = [];
  tb.innerHTML = series.map(function (sr, i) {
    var vals = sr.sale.filter(function (v) { return v != null; });
    var first3 = median(sr.sale.slice(0, 6).filter(function (v) { return v != null; }));
    var last3 = median(sr.sale.slice(-6).filter(function (v) { return v != null; }));
    var rise = (first3 && last3) ? (last3 / first3 - 1) * 100 : null;
    var je = median(sr.rent.slice(-6).filter(function (v) { return v != null; }));
    var gap = (last3 != null && je != null) ? last3 - je : null;
    var slot = active[i];
    var py = last3 != null ? last3 / median(slot.apts.filter(function (g) { return g.id === slot.apt; })[0].areas) * 3.3058 : null;
    if (rise != null) reads.push("<b>" + sr.name + "</b>은 기간 상승률 " + pct(rise, 1) + (gap != null ? ", 현재 갭 " + eok(gap) : "") + "입니다.");
    return '<tr><td><span style="color:' + CMP_COLORS[i] + '">●</span> ' + sr.name + "</td>" +
      "<td>" + (py != null ? fmt(py) : "—") + "</td>" +
      "<td><b>" + (last3 != null ? eok(last3) : "—") + "</b></td>" +
      "<td>" + (je != null ? eok(je) : "—") + "</td>" +
      "<td>" + (gap != null ? eok(gap) : "—") + "</td>" +
      '<td class="' + cls(rise) + '">' + (rise != null ? pct(rise, 1) : "—") + "</td>" +
      "<td>" + vals.length + "개월</td></tr>";
  }).join("");
  document.getElementById("cx-resultcard").style.display = "";
  document.getElementById("cx-read").innerHTML = reads.join("<br>");

  /* 매매가 추이 */
  document.getElementById("cx-pricecard").style.display = "";
  if (chartCmpPrice) chartCmpPrice.destroy();
  chartCmpPrice = new Chart(document.getElementById("cx-price"), {
    type: "line",
    data: { labels: labels, datasets: series.map(function (sr, i) {
      return { label: sr.name, data: sr.sale, borderColor: CMP_COLORS[i], borderWidth: 2,
               pointRadius: 2, spanGaps: true, tension: .15 };
    })},
    options: chartOpts("만")
  });

  /* 배율 A÷B */
  var a = series[0], b = series[1];
  var mult = a.sale.map(function (v, i) {
    return (v != null && b.sale[i] != null && b.sale[i] !== 0) ? v / b.sale[i] : null;
  });
  var mVals = mult.filter(function (v) { return v != null; });
  if (mVals.length >= 6) {
    var cur = mVals[mVals.length - 1];
    var mean = mVals.reduce(function (x, y) { return x + y; }, 0) / mVals.length;
    var sorted = mVals.slice().sort(function (x, y) { return x - y; });
    var band = sorted.filter(function (v) { return v <= cur; }).length / sorted.length * 100;
    document.getElementById("cx-multkpi").innerHTML =
      statBox("현재 배율 (A÷B)", cur.toFixed(3)) +
      statBox("기간 평균", mean.toFixed(3)) +
      statBox("밴드 위치", band.toFixed(0) + "%", band <= 30 ? "up" : (band >= 70 ? "down" : "")) +
      statBox("평균 회귀 시 A", cur !== 0 ? pct((mean / cur - 1) * 100, 1) : "—");
    document.getElementById("cx-multcard").style.display = "";
    if (chartCmpMult) chartCmpMult.destroy();
    chartCmpMult = new Chart(document.getElementById("cx-mult"), {
      type: "line",
      data: { labels: labels, datasets: [{ label: "배율 (A÷B)", data: mult, borderColor: CMP_COLORS[0],
        borderWidth: 2, pointRadius: 2, spanGaps: true, tension: .15 }] },
      options: chartOpts("x"),
      plugins: [{
        id: "meanline",
        beforeDatasetsDraw: function (ch) {
          var y = ch.scales.y.getPixelForValue(mean), ar = ch.chartArea, ctx = ch.ctx;
          if (y < ar.top || y > ar.bottom) return;
          ctx.save(); ctx.strokeStyle = "#c47f17"; ctx.setLineDash([5, 4]); ctx.lineWidth = 1;
          ctx.beginPath(); ctx.moveTo(ar.left, y); ctx.lineTo(ar.right, y); ctx.stroke(); ctx.restore();
        }
      }]
    });
  } else {
    document.getElementById("cx-multcard").style.display = "none";
  }

  /* 갭 추이 */
  document.getElementById("cx-gapcard").style.display = "";
  if (chartCmpGap) chartCmpGap.destroy();
  chartCmpGap = new Chart(document.getElementById("cx-gap"), {
    type: "line",
    data: { labels: labels, datasets: series.map(function (sr, i) {
      var gap = sr.sale.map(function (v, t) {
        return (v != null && sr.rent[t] != null) ? v - sr.rent[t] : null;
      });
      return { label: sr.name + " 갭", data: gap, borderColor: CMP_COLORS[i], borderWidth: 1.5,
               borderDash: [4, 3], pointRadius: 2, spanGaps: true, tension: .15 };
    })},
    options: chartOpts("만")
  });
}

/* 내 현금으로 최대 매수가 역산 (이분 탐색) */
function maxPriceForCash(cond, flags) {
  if (cond.cash <= 0) return null;
  var lo = 0, hi = 2000000;   /* 최대 200억 */
  for (var i = 0; i < 40; i++) {
    var mid = (lo + hi) / 2;
    if (finance("", mid, cond, flags).need <= cond.cash) lo = mid; else hi = mid;
  }
  return lo;
}

function renderCalc() {
  if (!DB) return;
  var cond = getCond();
  var flags = { reg: CALC.reg, metro: CALC.metro };
  var f = finance("", CALC.price, cond, flags);
  var maxP = maxPriceForCash(cond, flags);

  document.getElementById("cl-kpi").innerHTML =
    statBox("총 필요현금", eok(f.need), (cond.cash > 0 && f.need <= cond.cash) ? "up" : "down") +
    statBox("대출 가능액", f.loan > 0 ? eok(f.loan) + " (" + f.tag + ")" : "대출불가") +
    statBox("취득세 등", eok(f.acq)) +
    statBox("내 현금으로 최대", maxP != null ? eok(maxP) : "현금 미입력");

  var rows = [
    ["매수가", eok(f.price), ""],
    ["− 대출 가능액", f.loan > 0 ? "−" + eok(f.loan) : "0", f.tag],
    ["= 자기자금", eok(f.price - f.loan), ""],
    ["+ 취득세·교육세 등", "+" + eok(f.acq), ""],
    ["+ 중개보수", "+" + eok(f.broker), RULES.broker + "%"],
    ["+ 등기·이사·기타", "+" + eok(f.etc), ""],
    ["총 필요현금", eok(f.need), cond.cash > 0 ? (f.need <= cond.cash ? "가능" : "부족 " + eok(f.need - cond.cash)) : ""]
  ];
  document.querySelector("#cl-break tbody").innerHTML = rows.map(function (r, i) {
    return '<tr' + (i === rows.length - 1 ? ' class="hit"' : "") + "><td>" + r[0] + "</td><td><b>" + r[1] + "</b></td><td>" + r[2] + "</td></tr>";
  }).join("");

  var prices = [50000, 90000, 120000, RULES.capT1Lim, RULES.capT1Lim + 1, 200000, RULES.capT2Lim, RULES.capT2Lim + 1, 300000];
  document.querySelector("#cl-table tbody").innerHTML = prices.map(function (p) {
    var x = finance("", p, cond, flags);
    var ok = cond.cash > 0 && x.need <= cond.cash;
    return '<tr class="' + (ok ? "hit" : "") + '"><td>' + eok(p) + "</td>" +
      "<td>" + (x.loan > 0 ? eok(x.loan) : "—") + "</td>" +
      "<td>" + x.tag + "</td>" +
      "<td>" + eok(x.acq) + "</td>" +
      "<td>" + eok(x.broker) + "</td>" +
      "<td><b>" + eok(x.need) + "</b></td>" +
      '<td class="' + (ok ? "up" : "down") + '">' + (cond.cash > 0 ? (ok ? "가능" : "부족") : "—") + "</td></tr>";
  }).join("");
}

/* ══ 기준·설정 탭 ═════════════════════════════ */
function loadRules() {
  var raw = null;
  try { raw = localStorage.getItem(LS_RULES); } catch (e) {}
  if (!raw) return;
  try {
    var r = JSON.parse(raw);
    Object.keys(DEFAULT_RULES).forEach(function (k) { if (r[k] != null) RULES[k] = r[k]; });
  } catch (e) {}
}
function saveRules() { try { localStorage.setItem(LS_RULES, JSON.stringify(RULES)); } catch (e) {} }

  });
  document.getElementById("r-reset").addEventListener("click", function () {
