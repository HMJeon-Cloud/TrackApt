/* ── 공공 API 호출 관리 ──
   공공데이터포털은 초당 요청 수 제한이 있어 동시 호출을 3개로 묶고,
   일시 오류(502/429/트래픽 초과)는 간격을 늘려가며 두 번까지 재시도한다. */
var API_CONC = 3, apiActive = 0, apiQueue = [];
function apiSlot() {
  return new Promise(function (res) {
    if (apiActive < API_CONC) { apiActive++; res(); }
    else apiQueue.push(res);
  });
}
function apiRelease() {
  apiActive--;
  if (apiQueue.length && apiActive < API_CONC) { apiActive++; apiQueue.shift()(); }
}
function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
function isBusyErr(j, status) {
  if (status === 502 || status === 429 || status === 503) return true;
  var e = j && (j.error || "") + " " + (j.msg || "") + " " + (j.detail || "");
  return /제한|초과|LIMIT|BUSY|TRAFFIC|일시/i.test(e);
}
/* 재시도 포함 JSON 호출 */
/* 응답이 영영 안 오면 큐(동시 3개)가 막혀 이후 조회가 전부 멈춘다.
   AbortController로 끊어 재시도·오류로 흘려보낸다. */
function fetchTimeout(url, ms) {
  if (typeof AbortController === "undefined") return fetch(url);
  var ac = new AbortController();
  var t = setTimeout(function () { ac.abort(); }, ms);
  return fetch(url, { signal: ac.signal }).then(
    function (r) { clearTimeout(t); return r; },
    function (e) { clearTimeout(t); throw (e && e.name === "AbortError" ? new Error("응답 시간 초과") : e); });
}
function apiGet(url) {
  return apiSlot().then(function () {
    function attempt(tryNo) {
      var st = 0;
      return fetchTimeout(url, 20000)
        .then(function (r) { st = r.status; return r.json().catch(function () { return { error: "응답 형식 오류" }; }); })
        .then(function (j) {
          if (isBusyErr(j, st) && tryNo < 2) {
            return sleep(500 * (tryNo + 1) + Math.random() * 300).then(function () { return attempt(tryNo + 1); });
          }
          return j;
        })
        .catch(function (e) {
          if (tryNo < 2) return sleep(500 * (tryNo + 1)).then(function () { return attempt(tryNo + 1); });
          return { error: /초과/.test(String(e && e.message)) ? "응답 시간 초과" : "네트워크 오류",
                   detail: String(e) };
        });
    }
    return attempt(0);
  }).then(function (j) { apiRelease(); return j; },
          function (e) { apiRelease(); throw e; });
}

/* "41590:41594" 형태의 복합 코드 → 후보 배열 */
function lawdCandidates(code) { return String(code).split(":"); }
/* (kind|lawd|ym) → 응답 메모. 지난 달 실거래는 사실상 확정치라 세션 내 재사용해도 안전 */
var TRADE_MEMO = {};

/* ── 화성시 분구(2026.2) — v4.4에서 확정 코드 직접 조회로 전환 ──
   실거래 API는 과거 거래도 현재 구 코드로 돌려준다(2010.01~2026.06 전수 수집으로 확인:
   41590은 198개월 내내 0건, 4개 구 코드가 전 구간 보유). 따라서 병합·재조회가 불필요하다.
   K-apt(단지 목록)는 별개 API라 이관 여부가 확인되지 않아 옛 코드를 함께 조회한다. */
var HWA = { old: "41590", news: ["41591", "41593", "41595", "41597"] };
function tradeUrl(kind, lawd, ym) {
  return "/api/trades?kind=" + kind + "&lawd=" + lawd + "&ym=" + ym;
}
/* 여러 코드 응답을 하나로 합치고 중복 신고 제거 */
function mergeTradeResults(results) {
  var seen = {}, items = [], firstErr = null, anyOk = false;
  results.forEach(function (j) {
    if (!j) return;
    if (j.error) { if (!firstErr) firstErr = j; return; }
    anyOk = true;
    (j.items || []).forEach(function (t) {
      var key = [t.ym, t.day, t.apt, t.dong, t.floor, t.amount || t.deposit, t.area].join("|");
      if (seen[key]) return;
      seen[key] = 1;
      items.push(t);
    });
  });
  if (!anyOk && firstErr) return firstErr;
  return { items: items };
}
var LAWD_RESOLVED = {};
function fetchTrade(code, kind, ym, guName) {
  var memoKey = kind + "|" + code + "|" + ym;
  if (TRADE_MEMO[memoKey]) return Promise.resolve(TRADE_MEMO[memoKey]);
  function memo(j) { if (j && !j.error) TRADE_MEMO[memoKey] = j; return j; }
  if (LAWD_RESOLVED[code]) {
    return apiGet("/api/trades?kind=" + kind + "&lawd=" + LAWD_RESOLVED[code] + "&ym=" + ym).then(memo);
  }
  var cands = lawdCandidates(code);
  if (cands.length === 1) return apiGet("/api/trades?kind=" + kind + "&lawd=" + cands[0] + "&ym=" + ym).then(memo);
  var last = null;
  function attempt(i) {
    if (i >= cands.length) return Promise.resolve(last || { items: [] });
    return apiGet("/api/trades?kind=" + kind + "&lawd=" + cands[i] + "&ym=" + ym)
      .then(function (j) {
        if (j.error) { last = j; return attempt(i + 1); }
        if ((j.items || []).length) { LAWD_RESOLVED[code] = cands[i]; return memo(j); }
        last = j;
        return attempt(i + 1);
      });
  }
  return attempt(0);
}

function ymList(n) {
  var now = new Date();
  var y = now.getFullYear(), m = now.getMonth() + 1;
  var out = [];
  for (var i = 0; i < n; i++) { out.push(String(y * 100 + m)); m--; if (m === 0) { m = 12; y--; } }
  return out;
}

function loadDanji() {
  var lawd = document.getElementById("dj-region").value;
  if (!lawd) { alert("지역을 선택하세요."); return; }
  DJ.lawd = lawd;
  var optText = document.getElementById("dj-region").selectedOptions[0].textContent
    .replace(/^★\s*/, "").replace(/\s*\(내 지역\)$/, "").trim();
  DJ.subFilter = subFilterOf(optText);
  DJ.regionName = optText;          /* 예: "화성 동탄구" — 코드 판별에 사용 */
  DJ.regionKey = kbKeyOfLawd(lawd);
  DJ.months = Number(document.getElementById("dj-months").value);
  DJ.kaptList = null; DJ.kaptMiss = 0;
  var btn = document.getElementById("dj-go");
  btn.disabled = true;
  var total = DJ.months * 2, done = 0;
  function tick() { done++; btn.textContent = "실거래 조회… (" + done + "/" + total + ")"; }
  btn.textContent = "실거래 조회… (0/" + total + ")";
  var months = ymList(DJ.months);
  /* 화면에 "언제 자료인지"를 명시한다 — 최근 N개월만 고를 수 있어 기간이 안 보이면 혼동된다 */
  DJ.ymTo = months[0]; DJ.ymFrom = months[months.length - 1];

  var guName = DJ.regionName;
  var saleP = Promise.all(months.map(function (ym) {
    return fetchTrade(lawd, "sale", ym, guName).then(function (j) {
      tick();
      if (j.error) throw new Error(j.error + (j.msg ? " · " + j.msg : ""));
      return j.items || [];
    });
  }));
  var rentP = Promise.all(months.map(function (ym) {
    return fetchTrade(lawd, "rent", ym, guName).then(function (j) { tick(); return j.items || []; })
      .catch(function () { tick(); return []; });
  }));

  Promise.all([saleP, rentP]).then(function (both) {
    var rentAll = [].concat.apply([], both[1]).filter(function (t) { return t.jeonse && t.deposit > 0 && t.area > 0; });
    /* v4.4부터 모든 구는 자기 코드로 조회하므로 법정동 필터는 SUB_DISTRICT가 비어 있는 한 no-op */
    var useFilter = DJ.subFilter;
    var all = [].concat.apply([], both[0]).filter(function (t) {
      return !t.canceled && t.amount > 0 && t.area > 0 && inSubDistrict(t.dong, useFilter);
    });
    rentAll = rentAll.filter(function (t) { return inSubDistrict(t.dong, useFilter); });
    DJ.saleCount = all.length; DJ.rentCount = rentAll.length;
    var byApt = {};
    all.forEach(function (t) {
      var id = t.dong + "|" + t.apt;
      var g = byApt[id] || (byApt[id] = { id: id, apt: t.apt, dong: t.dong, deals: [], buildYear: t.buildYear });
      g.deals.push(t);
      if (t.buildYear && !g.buildYear) g.buildYear = t.buildYear;
    });
    /* 전세를 (동|단지) 인덱스로 미리 묶는다 — 단지 96 × 전세 1,200건 반복 검색 제거 */
    var rentIdx = {};
    rentAll.forEach(function (t) {
      var id = t.dong + "|" + t.apt;
      (rentIdx[id] = rentIdx[id] || []).push(t);
    });
    DJ.rows = Object.keys(byApt).map(function (id) {
      var g = byApt[id];
      g.cnt = g.deals.length;
      g.last = g.deals.slice().sort(function (a, b) { return (b.ym * 100 + b.day) - (a.ym * 100 + a.day); })[0];
      g.rentDeals = rentIdx[id] || [];
      return g;
    });
    /* 실거래가 도착했으면 표부터 즉시 보여준다 */
    updateDanjiMeta();
    renderDanjiTable();
    btn.disabled = false; btn.textContent = "단지 불러오기";
    /* K-apt 단지정보는 백그라운드에서 붙이고, 붙는 대로 표를 갱신한다 */
    attachKapt();
  }).catch(function (e) {
    alert("조회 실패: " + e.message);
    btn.disabled = false; btn.textContent = "단지 불러오기";
  });
}

function ymDot(ym) { return ym ? String(ym).slice(0, 4) + "." + String(ym).slice(4) : ""; }
function updateDanjiMeta(suffix) {
  var meta = "";
  if (DJ.ymFrom) meta += ymDot(DJ.ymFrom) + "~" + ymDot(DJ.ymTo) + " · ";
  meta += DJ.rows.length + "단지 · 매매 " + fmt(DJ.saleCount) + "건 · 전세 " + fmt(DJ.rentCount) + "건";
  if (DJ.subFilter) meta += " · 해당 구 법정동만 추림";
  if (DJ.kaptList !== null) {
    if (!DJ.kaptList.length) meta += " · K-apt 목록 없음";
    else if (DJ.kaptMiss) meta += " · 단지정보 미매칭 " + DJ.kaptMiss + "곳";
  }
  document.getElementById("dj-meta").textContent = meta + (suffix || "");
}

/* K-apt 목록 1회 + 평당가 상위 단지 상세를 병렬로 부착 (도착하는 대로 표 갱신) */
var KAPT_INFO_MEMO = {};
var KAPT_LIST_MEMO = {};
/* K-apt 단지 목록 — 화성(41590)은 옛+신설 코드를 합쳐서 */
function fetchKaptList(lawd) {
  if (KAPT_LIST_MEMO[lawd]) return Promise.resolve(KAPT_LIST_MEMO[lawd]);
  var codes = [lawd];
  /* K-apt는 이관 여부가 확인되지 않아, 화성 계열이면 옛 코드를 함께 조회해 합친다 */
  if (lawd === HWA.old) codes = [HWA.old].concat(HWA.news);
  else if (HWA.news.indexOf(lawd) >= 0) codes = [lawd, HWA.old];
  return Promise.all(codes.map(function (c) {
    return apiGet("/api/apt?kind=list&lawd=" + c)
      .then(function (j) { return j.error ? [] : (j.items || []); })
      .catch(function () { return []; });
  })).then(function (lists) {
    var seen = {}, out = [];
    lists.forEach(function (arr) {
      arr.forEach(function (it) {
        if (seen[it.kaptCode]) return;
        seen[it.kaptCode] = 1;
        out.push(it);
      });
    });
    KAPT_LIST_MEMO[lawd] = out;
    return out;
  });
}
function attachKapt() {
  var band = Number(document.getElementById("dj-band").value) || 0;
  var myLoad = DJ.loadSeq = (DJ.loadSeq || 0) + 1;   /* 새 조회가 시작되면 이전 부착은 버림 */
  var pre = DJ.rows.map(function (g) {
    var deals = band ? g.deals.filter(function (t) { return inBand(t.area, band); }) : g.deals;
    var pmv = deals.length ? median(deals.map(function (t) { return t.amount / t.area; })) : 0;
    return { g: g, pm: pmv };
  }).filter(function (x) { return x.pm > 0; })
    .sort(function (a, b) { return b.pm - a.pm; }).slice(0, 40);

  return fetchKaptList(lawdCandidates(DJ.lawd)[0])
    .then(function (list) { DJ.kaptList = list; })
    .catch(function () { DJ.kaptList = []; })
    .then(function () {
      if (DJ.loadSeq !== myLoad) return;
      if (!DJ.kaptList.length) { updateDanjiMeta(); return; }
      var done = 0, dirty = false;
      updateDanjiMeta(" · 단지정보 붙이는 중 0/" + pre.length);
      var jobs = pre.map(function (x) {
        var hit = matchKapt(DJ.kaptList, x.g.apt, x.g.dong);
        if (!hit) { DJ.kaptMiss = (DJ.kaptMiss || 0) + 1; done++; return Promise.resolve(); }
        if (KAPT_INFO_MEMO[hit.kaptCode]) {           /* 같은 단지는 재조회 없이 */
          x.g.kapt = KAPT_INFO_MEMO[hit.kaptCode]; done++; dirty = true;
          return Promise.resolve();
        }
        return apiGet("/api/apt?kind=info&kapt=" + hit.kaptCode)
          .then(function (j2) {
            done++;
            if (!j2.error && j2.info) { x.g.kapt = j2.info; KAPT_INFO_MEMO[hit.kaptCode] = j2.info; dirty = true; }
          })
          .catch(function () { done++; });
      });
      /* 0.5초마다 진행 표시 + 도착분 반영 (전 항목 재렌더 대신 배치 갱신) */
      var timer = setInterval(function () {
        if (DJ.loadSeq !== myLoad) { clearInterval(timer); return; }
        updateDanjiMeta(" · 단지정보 붙이는 중 " + done + "/" + pre.length);
        if (dirty) { dirty = false; renderDanjiTable(); }
      }, 500);
      return Promise.all(jobs).then(function () {
        clearInterval(timer);
        if (DJ.loadSeq !== myLoad) return;
        updateDanjiMeta();
        renderDanjiTable();
      });
    });
}

/* 실거래 표기와 K-apt 표기의 차이를 흡수 (예: 향촌롯데 ↔ 향촌마을롯데) */
function normName(s) {
  return String(s)
    .replace(/[\s()\[\]·,.\-]/g, "")
    .replace(/아파트|주공아파트|마을|타운하우스|단지$/g, "")
    .toLowerCase();
}
/* 두 이름의 유사도 (0~1) — 문자 집합 겹침 + 접두 일치 가산 */
function nameScore(a, b) {
  if (!a || !b) return 0;
  if (a === b) return 1;
  if (a.indexOf(b) >= 0 || b.indexOf(a) >= 0) return 0.95;
  var setA = {}, common = 0;
  for (var i = 0; i < a.length; i++) setA[a[i]] = (setA[a[i]] || 0) + 1;
  for (var j = 0; j < b.length; j++) if (setA[b[j]] > 0) { setA[b[j]]--; common++; }
  var jac = common / Math.max(a.length, b.length);
  var pre = 0;
  while (pre < Math.min(a.length, b.length) && a[pre] === b[pre]) pre++;
  return jac * 0.75 + Math.min(pre / 4, 1) * 0.25;
}
/* 목록에서 가장 잘 맞는 단지 찾기 (동 이름으로 후보 좁힘) */
function matchKapt(list, apt, dong) {
  var n = normName(apt), best = null, bestS = 0;
  list.forEach(function (it) {
    var s = nameScore(n, normName(it.name));
    /* 같은 법정동이면 가산점 */
    if (dong && it.addr && it.addr.indexOf(dong) >= 0) s += 0.12;
    if (s > bestS) { bestS = s; best = it; }
  });
  return bestS >= 0.62 ? best : null;
}

function subwayMin(k) {
  if (!k) return null;
  var m = String(k.subwayWay || "").match(/(\d+)/);
  return m ? Number(m[1]) : null;
}

function renderDanjiTable() {
  if (!DJ.rows.length || !document.getElementById("dj-table")) return;
  var band = Number(document.getElementById("dj-band").value) || 0;
  var minHH = Number(document.getElementById("dj-hh").value) || 0;
  var maxSub = Number(document.getElementById("dj-sub").value) || 0;
  var maxAge = Number(document.getElementById("dj-age").value) || 0;
  var thisYear = new Date().getFullYear();

  var rows = DJ.rows.map(function (g) {
    var deals = band ? g.deals.filter(function (t) { return inBand(t.area, band); }) : g.deals;
    if (!deals.length) return null;
    var r = { g: g, apt: g.apt, dong: g.dong, cnt: deals.length, year: g.buildYear || null };
    r.pm = median(deals.map(function (t) { return t.amount / t.area; }));
    r.py = r.pm * 3.3058;
    r.amt = median(deals.map(function (t) { return t.amount; }));
    r.last = deals.slice().sort(function (a, b) { return (b.ym * 100 + b.day) - (a.ym * 100 + a.day); })[0];
    var jd = band ? g.rentDeals.filter(function (t) { return inBand(t.area, band); }) : g.rentDeals;
    r.je = jd.length ? median(jd.map(function (t) { return t.deposit; })) : null;
    r.jr = r.je != null ? r.je / r.amt * 100 : null;
    r.gap = r.je != null ? r.amt - r.je : null;
    r.hh = g.kapt ? g.kapt.households : null;
    r.sub = subwayMin(g.kapt);
    r.builder = g.kapt ? g.kapt.builder : null;
    r.parking = (g.kapt && g.kapt.parkingTotal) ? g.kapt.parkingTotal : null;
    return r;
  }).filter(Boolean).filter(function (r) {
    if (minHH && (r.hh == null || r.hh < minHH)) return false;
    if (maxSub && (r.sub == null || r.sub > maxSub)) return false;
    if (maxAge && (r.year == null || thisYear - r.year > maxAge)) return false;
    return true;
  });

  var key = DJ.sortKey || "py", asc = !!DJ.sortAsc;
  rows.sort(function (a, b) {
    if (key === "apt") return asc ? a.apt.localeCompare(b.apt) : b.apt.localeCompare(a.apt);
    var x = a[key], y = b[key];
    if (x == null) return 1;
    if (y == null) return -1;
    return asc ? x - y : y - x;
  });
  DJ.view = rows;

  var cart = getCart();
  var tb = document.querySelector("#dj-table tbody");
  /* 태그 기준: 대장 = 이 조회에서 평당가 1위, 신축 = 5년 이내, 역세권 = 도보 10분 이내 */
  var topPy = rows.length ? Math.max.apply(null, rows.map(function (r) { return r.py || 0; })) : 0;
  tb.innerHTML = rows.map(function (r, i) {
    var cid = DJ.lawd + "|" + r.g.id;
    var inCart = cart.some(function (c) { return c.id === cid; });
    var age = r.year ? thisYear - r.year : null;
    return "<tr><td><b>" + r.apt + "</b>" +
        (r.py === topPy && topPy > 0 ? ' <span class="tagmini gold">대장</span>' : "") +
        (r.hh != null && r.hh >= 1000 ? ' <span class="tagmini ok">대단지</span>' : "") +
        (age != null && age <= 5 ? ' <span class="tagmini ok">신축</span>' : "") +
        (age != null && age >= 30 ? ' <span class="tagmini no">재건축연한</span>' : "") +
        (r.sub != null && r.sub <= 10 ? ' <span class="tagmini gold">역세권</span>' : "") +
        " <span style='color:var(--ink-soft);font-size:.74rem'>" + r.dong + "</span></td>" +
      "<td>" + eok(r.amt) + "</td>" +
      "<td><b>" + fmt(r.py) + "</b></td>" +
      "<td>" + (r.hh != null ? fmt(r.hh) : "—") + "</td>" +
      "<td>" + (r.year ? r.year + " (" + age + "년)" : "—") + "</td>" +
      "<td>" + (r.sub != null ? "도보 " + r.sub + "분" : "—") + "</td>" +
      "<td>" + (r.je != null ? eok(r.je) : "—") + "</td>" +
      '<td class="' + (r.jr != null && r.jr >= 70 ? "up" : "") + '">' + (r.jr != null ? r.jr.toFixed(1) + "%" : "—") + "</td>" +
      "<td>" + (r.gap != null ? eok(r.gap) : "—") + "</td>" +
      "<td>" + r.cnt + "건</td>" +
      '<td><button class="btn sm" data-djc="' + i + '"' + (inCart ? " disabled>담김" : ">담기") + "</button></td></tr>";
  }).join("") || '<tr><td colspan="11" style="color:var(--miss)">조건에 맞는 단지가 없습니다. 세대수·지하철·연식 조건을 완화해보세요.</td></tr>';

  tb.querySelectorAll("button[data-djc]").forEach(function (b) {
    b.addEventListener("click", function () { addToCart(DJ.view[Number(b.dataset.djc)], b); });
  });
}

function addToCart(r, btn) {
  var cart = getCart();
  var id = DJ.lawd + "|" + r.g.id;
  if (cart.some(function (c) { return c.id === id; })) return;
  var k = r.g.kapt || {};
  cart.push({
    id: id, lawd: DJ.lawd, regionKey: DJ.regionKey, regionName: lawdName(DJ.lawd),
    apt: r.apt, dong: r.dong, pmAvg: Math.round(r.pm), py: Math.round(r.py),
    amt: Math.round(r.amt), cnt: r.cnt, buildYear: r.year,
    jeonse: r.je != null ? Math.round(r.je) : null,
    gap: r.gap != null ? Math.round(r.gap) : null,
    jr: r.jr != null ? Math.round(r.jr * 10) / 10 : null,
    households: r.hh, parkingTotal: r.parking, builder: r.builder,
    subwayMin: r.sub, subwayLine: k.subwayLine || null, subwayStation: k.subwayStation || null,
    busWay: k.busWay || null, education: k.education || null, convenient: k.convenient || null,
    heat: k.heat || null, hall: k.hall || null, dongCnt: k.dongCnt || null,
    lastAmount: r.last ? r.last.amount : null, lastYm: r.last ? r.last.ym : null,
    lastFloor: r.last ? r.last.floor : null
  });
  setCart(cart);
  btn.disabled = true; btn.textContent = "담김";
  renderCart();
  updateCartDot();
}
/* 상단 "내 후보" 버튼에 담은 개수 표시 */
function updateCartDot() {
  var b = document.querySelector('#nav button[data-group="g6"]');
  if (!b) return;
  var nCart = getCart().length;
  b.innerHTML = "내 후보" + (nCart ? ' <span class="dot"></span>' + nCart : '<span class="dot"></span>');
}

function renderCart() {
  var cart = getCart();
  var cc = document.getElementById("cart-count");
  if (cc) cc.textContent = cart.length + "곳";
  var empty = document.getElementById("cart-empty");
  if (empty) empty.style.display = cart.length ? "none" : "";
  updateCartDot();
}
function removeFromCart(i) {
  var c = getCart();
  c.splice(i, 1);
  setCart(c);
  renderCart();
  renderDanjiTable();
  if (c.length) renderCartReport();
  else {
    document.getElementById("cart-report").innerHTML = "";
    document.getElementById("cart-compare").innerHTML = "";
    ["cx2-pricecard", "cx2-multcard", "cx2-gapcard"].forEach(function (id) {
      var el = document.getElementById(id); if (el) el.style.display = "none";
    });
    document.getElementById("cart-img").style.display = "none";
  }
}

/* ══ 내보내기 (이미지·엑셀) ═══════════════════ */
document.addEventListener("click", function (ev) {
  var b = ev.target.closest ? ev.target.closest("[data-exp]") : null;
  if (!b) return;
  var name = "TrackApt_" + (b.dataset.name || "표") + "_" + new Date().toISOString().slice(0, 10).replace(/-/g, "");
  if (b.dataset.exp === "xlsx") {
    if (typeof XLSX === "undefined") { alert("엑셀 라이브러리를 아직 불러오지 못했습니다. 잠시 후 다시 시도하세요."); return; }
    var tbl = document.getElementById(b.dataset.table);
    if (!tbl) return;
    var wb = XLSX.utils.table_to_book(tbl, { sheet: b.dataset.name || "표" });
    XLSX.writeFile(wb, name + ".xlsx");
  } else {
    if (typeof html2canvas === "undefined") { alert("이미지 라이브러리를 아직 불러오지 못했습니다. 잠시 후 다시 시도하세요."); return; }
    var card = b.closest(".card");
    if (!card) return;
    card.classList.add("capturing");
    html2canvas(card, { backgroundColor: "#0b1017", scale: 2, useCORS: true }).then(function (canvas) {
      card.classList.remove("capturing");
      var a = document.createElement("a");
      a.download = name + ".png";
      a.href = canvas.toDataURL("image/png");
      a.click();
    }).catch(function () { card.classList.remove("capturing"); alert("이미지 저장에 실패했습니다."); });
  }
});

/* ══ 장바구니 채점 보고서 (6축) ═══════════════ */
/* 가중치: 급지25 · 장기성과20 · 타이밍15 · 수급10 · 단지15 · 자금15 */
var CART_W = { rank: 25, perf: 20, timing: 15, supply: 10, danji: 15, cash: 15 };

function scoreDanjiAxis(c) {
  var s = 50, notes = [];
  if (c.households != null) {
    if (c.households >= 500) { s += 20; notes.push("세대수 " + fmt(c.households) + " ✓"); }
    else if (c.households < 300) { s -= 10; notes.push("세대수 " + fmt(c.households) + " (소규모)"); }
    else notes.push("세대수 " + fmt(c.households));
    if (c.parkingTotal) {
      var pr = c.parkingTotal / c.households;
      if (pr >= 1.2) s += 15; else if (pr >= 1.0) s += 5; else if (pr < 0.7) s -= 10;
      notes.push("세대당 주차 " + pr.toFixed(2));
    }
  } else notes.push("K-apt 정보 없음 (담기 전 단지정보를 누르면 반영)");
  if (c.buildYear) {
    var age = new Date().getFullYear() - c.buildYear;
    if (age <= 15) s += 15; else if (age >= 30) s += 5;   /* 신축 프리미엄 / 재건축 기대 */
    notes.push(c.buildYear + "년식");
  }
  return { score: clamp(s, 0, 100), note: notes.join(" · ") };
}

function scoreCartItem(c, cond, homePmArr) {
  var axes = {}, notes = {};
  var idx = c.regionKey ? RANKED.indexOf(c.regionKey) : -1;
  if (idx >= 0) {
    var r = scoreRegion(c.regionKey, idx, cond, homePmArr);
    axes.rank = r.s.rank; axes.perf = r.s.perf; axes.supply = r.s.supply; axes.timing = r.s.timing;
    notes.rank = "서열 " + r.rank + "위"; notes.perf = r.cagr != null ? pct(r.cagr, 1) + "/년" : "—";
    notes.timing = r.timingNote;
  } else {
    axes.rank = axes.perf = axes.supply = axes.timing = 50;
    notes.rank = notes.perf = notes.timing = "지역 미상 (코드 직접 입력 조회)";
  }
  var dj = scoreDanjiAxis(c);
  axes.danji = dj.score; notes.danji = dj.note;

  var price = c.pmAvg * cond.area;
  var fin = finance(c.regionKey || "", price, cond);
  axes.cash = (cond.cash > 0 && fin.need > 0) ? clamp(cond.cash / fin.need * 100, 0, 100) : 50;
  notes.cash = "필요현금 " + eok(fin.need) + " (" + fin.tag + ")";

  var wSum = 0, total = 0;
  Object.keys(CART_W).forEach(function (k) { wSum += CART_W[k]; total += axes[k] * CART_W[k]; });
  total /= wSum;
  var grade = total >= 80 ? "A" : (total >= 65 ? "B" : (total >= 50 ? "C" : "D"));
  var weakest = Object.keys(CART_W).sort(function (a, b) { return axes[a] - axes[b]; })[0];
  return { axes: axes, notes: notes, total: total, grade: grade, weakest: weakest, fin: fin, price: price };
}

var AXIS_NAME = { rank: "급지", perf: "장기성과", supply: "수급", timing: "타이밍", danji: "단지", cash: "자금" };

function renderCartReport() {
  var cart = getCart();
  var box = document.getElementById("cart-report");
  if (!cart.length) { box.innerHTML = '<div class="callout warn">담은 단지가 없습니다. 위 표에서 먼저 담아주세요.</div>'; return; }
  var cond = getCond();
  var homePmArr = (cond.own !== "none" && cond.home && DB.salePm.series[cond.home])
    ? pmSeries("salePm", cond.home) : null;
  var scored = cart.map(function (c) {
    var s = scoreCartItem(c, cond, homePmArr);
    s.item = c; return s;
  }).sort(function (a, b) { return b.total - a.total; });

  var thisYear = new Date().getFullYear();
  function axRow(name, v, sub) {
    return '<div class="axis"><span class="axname">' + name + '</span>' +
      '<div class="axtrack"><div class="axfill" style="width:' + v.toFixed(0) + '%"></div></div>' +
      "<b>" + v.toFixed(0) + "</b>" + (sub ? "<small>" + sub + "</small>" : "") + "</div>";
  }
  function kv(k, v) { return v ? '<span class="chip">' + k + " <b>" + v + "</b></span>" : ""; }

  box.innerHTML =
    '<div class="callout">채점 기준 — 급지 25 · 장기성과 20 · 진입 타이밍 15 · 수급 10 · 단지 경쟁력 15 · 자금 적합성 15. ' +
      "내 조건: 현금 " + (cond.cash > 0 ? eok(cond.cash) : "미입력") + " · " + cond.area + "㎡ · " +
      { none: "무주택", switch: "갈아타기", add: "추가매수", multi: "다주택" }[cond.own] + "</div>" +
    scored.map(function (s, i) {
      var c = s.item;
      var age = c.buildYear ? thisYear - c.buildYear : null;
      var parkRatio = (c.parkingTotal && c.households) ? (c.parkingTotal / c.households) : null;
      var rk = c.regionKey;
      var price = c.amt || c.pmAvg * cond.area;
      var pmRegion = (rk && DB.salePm.series[rk]) ? lastVal("salePm", rk) : null;
      var vsRegion = (pmRegion && c.pmAvg) ? (c.pmAvg / pmRegion - 1) * 100 : null;
      var r10 = rk ? idxChange("sale", ik(rk), 120) : null;
      var fin = finance(rk || "", price, cond);
      var jFin = rk ? financeJeonse(rk, price, cond) : null;
      var dist = (cond.home && rk) ? distKm(cond.home, rk) : null;

      var env = [];
      if (c.subwayLine || c.subwayStation || c.subwayMin != null)
        env.push('<div class="rowinfo"><b>대중교통</b> — ' +
          [c.subwayLine, c.subwayStation].filter(Boolean).join(" ") +
          (c.subwayMin != null ? " 도보 " + c.subwayMin + "분" : "") +
          (c.busWay ? " · 버스정류장 " + c.busWay : "") + "</div>");
      if (c.education) env.push('<div class="rowinfo"><b>학군·교육</b> — ' + c.education + "</div>");
      if (c.convenient) env.push('<div class="rowinfo"><b>편의시설</b> — ' + c.convenient + "</div>");
      if (!env.length) env.push('<div class="rowinfo" id="env-' + i + '">' +
        (c.envTried
          ? 'K-apt에 이 단지는 등록돼 있지만 <b>주변환경(교통·학군·편의) 항목이 비어 있습니다</b>. ' +
            '<span style="color:var(--ink-soft)">관리사무소가 입력하지 않으면 비는 항목이라 앱에서 채울 방법이 없습니다. ' +
            '<a href="#" data-envload="' + i + '">다시 시도</a></span>'
          : '주변 환경 정보를 아직 못 가져왔습니다. ' +
            '<a href="#" data-envload="' + i + '">지금 불러오기</a> ' +
            '<span style="color:var(--ink-soft)">— K-apt에 등록되지 않은 단지일 수도 있습니다.</span>') +
        "</div>");

      var bl = [];
      bl.push("<b>" + c.apt + "</b>은 " + (c.regionName || disp(rk || "")) + " " + c.dong + " 소재로, 평당 " +
        fmt(c.py || c.pmAvg * 3.3058) + "만원 · 매매 중위 " + eok(price) +
        (vsRegion != null ? " — 지역 평균 대비 <b>" + pct(vsRegion, 0) + "</b>" : "") + "입니다.");
      if (c.households) bl.push("단지 규모 " + fmt(c.households) + "세대" +
        (c.dongCnt ? " · " + c.dongCnt + "개 동" : "") +
        (parkRatio ? " · 세대당 주차 " + parkRatio.toFixed(2) + "대" + (parkRatio >= 1.2 ? " (여유)" : (parkRatio < 0.7 ? " (부족)" : "")) : "") +
        (c.builder ? " · 시공 " + c.builder : "") + ".");
      if (age != null) bl.push("준공 " + c.buildYear + "년(" + age + "년차)" +
        (age <= 10 ? " — 신축 프리미엄 구간입니다." : (age >= 30 ? " — 재건축 기대를 함께 보는 구간입니다." : " — 중간 연식입니다.")));
      if (c.jr != null) bl.push("전세 " + eok(c.jeonse) + " · 전세가율 " + c.jr + "% · 갭 <b>" + eok(c.gap) + "</b>" +
        (jFin ? " — 전세 끼고 매수 시 필요현금 " + eok(jFin.need) : (rk && isRegulated(rk) ? " — 규제지역이라 실거주 의무로 전세 승계는 막힙니다" : "")) + ".");
      bl.push("대출 매수 시 " + fin.tag + " 기준 대출 " + eok(fin.loan) + " · 필요현금 <b>" + eok(fin.need) + "</b>" +
        (cond.cash > 0 ? (fin.need <= cond.cash ? " <b>(실행 가능)</b>" : " (부족 " + eok(fin.need - cond.cash) + ")") : "") + ".");
      if (r10 != null) bl.push("지역 10년 상승률 " + pct(r10, 1) +
        (r10 >= 100 ? " — 통과선(100%)을 넘겼습니다." : " — 통과선 100%에 미달합니다.") +
        (dist != null ? " 내 지역에서 " + dist + "km." : ""));
      bl.push("가장 약한 축은 <b>" + AXIS_NAME[s.weakest] + "</b>입니다 — " +
        (s.weakest === "cash" ? "자금이 병목이니 평형을 낮추거나 전세 승계를 검토하세요."
         : s.weakest === "danji" ? "단지 규모·주차·연식이 약하거나 정보가 부족합니다. 같은 지역 다른 단지와 비교해보세요."
         : s.weakest === "timing" ? "지금이 역대 대비 유리한 진입 시점은 아닙니다. 갭투자·갈아타기 탭에서 밴드를 확인하세요."
         : s.weakest === "perf" ? "지역의 장기 성과가 통과선에 못 미칩니다. 급지가 더 높은 대안을 추천 탭에서 찾아보세요."
         : "이 축이 강한 대안을 추천 탭에서 비교해보세요."));

      return '<div class="reco' + (i === 0 ? " best" : "") + '" style="flex-wrap:wrap">' +
        '<div class="grade ' + s.grade + '">' + s.grade + "</div>" +
        '<div class="body">' +
          '<div class="name">' + c.apt +
            ' <span style="font-weight:600;color:var(--ink-soft);font-size:.78rem">' +
            (c.regionName || disp(rk || c.lawd)) + " " + c.dong +
            (c.buildYear ? " · " + c.buildYear + "년" : "") + (c.households ? " · " + fmt(c.households) + "세대" : "") + "</span></div>" +
          '<div class="chips" style="margin:6px 0">' +
            kv("평당", fmt(c.py || c.pmAvg * 3.3058) + "만") +
            kv("매매", eok(price)) +
            kv("전세", c.jeonse != null ? eok(c.jeonse) : "") +
            kv("전세가율", c.jr != null ? c.jr + "%" : "") +
            kv("갭", c.gap != null ? eok(c.gap) : "") +
            kv("지하철", c.subwayMin != null ? "도보 " + c.subwayMin + "분" : "") +
            kv("주차", parkRatio ? parkRatio.toFixed(2) + "대/세대" : "") +
            kv("난방", c.heat) + kv("구조", c.hall) +
          "</div>" +
          '<div style="width:100%;max-width:320px;margin:8px auto 0">' +
            radarSvg([{ n: "급지", v: s.axes.rank }, { n: "성과", v: s.axes.perf }, { n: "타이밍", v: s.axes.timing },
                      { n: "수급", v: s.axes.supply }, { n: "단지", v: s.axes.danji }, { n: "자금", v: s.axes.cash }],
                     320, i === 0 ? "#0e7c66" : "#0f4c5c") + "</div>" +
          radarNote([["급지", s.notes.rank], ["성과", s.notes.perf], ["타이밍", s.notes.timing],
                     ["자금", s.notes.cash]]) +
          env.join("") +
          '<div class="rowinfo" style="margin-top:8px"><b>검토 메모</b>' +
            "<ul style='margin:6px 0 0 16px;line-height:1.7'>" +
            bl.map(function (x) { return "<li>" + x + "</li>"; }).join("") + "</ul></div>" +
        "</div>" +
        '<div class="money"><div class="score">' + s.total.toFixed(1) + "</div>" +
        '<div class="need">필요 ' + eok(fin.need) + (jFin ? "<br>전세끼고 " + eok(jFin.need) : "") + "</div>" +
        '<button class="btn sm ghost" data-cdel="' + cart.indexOf(c) + '" style="margin-top:8px">빼기</button></div></div>';
    }).join("");
  box.querySelectorAll("a[data-envload]").forEach(function (a) {
    a.addEventListener("click", function (ev) {
      ev.preventDefault();
      var idx = Number(a.dataset.envload);
      var c = scored[idx].item;
      a.textContent = "불러오는 중…";
      fetchKaptList(lawdCandidates(c.lawd)[0])
        .then(function (items) {
          var hit = matchKapt(items, c.apt, c.dong);
          if (!hit) throw new Error("K-apt 목록에서 이 단지를 찾지 못했습니다");
          return apiGet("/api/apt?kind=info&kapt=" + hit.kaptCode);
        })
        .then(function (j2) {
          if (j2.error) throw new Error(j2.error);
          var k = j2.info || {};
          var cart2 = getCart();
          cart2.forEach(function (x) {
            if (x.id !== c.id) return;
            x.households = k.households || x.households;
            x.parkingTotal = k.parkingTotal || x.parkingTotal;
            x.builder = k.builder || x.builder;
            x.dongCnt = k.dongCnt || x.dongCnt;
            x.heat = k.heat || x.heat; x.hall = k.hall || x.hall;
            x.subwayLine = k.subwayLine; x.subwayStation = k.subwayStation;
            x.busWay = k.busWay; x.education = k.education; x.convenient = k.convenient;
            x.envTried = 1;   /* 조회는 끝났다 — 비어 있으면 원본에 없는 것 */
            var mm = String(k.subwayWay || "").match(/(\d+)/);
            if (mm) x.subwayMin = Number(mm[1]);
          });
          setCart(cart2);
          renderCartReport();
        })
        .catch(function (e) {
          var msg = String(e.message || e);
          var hint = /제한|초과|502|일시|네트워크/i.test(msg)
            ? "공공데이터 서버가 잠시 몰린 상태입니다. 20~30초 뒤 다시 눌러보세요."
            : "K-apt는 의무관리대상(300세대 이상 등) 단지만 등록되어 소규모 단지는 정보가 없습니다.";
          a.parentElement.innerHTML = "주변 환경 정보를 가져오지 못했습니다 — " + msg + "<br>" + hint +
            ' <a href="#" data-envload="' + idx + '">다시 시도</a>';
          a.parentElement.querySelector("a").addEventListener("click", function (ev2) {
            ev2.preventDefault(); renderCartReport();
          });
        });
    });
  });
  box.querySelectorAll("button[data-cdel]").forEach(function (b) {
    b.addEventListener("click", function () { removeFromCart(Number(b.dataset.cdel)); });
  });
  document.getElementById("cart-img").style.display = "";
  renderCartCompare(scored, cond);
}

/* ══ 담은 단지 비교 (해석 + 차트 3종) ══════════ */
var chartC2Price = null, chartC2Mult = null, chartC2Gap = null;
var C2_COLORS = ["#0f4c5c", "#4a90a4", "#c47f17", "#0e7c66", "#8a6d3b", "#7a5ea8"];

function renderCartCompare(scored, cond) {
  var box = document.getElementById("cart-compare");
  var list = scored.slice(0, 6);
  if (list.length < 2) {
    box.innerHTML = '<div class="rowinfo" style="margin-top:10px">단지를 2곳 이상 담으면 ' +
      '비교 해석과 매매가·배율·갭 추이 차트가 나옵니다.</div>';
    ["cx2-pricecard", "cx2-multcard", "cx2-gapcard"].forEach(function (id) {
      document.getElementById(id).style.display = "none";
    });
    return;
  }

  /* 1) 비교 해석 — 담은 단지들 사이의 상대 관계 */
  var a = list[0], b = list[1];
  var pyA = a.item.py || a.item.pmAvg * 3.3058, pyB = b.item.py || b.item.pmAvg * 3.3058;
  var mult = pyB ? pyA / pyB : null;
  var lines = [];
  if (mult) lines.push("<b>" + a.item.apt + "</b>는 <b>" + b.item.apt + "</b>의 " + mult.toFixed(2) +
    "배입니다 — 평당 " + fmt(pyA) + "만 vs " + fmt(pyB) + "만, 차이 " + fmt(Math.abs(pyA - pyB)) + "만원.");
  var amtA = a.item.amt || 0, amtB = b.item.amt || 0;
  if (amtA && amtB) lines.push("현재 매매가 차이는 <b>" + eok(Math.abs(amtA - amtB)) + "</b>입니다.");
  list.forEach(function (s) {
    var c = s.item;
    if (c.gap != null) lines.push("<b>" + c.apt + "</b> 갭 " + eok(c.gap) +
      (c.jr != null ? " (전세가율 " + c.jr + "%)" : "") + " — 전세 끼고 들어갈 때 필요한 돈입니다.");
  });
  var best = list[0], worst = list[list.length - 1];
  lines.push("채점 종합은 <b>" + best.item.apt + " " + best.total.toFixed(0) + "점(" + best.grade + ")</b>이 가장 높고, " +
    "<b>" + worst.item.apt + " " + worst.total.toFixed(0) + "점(" + worst.grade + ")</b>이 가장 낮습니다.");
  var cheap = list.slice().sort(function (x, y) {
    var fx = finance(x.item.regionKey || "", x.item.amt || x.item.pmAvg * cond.area, cond);
    var fy = finance(y.item.regionKey || "", y.item.amt || y.item.pmAvg * cond.area, cond);
    return fx.need - fy.need;
  })[0];
  var cheapFin = finance(cheap.item.regionKey || "", cheap.item.amt || cheap.item.pmAvg * cond.area, cond);
  lines.push("필요현금이 가장 적은 곳은 <b>" + cheap.item.apt + " " + eok(cheapFin.need) + "</b>입니다" +
    (cond.cash > 0 ? (cheapFin.need <= cond.cash ? " — 지금 예산으로 실행 가능합니다." : " — 그래도 " + eok(cheapFin.need - cond.cash) + " 부족합니다.") : "."));
  box.innerHTML = '<div class="note" style="margin-top:12px"><b>비교 해석</b>' +
    "<ul style='margin:6px 0 0 16px;line-height:1.75'>" +
    lines.map(function (x) { return "<li>" + x + "</li>"; }).join("") + "</ul></div>";

  /* 2) 차트용 월별 시계열 — 지역별 24개월 실거래를 캐시 활용해 조회 */
  var lawds = {};
  list.forEach(function (s) { lawds[s.item.lawd] = true; });
  var keys = Object.keys(lawds);
  Promise.all(keys.map(function (lw) { return fetchMonths(lw, 24, null).catch(function () { return null; }); }))
    .then(function (datas) {
      var byLawd = {};
      keys.forEach(function (lw, i) { byLawd[lw] = datas[i]; });
      var labels = null;
      var series = list.map(function (s, i) {
        var c = s.item, d = byLawd[c.lawd];
        if (!d) return null;
        if (!labels) labels = d.months.map(function (ym) { return ym.slice(0, 4) + "." + Number(ym.slice(4)); });
        var band = guessBand(c);
        return {
          name: c.apt + " " + band + "㎡대",
          color: C2_COLORS[i % C2_COLORS.length],
          sale: monthlyMedian(d.sale, c.apt, c.dong, band, "amount"),
          rent: monthlyMedian(d.rent, c.apt, c.dong, band, "deposit")
        };
      }).filter(Boolean);
      if (series.length < 2 || !labels) return;
      drawCartCharts(series, labels);
    });
}
/* 담은 단지의 대표 평형대 추정 (매매 중위가 ÷ ㎡당가) */
function guessBand(c) {
  var area = (c.amt && c.pmAvg) ? c.amt / c.pmAvg : 84;
  var bands = [36, 46, 59, 84, 101];
  for (var i = 0; i < bands.length; i++) if (inBand(area, bands[i])) return bands[i];
  return 84;
}

function drawCartCharts(series, labels) {
  /* 매매가 추이 */
  document.getElementById("cx2-pricecard").style.display = "";
  if (chartC2Price) chartC2Price.destroy();
  chartC2Price = new Chart(document.getElementById("cx2-price"), {
    type: "line",
    data: { labels: labels, datasets: series.map(function (s) {
      return { label: s.name, data: s.sale, borderColor: s.color, borderWidth: 2,
               pointRadius: 2, spanGaps: true, tension: .15 };
    })},
    options: chartOpts("만")
  });

  /* 배율 A÷B */
  var a = series[0], b = series[1];
  var mult = a.sale.map(function (v, i) {
    return (v != null && b.sale[i] != null && b.sale[i] !== 0) ? v / b.sale[i] : null;
  });
  var vals = mult.filter(function (v) { return v != null; });
  if (vals.length >= 6) {
    var cur = vals[vals.length - 1];
    var mean = vals.reduce(function (x, y) { return x + y; }, 0) / vals.length;
    var sorted = vals.slice().sort(function (x, y) { return x - y; });
    var band = sorted.filter(function (v) { return v <= cur; }).length / sorted.length * 100;
    var lastA = a.sale.filter(function (v) { return v != null; }).pop();
    var revert = lastA ? lastA * (mean / cur) - lastA : null;
    document.getElementById("cx2-multkpi").innerHTML =
      statBox("현재 배율 (A÷B)", cur.toFixed(3)) +
      statBox("기간 평균", mean.toFixed(3) + " (최저 " + sorted[0].toFixed(3) + " · 최고 " + sorted[sorted.length - 1].toFixed(3) + ")") +
      statBox("밴드 위치", band.toFixed(0) + "%", band <= 30 ? "up" : (band >= 70 ? "down" : "")) +
      statBox("평균 회귀 시 A 가격", revert != null ? (revert >= 0 ? "+" : "") + eok(revert) : "—", revert != null && revert < 0 ? "up" : "");
    document.getElementById("cx2-multread").innerHTML =
      "배율 1.20은 A가 B보다 20% 비싸다는 뜻입니다. 이 값이 기간 평균보다 낮으면 <b>평소보다 A가 저렴해진 상태</b>이고, " +
      "A로 갈아타기에 상대적으로 유리한 시점입니다. 현재 " + cur.toFixed(3) + "은 평균 " + mean.toFixed(3) + " 대비 " +
      pct((cur / mean - 1) * 100, 1) + " 지점입니다.";
    document.getElementById("cx2-multcard").style.display = "";
    if (chartC2Mult) chartC2Mult.destroy();
    chartC2Mult = new Chart(document.getElementById("cx2-mult"), {
      type: "line",
      data: { labels: labels, datasets: [{ label: "배율 (A÷B)", data: mult, borderColor: C2_COLORS[0],
        borderWidth: 2, pointRadius: 2, spanGaps: true, tension: .15 }] },
      options: chartOpts("x"),
      plugins: [{
        id: "c2mean",
        beforeDatasetsDraw: function (ch) {
          var y = ch.scales.y.getPixelForValue(mean), ar = ch.chartArea, ctx = ch.ctx;
          if (y < ar.top || y > ar.bottom) return;
          ctx.save(); ctx.strokeStyle = "#c47f17"; ctx.setLineDash([5, 4]); ctx.lineWidth = 1;
          ctx.beginPath(); ctx.moveTo(ar.left, y); ctx.lineTo(ar.right, y); ctx.stroke(); ctx.restore();
        }
      }]
    });
  } else {
    document.getElementById("cx2-multcard").style.display = "none";
  }

  /* 갭 추이 */
  document.getElementById("cx2-gapcard").style.display = "";
  if (chartC2Gap) chartC2Gap.destroy();
  chartC2Gap = new Chart(document.getElementById("cx2-gap"), {
    type: "line",
    data: { labels: labels, datasets: series.map(function (s) {
      return { label: s.name + " 갭",
        data: s.sale.map(function (v, i) { return (v != null && s.rent[i] != null) ? v - s.rent[i] : null; }),
        borderColor: s.color, borderWidth: 1.5, borderDash: [4, 3], pointRadius: 2, spanGaps: true, tension: .15 };
    })},
    options: chartOpts("만")
  });
}

/* ══ 4분면 탭 ════════════════════════════════ */
var QD = { months: 12, scope: "metro", zoom: 1, panX: 0, panY: 0 };
var chartQuad = null;

function idxChange(key, region, months) {
  var e = latestYM(key);
  var cur = getVal(key, region, e[0], e[1]);
  var t = e[0] * 12 + e[1] - months;
  var prev = getVal(key, region, Math.floor((t - 1) / 12), ((t - 1) % 12) + 1);
  return (cur != null && prev != null && prev !== 0) ? (cur / prev - 1) * 100 : null;
}
function quadPhase(s, j) {
  if (s > 0 && j > 0) return { t: "동반 상승", c: "up" };
  if (s > 0) return { t: "매매 주도", c: "down" };
  if (j > 0) return { t: "전세 주도", c: "flat" };
  return { t: "동반 하락", c: "flat" };
}

function buildQuad(root) {

        '<b>전세가 함께 오르는 상승</b>은 실수요가 받치는 국면이고, 매매만 오르면 기대가 앞서 갭이 벌어지는 국면입니다. ' +
        '원 색은 국면입니다 — 청록은 동반 상승, 주황은 매매 주도, 회색은 그 밖입니다. ' +
        '원을 누르면 상세 수치가 나옵니다.</p>' +

        '<div class="field"><label>범위</label><div class="seg" id="qd-scope">' +
          '<button data-s="metro" class="on">수도권</button><button data-s="all">전국</button></div></div>' +
      '</div>' +
      '<p class="hint" id="qd-zoomlbl" style="margin-top:6px"></p>' +
      '<div style="display:none">' +
      '</div>' +
      '<div class="status" id="qd-kpi" style="margin-top:12px"></div>' +
      '<div class="chartbox" style="height:380px;margin-top:12px"><canvas id="qd-chart"></canvas></div></div>' +
    '<div class="card"><div class="eyebrow">Table</div><h2>지역별 국면</h2>' +
      '<div class="expbar"><button class="btn sm ghost" data-exp="img" data-name="4분면">이미지 저장</button>' +
      '<button class="btn sm ghost" data-exp="xlsx" data-table="qd-table" data-name="4분면">엑셀 저장</button></div>' +
      '<div class="tblwrap"><table id="qd-table"><thead><tr>' +
      '<th>지역</th><th>매매</th><th>전세</th><th>국면</th><th>㎡당가</th><th>전세가율</th></tr></thead><tbody></tbody></table></div>' +
      '<div class="note"><b>어떤 인사이트를 얻나</b> — 오른쪽 위(동반 상승)에 몰린 지역이 지금 주도권을 쥔 ' +
        '곳입니다. 왼쪽 아래에 남은 지역은 아직 순서가 오지 않았거나 수요가 빠진 곳인데, <b>비슷한 급지인데 ' +
        '한쪽만 오른쪽 위에 있다면</b> 나머지가 다음 오를 곳 후보입니다.<br>' +
        '<b>국면 읽는 법</b> — 동반 상승은 실수요와 기대가 함께 움직이는 가장 건강한 상승입니다. ' +
        '매매 주도는 기대가 값에 먼저 실린 상태라 갭이 커지고 하방이 얇아집니다. 전세 주도는 사용가치가 먼저 ' +
        '움직이는 국면으로, 갭이 좁혀져 진입이 쉬워집니다.</div></div>';

  root.querySelectorAll("#qd-months button").forEach(function (b) {
    b.addEventListener("click", function () {
      QD.months = Number(b.dataset.m);
      root.querySelectorAll("#qd-months button").forEach(function (x) { x.classList.toggle("on", x === b); });
      renderQuad();
    });
  });
  root.querySelectorAll("#qd-scope button").forEach(function (b) {
    b.addEventListener("click", function () {
      QD.scope = b.dataset.s; QD.zoom = 1;
      root.querySelectorAll("#qd-scope button").forEach(function (x) { x.classList.toggle("on", x === b); });
      renderQuad();
    });
  });
  /* 마우스 휠 = 확대·축소, 드래그 = 이동, 더블클릭 = 전체 보기 */
  var cv = root.querySelector("#qd-chart");
  cv.style.cursor = "grab";
  cv.addEventListener("wheel", function (ev) {
    ev.preventDefault();
    var before = QD.zoom;
    QD.zoom = Math.max(1, Math.min(8, QD.zoom * (ev.deltaY < 0 ? 1.18 : 1 / 1.18)));
    if (QD.zoom === 1) { QD.panX = 0; QD.panY = 0; }
    if (QD.zoom !== before) renderQuad();
  }, { passive: false });
  var drag = null;
  cv.addEventListener("mousedown", function (ev) {
    if (QD.zoom === 1) return;
    drag = { x: ev.clientX, y: ev.clientY, px: QD.panX, py: QD.panY };
    cv.style.cursor = "grabbing";
  });
  window.addEventListener("mousemove", function (ev) {
    if (!drag) return;
    var w = cv.clientWidth || 600, h = cv.clientHeight || 380;
    QD.panX = drag.px - (ev.clientX - drag.x) / w * 2;
    QD.panY = drag.py + (ev.clientY - drag.y) / h * 2;
    renderQuad();
  });
  window.addEventListener("mouseup", function () {
    if (drag) { drag = null; cv.style.cursor = "grab"; }
  });
  cv.addEventListener("dblclick", function () {
    QD.zoom = 1; QD.panX = 0; QD.panY = 0; renderQuad();
  });
  /* 모바일: 두 손가락 확대 + 한 손가락 이동 */
  var touch = null;
  cv.addEventListener("touchstart", function (ev) {
    if (ev.touches.length === 2) {
      var d = Math.hypot(ev.touches[0].clientX - ev.touches[1].clientX,
                         ev.touches[0].clientY - ev.touches[1].clientY);
      touch = { mode: "pinch", d: d, z: QD.zoom };
    } else if (ev.touches.length === 1 && QD.zoom > 1) {
      touch = { mode: "pan", x: ev.touches[0].clientX, y: ev.touches[0].clientY, px: QD.panX, py: QD.panY };
    }
  }, { passive: true });
  cv.addEventListener("touchmove", function (ev) {
    if (!touch) return;
    if (touch.mode === "pinch" && ev.touches.length === 2) {
      ev.preventDefault();
      var d = Math.hypot(ev.touches[0].clientX - ev.touches[1].clientX,
                         ev.touches[0].clientY - ev.touches[1].clientY);
      QD.zoom = Math.max(1, Math.min(8, touch.z * (d / touch.d)));
      if (QD.zoom === 1) { QD.panX = 0; QD.panY = 0; }
      renderQuad();
    } else if (touch.mode === "pan" && ev.touches.length === 1) {
      ev.preventDefault();
      var w2 = cv.clientWidth || 360, h2 = cv.clientHeight || 320;
      QD.panX = touch.px - (ev.touches[0].clientX - touch.x) / w2 * 2;
      QD.panY = touch.py + (ev.touches[0].clientY - touch.y) / h2 * 2;
      renderQuad();
    }
  }, { passive: false });
  cv.addEventListener("touchend", function () { touch = null; }, { passive: true });
}

function renderQuad() {
  if (!DB || !RANKED.length) return;
  var list = RANKED.filter(function (k) { return QD.scope === "all" || METRO[k]; });
  var rows = list.map(function (k) {
    var s = idxChange("sale", ik(k), QD.months);
    var j = idxChange("jeonse", ik(k), QD.months);
    if (s == null || j == null) return null;
    var pmv = lastVal("salePm", k), jv = lastVal("jeonsePm", k);
    return { key: k, s: s, j: j, pm: pmv, jr: (pmv && jv) ? jv / pmv * 100 : null, ph: quadPhase(s, j) };
  }).filter(Boolean);

  var cnt = { "동반 상승": 0, "매매 주도": 0, "전세 주도": 0, "동반 하락": 0 };
  rows.forEach(function (r) { cnt[r.ph.t]++; });
  document.getElementById("qd-kpi").innerHTML =
    statBox("동반 상승", cnt["동반 상승"] + "곳", "up") +
    statBox("매매 주도", cnt["매매 주도"] + "곳", "down") +
    statBox("전세 주도", cnt["전세 주도"] + "곳") +
    statBox("동반 하락", cnt["동반 하락"] + "곳");

  var css = getComputedStyle(document.documentElement);
  var cUp = css.getPropertyValue("--up").trim(), cDown = css.getPropertyValue("--down").trim();
  /* 원 크기를 지역명이 들어갈 만큼 잡는다 (텍스트 폭 기준) */
  var mctx = null;
  try { mctx = document.getElementById("qd-chart").getContext("2d"); } catch (e) {}
  if (mctx) mctx.font = "700 10px Pretendard Variable, sans-serif";
  rows.forEach(function (r) {
    r.label = disp(r.key).split(" ").pop();
    var tw = mctx ? mctx.measureText(r.label).width : r.label.length * 10;
    r.rad = Math.max(15, tw / 2 + 7);
  });

  /* 확대: 데이터 밀집 중심(중앙값)을 기준으로 범위를 좁힌다 */
  var xs = rows.map(function (r) { return r.s; }), ys = rows.map(function (r) { return r.j; });
  function span(arr) {
    var mn = Math.min.apply(null, arr), mx = Math.max.apply(null, arr);
    var pad = (mx - mn) * 0.12 + 1;
    return [mn - pad, mx + pad];
  }
  var xr = span(xs), yr = span(ys);
  var xc = median(xs), yc = median(ys);
  var xw = (xr[1] - xr[0]) / 2 / QD.zoom, yw = (yr[1] - yr[0]) / 2 / QD.zoom;
  var cx2 = xc + QD.panX * xw * 2, cy2 = yc + QD.panY * yw * 2;
  var xMin = QD.zoom === 1 ? xr[0] : cx2 - xw, xMax = QD.zoom === 1 ? xr[1] : cx2 + xw;
  var yMin = QD.zoom === 1 ? yr[0] : cy2 - yw, yMax = QD.zoom === 1 ? yr[1] : cy2 + yw;
  var zl = document.getElementById("qd-zoomlbl");
  if (zl) zl.textContent = QD.zoom === 1
    ? "전체 " + rows.length + "곳 · 마우스 휠(모바일은 두 손가락)로 확대할 수 있습니다"
    : "확대 " + QD.zoom.toFixed(1) + "배 · 끌어서 이동 · 더블클릭하면 전체 보기로 돌아갑니다";

  if (chartQuad) chartQuad.destroy();
  chartQuad = new Chart(document.getElementById("qd-chart"), {
    type: "bubble",
    data: { datasets: [{
      data: rows.map(function (r) { return { x: r.s, y: r.j, r: r.rad }; }),
      backgroundColor: rows.map(function (r) {
        return r.ph.t === "동반 상승" ? cUp + "26" : (r.ph.t === "매매 주도" ? cDown + "26" : "#8a94a326");
      }),
      borderColor: rows.map(function (r) {
        return r.ph.t === "동반 상승" ? cUp + "99" : (r.ph.t === "매매 주도" ? cDown + "99" : "#8a94a399");
      }),
      borderWidth: 1
    }]},
    options: {
      responsive: true, maintainAspectRatio: false, animation: false,
      plugins: { legend: { display: false }, tooltip: { callbacks: { label: function (c) {
        var r = rows[c.dataIndex];
        return disp(r.key) + " · 매매 " + pct(r.s) + " · 전세 " + pct(r.j);
      } } } },
      layout: { padding: { top: 14, right: 16, left: 4, bottom: 4 } },
      scales: {
        x: { min: xMin, max: xMax, title: { display: true, text: "매매 변화 (%)", font: { size: 10 } },
             grid: { color: "#1e2836" }, ticks: { font: { size: 10 } } },
        y: { min: yMin, max: yMax, title: { display: true, text: "전세 변화 (%)", font: { size: 10 } },
             grid: { color: "#1e2836" }, ticks: { font: { size: 10 } } }
      }
    },
    plugins: [{
      id: "axes0",
      beforeDatasetsDraw: function (ch) {
        var a = ch.chartArea, x0 = ch.scales.x.getPixelForValue(0), y0 = ch.scales.y.getPixelForValue(0);
        var ctx = ch.ctx;
        ctx.save(); ctx.strokeStyle = "#33405280"; ctx.lineWidth = 1;
        if (x0 >= a.left && x0 <= a.right) { ctx.beginPath(); ctx.moveTo(x0, a.top); ctx.lineTo(x0, a.bottom); ctx.stroke(); }
        if (y0 >= a.top && y0 <= a.bottom) { ctx.beginPath(); ctx.moveTo(a.left, y0); ctx.lineTo(a.right, y0); ctx.stroke(); }
        /* 사분면 이름 */
        ctx.font = "700 10px Pretendard Variable, sans-serif";
        ctx.fillStyle = "#4a5768";
        ctx.textAlign = "right"; ctx.fillText("동반 상승", a.right - 6, a.top + 14);
        ctx.textAlign = "left";  ctx.fillText("전세 주도", a.left + 6, a.top + 14);
        ctx.textAlign = "right"; ctx.fillText("매매 주도", a.right - 6, a.bottom - 6);
        ctx.textAlign = "left";  ctx.fillText("동반 하락", a.left + 6, a.bottom - 6);
        ctx.restore();
      },
      /* 원 안에 지역명 */
      afterDatasetsDraw: function (ch) {
        var meta = ch.getDatasetMeta(0), ctx = ch.ctx, a2 = ch.chartArea;
        ctx.save();
        ctx.font = "700 10px Pretendard Variable, sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        rows.forEach(function (r, i) {
          ctx.fillStyle = r.ph.t === "동반 상승" ? cUp : (r.ph.t === "매매 주도" ? cDown : "#aab4c2");
          var el = meta.data[i];
          if (!el) return;
          if (el.x < a2.left - r.rad || el.x > a2.right + r.rad ||
              el.y < a2.top - r.rad || el.y > a2.bottom + r.rad) return;
          ctx.fillText(r.label, el.x, el.y);
        });
        ctx.restore();
      }
    }]
  });

  var tb = document.querySelector("#qd-table tbody");
  tb.innerHTML = rows.slice().sort(function (a, b) { return b.s - a.s; }).map(function (r) {
    return "<tr><td>" + regionCell(r.key) + "</td>" +
      '<td class="' + cls(r.s) + '">' + pct(r.s) + "</td>" +
      '<td class="' + cls(r.j) + '">' + pct(r.j) + "</td>" +
      '<td class="' + r.ph.c + '">' + r.ph.t + "</td>" +
      "<td>" + fmt(r.pm) + "</td>" +
      "<td>" + (r.jr != null ? r.jr.toFixed(1) + "%" : "—") + "</td></tr>";
  }).join("");
}

/* ══ 순환매 탭 ═══════════════════════════════ */
var RT = { base: "", cvMax: 8 };

function buildRota(root) {
  root.innerHTML =
    '<div class="card">' +
      '<div class="eyebrow">Rotation</div><h2>순환매 후보</h2>' +

function renderRota() {
  if (!DB || !RANKED.length) return;
  var sel = document.getElementById("rt-base");
  if (!sel.options.length) {
    fillKbRegionSelect("rt-base", RANKED, RANKED[0], 36);
    RT.base = RANKED[0];
  }
  if (RT.base) sel.value = RT.base; else RT.base = sel.value;

  var baseArr = pmSeries("salePm", RT.base);
  var base3y = idxChange("sale", ik(RT.base), 36);
  var out = [];
  RANKED.forEach(function (k) {
    if (k === RT.base) return;
    var mult = ratioSeries(pmSeries("salePm", k), baseArr, 1);
    var tail = mult.slice(-120).filter(function (v) { return v != null; });
    if (tail.length < 60) return;   /* 5년 미만 짝은 제외 */
    var cur = null;
    for (var i = mult.length - 1; i >= 0; i--) if (mult[i] != null) { cur = mult[i]; break; }
    var mean = tail.reduce(function (a, b) { return a + b; }, 0) / tail.length;
    var sd = Math.sqrt(tail.reduce(function (a, b) { return a + (b - mean) * (b - mean); }, 0) / tail.length);
    var cv = sd / mean * 100;
    if (cv > RT.cvMax) return;
    var sorted = tail.slice().sort(function (a, b) { return a - b; });
    var band = sorted.filter(function (v) { return v <= cur; }).length / sorted.length * 100;
    var room = (mean / cur - 1) * 100;
    var p3 = idxChange("sale", ik(k), 36);
    out.push({ key: k, pm: lastVal("salePm", k), cur: cur, mean: mean, cv: cv, band: band,
               room: room, d3: (p3 != null && base3y != null) ? p3 - base3y : null });
  });
  out.sort(function (a, b) { return a.band - b.band; });

  document.getElementById("rt-kpi").innerHTML =
    statBox("동행 짝", out.length + "곳") +
    statBox("밴드 10% 이하", out.filter(function (r) { return r.band <= 10; }).length + "곳", "up") +
    statBox("기준 3년 상승", base3y != null ? pct(base3y, 1) : "—", cls(base3y)) +
    statBox("기준 ㎡당가", fmt(lastVal("salePm", RT.base)) + "만원");

  var tb = document.querySelector("#rt-table tbody");
  tb.innerHTML = out.map(function (r) {
    return '<tr class="' + (r.band <= 10 ? "hit " : "") + (isMine(r.key) ? "mine" : "") + '"><td>' +
      regionCell(r.key) + "</td>" +
      "<td>" + fmt(r.pm) + "</td>" +
      "<td>" + r.cur.toFixed(3) + "</td>" +
      "<td>" + r.mean.toFixed(3) + "</td>" +
      "<td>" + r.cv.toFixed(1) + "%</td>" +
      "<td>" + r.band.toFixed(0) + "%</td>" +
      '<td class="' + cls(r.room) + '">' + pct(r.room, 1) + "</td>" +
      '<td class="' + cls(r.d3) + '">' + (r.d3 != null ? pct(r.d3, 1) + "p" : "—") + "</td></tr>";
  }).join("") || '<tr><td colspan="8" style="color:var(--miss)">이 기준을 만족하는 짝이 없습니다. 변동계수를 느슨하게 바꿔보세요.</td></tr>';
}

/* ══ 평형대·월별 중위 공용 헬퍼 ═══════════════ */
var BANDS = { 36: [20, 45], 46: [45, 55], 59: [55, 70], 84: [70, 95], 101: [95, 120] };
function bandLabel2(b) { return b + "㎡대 (" + BANDS[b][0] + "~" + BANDS[b][1] + ")"; }
function inBand(area, b) { return area >= BANDS[b][0] && area < BANDS[b][1]; }

/* (lawd → 월별 매매·전세) 메모리 캐시 — 대장·비교 탭 공용 */
var TRADE_CACHE = {};
function fetchMonths(lawd, nMonths, onTick, guName) {
  var key = lawd + ":" + nMonths + ":" + (guName || "");
  if (TRADE_CACHE[key]) return Promise.resolve(TRADE_CACHE[key]);
  var months = ymList(nMonths).reverse();
  var saleP = Promise.all(months.map(function (ym) {
    return fetchTrade(lawd, "sale", ym, guName).then(function (j) {
      if (onTick) onTick();
      if (j.error) throw new Error(j.error + (j.msg ? " · " + j.msg : ""));
      return { ym: ym, deals: (j.items || []).filter(function (t) { return !t.canceled && t.amount > 0 && t.area > 0; }) };
    });
  }));
  var rentP = Promise.all(months.map(function (ym) {
    return fetchTrade(lawd, "rent", ym, guName)
      .then(function (j) { if (onTick) onTick(); return { ym: ym, deals: (j.items || []).filter(function (t) { return t.jeonse && t.deposit > 0 && t.area > 0; }) }; })
      .catch(function () { if (onTick) onTick(); return { ym: ym, deals: [] }; });
  }));
  return Promise.all([saleP, rentP]).then(function (both) {
    var out = { months: months, sale: both[0], rent: both[1] };
    TRADE_CACHE[key] = out;
    return out;
  });
}
/* 단지·평형대 기준 월별 중위 시계열 */
function monthlyMedian(monthsData, apt, dong, band, field) {
  return monthsData.map(function (m) {
    var vals = m.deals.filter(function (t) {
      return t.apt === apt && t.dong === dong && inBand(t.area, band);
    }).map(function (t) { return t[field]; });
    return median(vals);
  });
}

/* 선택 상태를 화면에 반영 */
function renderPicker() {
  var box = document.getElementById("fg-picker");
  if (!box) return;
  box.querySelectorAll(".pitem").forEach(function (b) {
    b.classList.toggle("on", FG.picked.indexOf(b.dataset.name) >= 0);
  });
  box.querySelectorAll("input[data-sido]").forEach(function (cb) {
    var g = LAWD_GROUPS[Number(cb.dataset.sido)];
    var names = g.items.map(function (it) { return g.sido + " " + it[0]; });
    var sel = names.filter(function (nm) { return FG.picked.indexOf(nm) >= 0; }).length;
    cb.checked = sel === names.length;
    cb.indeterminate = sel > 0 && sel < names.length;
    var cnt = cb.closest(".phead").querySelector(".cnt");
    cnt.textContent = sel ? sel + " / " + names.length + "곳" : names.length + "곳";
    cnt.style.color = sel ? "var(--up)" : "";
  });
  var ch = document.getElementById("fg-chosen");
  ch.innerHTML = FG.picked.length
    ? FG.picked.slice(0, 12).map(function (nm) { return '<span class="tag">' + nm + "</span>"; }).join("") +
      (FG.picked.length > 12 ? '<span class="tag">외 ' + (FG.picked.length - 12) + "곳</span>" : "")
    : '<span class="hint" style="margin:0">선택된 지역이 없습니다.</span>';

function loadFlag() {
  if (!FG.picked.length) { alert("지역을 하나 이상 선택하세요. 시·도 체크박스를 누르면 전체가 선택됩니다."); return; }
  var nameToCode = {};
  LAWD_GROUPS.forEach(function (g) {
    g.items.forEach(function (it) { nameToCode[g.sido + " " + it[0]] = it[1]; });
  });
  var regions = FG.picked.map(function (nm) {
    return { name: nm, code: nameToCode[nm], sub: subFilterOf(nm) };
  }).filter(function (r) { return r.code; });
  var btn = document.getElementById("fg-go");
  btn.disabled = true;
  var total = regions.length * 12, done = 0;
  function tick() { done++; btn.textContent = "불러오는 중… (" + done + "/" + total + ")"; }
  tick(); done = 0; btn.textContent = "불러오는 중… (0/" + total + ")";

  /* 지역 순차 처리 (API 부하 완화) */
  var results = [];
  var chain = Promise.resolve();
  regions.forEach(function (reg) {
    var rk = reg.code;
    chain = chain.then(function () {
      return fetchMonths(rk, 6, tick).then(function (data) {
        var byApt = {};
        data.sale.forEach(function (m) {
          m.deals.forEach(function (t) {
            if (!inBand(t.area, FG.band)) return;
            if (!inSubDistrict(t.dong, reg.sub)) return;
            var id = t.dong + "|" + t.apt;
            (byApt[id] = byApt[id] || { apt: t.apt, dong: t.dong, amounts: [], areas: [], buildYear: t.buildYear }).amounts.push(t.amount);
            byApt[id].areas.push(t.area);
          });
        });
        var apts = Object.keys(byApt).map(function (id) {
          var g = byApt[id];
          if (g.amounts.length < 2) return null;
          g.med = median(g.amounts);
          g.max = Math.max.apply(null, g.amounts);
          g.areaMed = median(g.areas);
          g.py = g.med / g.areaMed * 3.3058;
          var jv = [];
          data.rent.forEach(function (m) {
            m.deals.forEach(function (t) {
              if (t.apt === g.apt && t.dong === g.dong && inBand(t.area, FG.band)) jv.push(t.deposit);
            });
          });
          g.jeonse = median(jv);
          g.jr = (g.jeonse && g.med) ? g.jeonse / g.med * 100 : null;
          g.gap = g.jeonse != null ? g.med - g.jeonse : null;
          g.cnt = g.amounts.length;
          return g;
        }).filter(Boolean).sort(function (a, b) { return b.py - a.py; }).slice(0, FG.top);
        results.push({ region: rk, regionName: reg.name, apts: apts });
      });
    });
  });
  chain.then(function () {
    FG.results = results;
    renderFlagTable();
  }).catch(function (e) {
    alert("대장 아파트 조회 실패: " + e.message);
  }).finally(function () {
    btn.disabled = false; btn.textContent = "대장 아파트 불러오기";
  });
}

function renderFlagTable() {
  var cart = getCart();
  var nApts = 0;
  var rowsHtml = FG.results.map(function (r) {
    return r.apts.map(function (g, i) {
      nApts++;
      var cid = r.region + "|" + g.dong + "|" + g.apt;
      var inCart = cart.some(function (c) { return c.id === cid; });
      return '<tr class="' + (i === 0 ? "hit" : "") + '">' +
        "<td>" + (i === 0 ? (r.regionName || lawdName(r.region)) : "") + (i === 0 ? "" : "&nbsp;&nbsp;└ " + (i + 1) + "위") + "</td>" +
        "<td><b>" + g.apt + "</b> <span style='color:var(--ink-soft);font-size:.74rem'>" + g.dong + "</span></td>" +
        "<td><b>" + eok(g.med) + "</b></td>" +
        "<td>" + eok(g.max) + "</td>" +
        "<td>" + (g.jeonse != null ? eok(g.jeonse) : "—") + "</td>" +
        "<td>" + (g.jr != null ? g.jr.toFixed(1) + "%" : "—") + "</td>" +
        "<td>" + fmt(g.py) + "</td>" +
        "<td>" + (g.gap != null ? eok(g.gap) : "—") + "</td>" +
        "<td>" + g.cnt + "건</td>" +
        '<td><button class="btn sm" data-fgcart="' + encodeURIComponent(r.region) + "|" + encodeURIComponent(g.dong) + "|" + encodeURIComponent(g.apt) + '"' +
          (inCart ? " disabled>담김" : ">담기") + "</button></td></tr>";
    }).join("");
  }).join("");
  document.getElementById("fg-count").textContent = nApts + "단지";
  document.getElementById("fg-resultcard").style.display = "";
  var tb = document.querySelector("#fg-table tbody");
  tb.innerHTML = rowsHtml;
  tb.querySelectorAll("button[data-fgcart]").forEach(function (b) {
    b.addEventListener("click", function () {
      var p = b.dataset.fgcart.split("|").map(decodeURIComponent);
      var rk = p[0], dong = p[1], apt = p[2];
      var r = FG.results.filter(function (x) { return x.region === rk; })[0];
      var g = r.apts.filter(function (x) { return x.dong === dong && x.apt === apt; })[0];
      var cart2 = getCart();
      var cid = rk + "|" + dong + "|" + apt;
      if (cart2.some(function (c) { return c.id === cid; })) return;
      cart2.push({
        id: cid, lawd: rk, regionKey: kbKeyOfLawd(rk), regionName: lawdName(rk), apt: apt, dong: dong,
        pmAvg: Math.round(g.med / g.areaMed), py: Math.round(g.med / g.areaMed * 3.3058),
        amt: Math.round(g.med), jr: g.jr != null ? Math.round(g.jr * 10) / 10 : null,
        cnt: g.cnt, buildYear: g.buildYear,
        jeonse: g.jeonse != null ? Math.round(g.jeonse) : null,
        gap: g.gap != null ? Math.round(g.gap) : null,
        households: null, parkingTotal: null, builder: null,
        lastAmount: g.med, lastYm: null
      });
      setCart(cart2);
      b.disabled = true; b.textContent = "담김";
      renderCart();
    });
  });
}

      '<div class="note" id="cx-read"></div></div>' +
    '<div class="card" id="cx-pricecard" style="display:none"><div class="eyebrow">Price</div><h2>매매가 추이</h2>' +
      '<p class="desc">월별 중위 거래가입니다. 선 사이 간격이 벌어지면 격차 확대, 좁아지면 따라잡는 중입니다. ' +

        '적은 돈으로 큰 평형에 올라탈 기회이고, 상급지 아파트와 값이 닿는 순간도 마찬가지입니다.</p>' +

function renderCmpxShell() {
  if (!DB) return;
  fillRegionSelects(["cx-r0", "cx-r1", "cx-r2"]);
  [0, 1, 2].forEach(function (i) {
    var sel = document.getElementById("cx-r" + i);
    if (sel) CMP.slots[i].region = sel.value;
  });
}

function loadCmpSlot(i) {
  var s = CMP.slots[i];
  s.region = document.getElementById("cx-r" + i).value;
  if (!s.region) return;
  var btn = document.getElementById("cx-load" + i);
  btn.disabled = true;
  var total = 48, done = 0;
  fetchMonths(s.region, 24, function () {
    done++; btn.textContent = "불러오는 중… (" + done + "/" + total + ")";
  }).then(function (data) {
    s.data = data;
    fillAptSelect(i);
  }).catch(function (e) {
    alert("단지 조회 실패: " + e.message);
  }).finally(function () {
    btn.disabled = false; btn.textContent = "단지 불러오기";
  });
}

function fillAptSelect(i) {
  var s = CMP.slots[i];
  if (!s.data) return;
  var byApt = {};
  s.data.sale.forEach(function (m) {
    m.deals.forEach(function (t) {
      if (!inBand(t.area, s.band)) return;
      var id = t.dong + "|" + t.apt;
      (byApt[id] = byApt[id] || { id: id, apt: t.apt, dong: t.dong, amounts: [], areas: [] }).amounts.push(t.amount);
      byApt[id].areas.push(t.area);
    });
  });
  s.apts = Object.keys(byApt).map(function (id) {
    var g = byApt[id];
    if (g.amounts.length < 3) return null;
    g.py = median(g.amounts) / median(g.areas) * 3.3058;
    return g;
  }).filter(Boolean).sort(function (a, b) { return b.py - a.py; });
  var sel = document.getElementById("cx-a" + i);
  sel.innerHTML = '<option value="">선택하세요 (' + s.apts.length + "단지)</option>";
  s.apts.forEach(function (g) {
    var o = document.createElement("option");
    o.value = g.id;
    o.textContent = g.apt + " · " + g.dong + " (평당 " + fmt(g.py) + "만)";
    sel.appendChild(o);
  });
}

function cmpSeries(s) {
  var p = s.apt.split("|");
  var saleArr = monthlyMedian(s.data.sale, p[1], p[0], s.band, "amount");
  var rentArr = monthlyMedian(s.data.rent, p[1], p[0], s.band, "deposit");
  return { name: lawdName(s.region) + " " + p[1] + " " + s.band + "㎡대", sale: saleArr, rent: rentArr,
           labels: s.data.months.map(function (ym) { return ym.slice(0, 4) + "." + Number(ym.slice(4)); }) };
}

function renderCmpx() {
  var active = CMP.slots.filter(function (s) { return s.data && s.apt; });
  if (active.length < 2) return;
  var series = active.map(cmpSeries);
  var labels = series[0].labels;

  /* 비교 표 + 해석 */
  var tb = document.querySelector("#cx-table tbody");
  var reads = [];
  tb.innerHTML = series.map(function (sr, i) {
    var vals = sr.sale.filter(function (v) { return v != null; });
    var first3 = median(sr.sale.slice(0, 6).filter(function (v) { return v != null; }));
    var last3 = median(sr.sale.slice(-6).filter(function (v) { return v != null; }));
    var rise = (first3 && last3) ? (last3 / first3 - 1) * 100 : null;
    var je = median(sr.rent.slice(-6).filter(function (v) { return v != null; }));
    var gap = (last3 != null && je != null) ? last3 - je : null;
    var slot = active[i];
    var py = last3 != null ? last3 / median(slot.apts.filter(function (g) { return g.id === slot.apt; })[0].areas) * 3.3058 : null;
    if (rise != null) reads.push("<b>" + sr.name + "</b>은 기간 상승률 " + pct(rise, 1) + (gap != null ? ", 현재 갭 " + eok(gap) : "") + "입니다.");
    return '<tr><td><span style="color:' + CMP_COLORS[i] + '">●</span> ' + sr.name + "</td>" +
      "<td>" + (py != null ? fmt(py) : "—") + "</td>" +
      "<td><b>" + (last3 != null ? eok(last3) : "—") + "</b></td>" +
      "<td>" + (je != null ? eok(je) : "—") + "</td>" +
      "<td>" + (gap != null ? eok(gap) : "—") + "</td>" +
      '<td class="' + cls(rise) + '">' + (rise != null ? pct(rise, 1) : "—") + "</td>" +
      "<td>" + vals.length + "개월</td></tr>";
  }).join("");
  document.getElementById("cx-resultcard").style.display = "";
  document.getElementById("cx-read").innerHTML = reads.join("<br>");

  /* 매매가 추이 */
  document.getElementById("cx-pricecard").style.display = "";
  if (chartCmpPrice) chartCmpPrice.destroy();
  chartCmpPrice = new Chart(document.getElementById("cx-price"), {
    type: "line",
    data: { labels: labels, datasets: series.map(function (sr, i) {
      return { label: sr.name, data: sr.sale, borderColor: CMP_COLORS[i], borderWidth: 2,
               pointRadius: 2, spanGaps: true, tension: .15 };
    })},
    options: chartOpts("만")
  });

  /* 배율 A÷B */
  var a = series[0], b = series[1];
  var mult = a.sale.map(function (v, i) {
    return (v != null && b.sale[i] != null && b.sale[i] !== 0) ? v / b.sale[i] : null;
  });
  var mVals = mult.filter(function (v) { return v != null; });
  if (mVals.length >= 6) {
    var cur = mVals[mVals.length - 1];
    var mean = mVals.reduce(function (x, y) { return x + y; }, 0) / mVals.length;
    var sorted = mVals.slice().sort(function (x, y) { return x - y; });
    var band = sorted.filter(function (v) { return v <= cur; }).length / sorted.length * 100;
    document.getElementById("cx-multkpi").innerHTML =
      statBox("현재 배율 (A÷B)", cur.toFixed(3)) +
      statBox("기간 평균", mean.toFixed(3)) +
      statBox("밴드 위치", band.toFixed(0) + "%", band <= 30 ? "up" : (band >= 70 ? "down" : "")) +
      statBox("평균 회귀 시 A", cur !== 0 ? pct((mean / cur - 1) * 100, 1) : "—");
    document.getElementById("cx-multcard").style.display = "";
    if (chartCmpMult) chartCmpMult.destroy();
    chartCmpMult = new Chart(document.getElementById("cx-mult"), {
      type: "line",
      data: { labels: labels, datasets: [{ label: "배율 (A÷B)", data: mult, borderColor: CMP_COLORS[0],
        borderWidth: 2, pointRadius: 2, spanGaps: true, tension: .15 }] },
      options: chartOpts("x"),
      plugins: [{
        id: "meanline",
        beforeDatasetsDraw: function (ch) {
          var y = ch.scales.y.getPixelForValue(mean), ar = ch.chartArea, ctx = ch.ctx;
          if (y < ar.top || y > ar.bottom) return;
          ctx.save(); ctx.strokeStyle = "#c47f17"; ctx.setLineDash([5, 4]); ctx.lineWidth = 1;
          ctx.beginPath(); ctx.moveTo(ar.left, y); ctx.lineTo(ar.right, y); ctx.stroke(); ctx.restore();
        }
      }]
    });
  } else {
    document.getElementById("cx-multcard").style.display = "none";
  }

  /* 갭 추이 */
  document.getElementById("cx-gapcard").style.display = "";
  if (chartCmpGap) chartCmpGap.destroy();
  chartCmpGap = new Chart(document.getElementById("cx-gap"), {
    type: "line",
    data: { labels: labels, datasets: series.map(function (sr, i) {
      var gap = sr.sale.map(function (v, t) {
        return (v != null && sr.rent[t] != null) ? v - sr.rent[t] : null;
      });
      return { label: sr.name + " 갭", data: gap, borderColor: CMP_COLORS[i], borderWidth: 1.5,
               borderDash: [4, 3], pointRadius: 2, spanGaps: true, tension: .15 };
    })},
    options: chartOpts("만")
  });
}

/* 핀 데이터 생성 (지도 SDK와 분리 — 테스트 가능) */
function mapPinData(scope) {
  if (!DB || !RANKED.length) return [];
  var cond = getCond();
  var rows = RANKED.filter(function (k) {
    if (!COORDS[k]) return false;
    if (scope === "metro") return METRO[k];
    if (scope === "seoul") return k.indexOf("강북14개구") === 0 || k.indexOf("강남11개구") === 0;
    return true;
  }).map(function (k) {
    var pm = lastVal("salePm", k), jpm = lastVal("jeonsePm", k);
    return { key: k, lat: COORDS[k][0], lng: COORDS[k][1], pm: pm,
             price: pm * cond.area, jr: (pm && jpm) ? jpm / pm * 100 : null,
             rank: RANKED.indexOf(k) + 1 };
  });
  /* 분위 색: 표시 지역들 안에서의 가격 순위 기반 */
  var sorted = rows.slice().sort(function (a, b) { return b.pm - a.pm; });
  rows.forEach(function (r) {
    var p = sorted.indexOf(r) / Math.max(1, sorted.length - 1);   /* 0=최고가 */
    r.light = 20 + p * 52;   /* HSL 밝기: 진할수록 비쌈 */
  });
  return rows;
}

function kakaoReady(cb) {
  var key = kakaoKey();
  if (!key) return false;
  if (window.kakao && window.kakao.maps && MAPX.sdkLoaded) { cb(); return true; }
  var s = document.createElement("script");
  s.src = "https://dapi.kakao.com/v2/maps/sdk.js?appkey=" + encodeURIComponent(key) + "&autoload=false";
  s.onload = function () { window.kakao.maps.load(function () { MAPX.sdkLoaded = true; cb(); }); };
  s.onerror = function () {
    alert("카카오맵 SDK 로드 실패 — 키가 올바른지, 카카오 콘솔 플랫폼(Web)에 이 도메인이 등록됐는지 확인하세요.");
  };
  document.head.appendChild(s);
  return true;
}

function renderMapx() {
  var key = kakaoKey();
  if (!key) {
    document.getElementById("mx-keycard").style.display = "";
    document.getElementById("mx-mapcard").style.display = "none";

  document.getElementById("mx-keycard").style.display = "none";

  var kr = document.getElementById("mx-keyreset");

function drawMapPins() {
  if (!MAPX.map || !DB) return;
  MAPX.overlays.forEach(function (o) { o.setMap(null); });
  MAPX.overlays = [];
  var rows = mapPinData(MAPX.scope);
  var centers = { metro: [37.45, 127.0, 10], all: [36.4, 127.8, 13], seoul: [37.552, 126.99, 8] };
  var c = centers[MAPX.scope];
  MAPX.map.setCenter(new kakao.maps.LatLng(c[0], c[1]));
  MAPX.map.setLevel(c[2]);
  rows.forEach(function (r) {
    var el = document.createElement("div");
    var val = MAPX.metric === "price" ? eok(r.price) : (r.jr != null ? r.jr.toFixed(0) + "%" : "—");
    el.style.cssText = "background:hsl(40,45%," + Math.min(60, r.light) + "%);color:#10131a;font:600 10px Pretendard Variable,sans-serif;" +
      "padding:3px 7px;border-radius:7px;white-space:nowrap;box-shadow:0 1px 4px rgba(0,0,0,.25);cursor:pointer;text-align:center;line-height:1.3";
    el.innerHTML = "<b>" + val + "</b><br><span style='font-weight:500;opacity:.9'>" + disp(r.key).split(" ").pop() + "</span>";
    el.addEventListener("click", function () { showMapDetail(r.key); });
    var ov = new kakao.maps.CustomOverlay({
      position: new kakao.maps.LatLng(r.lat, r.lng), content: el, yAnchor: 1, clickable: true
    });
    ov.setMap(MAPX.map);
    MAPX.overlays.push(ov);
  });
}

/* 탭에 들어오면 자동 조회 — 참고 앱처럼 전국 집계가 기본 */
function autoLoadSupply() {
