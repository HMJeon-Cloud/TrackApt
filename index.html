<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="TrackApt — KB 시계열로 보는 전국 아파트 가격 서열과 투자 타이밍">
<title>TrackApt</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --bg:#f7f8fa; --panel:#ffffff; --ink:#1c2430; --ink-soft:#5b6675;
  --line:#e3e7ee; --brand:#0f4c5c; --up:#0e7c66; --down:#c47f17;
  --miss:#98a1ad; --cash:#e2571b; --radius:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px}
body{font-family:"Pretendard Variable",Pretendard,-apple-system,system-ui,sans-serif;
  background:var(--bg);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased}
header{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line);
  padding:calc(env(safe-area-inset-top) + 10px) 16px 0}
.brand{display:flex;align-items:baseline;gap:8px;padding-bottom:8px}
.brand h1{font-size:1.15rem;font-weight:800;letter-spacing:-.02em}
.brand h1 .accent{color:var(--brand)}
.brand .ver{font-size:.72rem;color:var(--ink-soft);font-weight:600}
nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:none;border:1px solid var(--line);background:var(--bg);color:var(--ink-soft);
  font:inherit;font-size:.82rem;font-weight:600;padding:7px 13px;border-radius:999px;cursor:pointer;white-space:nowrap}
nav button.on{background:var(--brand);border-color:var(--brand);color:#fff}
nav button:focus-visible,.seg button:focus-visible{outline:2px solid var(--cash);outline-offset:2px}
main{max-width:860px;margin:0 auto;padding:16px 16px calc(env(safe-area-inset-bottom) + 48px)}
section.tab{display:none} section.tab.on{display:block}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px 16px;margin-bottom:14px}
.card h2{font-size:1rem;font-weight:800;letter-spacing:-.01em;margin-bottom:4px}
.card .eyebrow{font-size:.68rem;font-weight:700;letter-spacing:.14em;color:var(--brand);text-transform:uppercase;margin-bottom:6px}
.card p.desc{font-size:.85rem;color:var(--ink-soft);margin-bottom:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px 12px}
.field{display:flex;flex-direction:column;gap:4px}
.field.full{grid-column:1 / -1}
.field label{font-size:.76rem;font-weight:700;color:var(--ink-soft)}
.field input,.field select,.field textarea{font:inherit;font-size:.92rem;padding:9px 10px;border:1px solid var(--line);
  border-radius:8px;background:#fff;color:var(--ink);width:100%}
.field textarea{min-height:120px;line-height:1.6;font-size:.84rem}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--brand);outline-offset:-1px;border-color:var(--brand)}
.check{display:flex;align-items:center;gap:8px;font-size:.88rem;font-weight:600}
.check input{width:18px;height:18px;accent-color:var(--brand)}
.btn{font:inherit;font-weight:700;font-size:.92rem;border:0;border-radius:10px;padding:12px 16px;
  cursor:pointer;background:var(--brand);color:#fff;width:100%}
.btn.ghost{background:#fff;color:var(--brand);border:1.5px solid var(--brand)}
.btnrow{display:flex;gap:10px;margin-top:12px}
.hint{font-size:.76rem;color:var(--ink-soft);margin-top:8px}
.status{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:var(--bg);border-radius:8px;padding:10px 12px}
.stat .k{font-size:.72rem;color:var(--ink-soft);font-weight:600}
.stat .v{font-size:1.05rem;font-weight:800;letter-spacing:-.01em}
.stat .v.up{color:var(--up)} .stat .v.down{color:var(--down)}
.badge{display:inline-block;font-size:.7rem;font-weight:700;padding:2px 8px;border-radius:999px}
.badge.ok{background:#e4f3ef;color:var(--up)} .badge.err{background:#fbeee0;color:var(--down)}
.placeholder{border:1.5px dashed var(--line);border-radius:var(--radius);padding:28px 16px;
  text-align:center;color:var(--miss);font-size:.85rem;margin-bottom:14px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{font:inherit;font-size:.8rem;font-weight:600;padding:7px 12px;border:0;background:#fff;
  color:var(--ink-soft);cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--brand);color:#fff}
.chartbox{position:relative;height:280px}
.tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:.84rem;white-space:nowrap}
th{font-size:.74rem;color:var(--ink-soft);font-weight:700;text-align:right;padding:7px 10px;border-bottom:1.5px solid var(--line)}
th:first-child,td:first-child{text-align:left}
th:nth-child(2),td:nth-child(2){text-align:left}
td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
td.up{color:var(--up);font-weight:600} td.down{color:var(--down);font-weight:600} td.flat{color:var(--miss)}
tr.hit td{background:#f0f8f5}
tr.hit td:first-child{border-left:3px solid var(--up)}
tr:last-child td{border-bottom:0}
.note{background:var(--bg);border-radius:8px;padding:12px;font-size:.8rem;color:var(--ink-soft);margin-top:12px;line-height:1.6}
.note b{color:var(--ink)}
.callout{border-left:4px solid var(--up);background:#f0f8f5;border-radius:8px;padding:12px 14px;
  font-size:.9rem;margin-bottom:12px;line-height:1.6}
.callout.warn{border-color:var(--down);background:#fbf4e8}
.callout b{font-weight:800}
@media (max-width:480px){ html{font-size:15px} .chartbox{height:240px} .grid3{grid-template-columns:1fr 1fr} }
@media (prefers-reduced-motion:reduce){ *{transition:none!important;animation:none!important} }
</style>
</head>
<body>

<header>
  <div class="brand">
    <h1>Track<span class="accent">Apt</span></h1>
    <span class="ver">v0.4</span>
  </div>
  <nav id="nav" aria-label="주요 메뉴"></nav>
</header>

<main id="main"></main>

<footer style="max-width:860px;margin:0 auto;padding:0 16px 40px;font-size:.72rem;color:var(--miss);line-height:1.7">
  TrackApt는 KB부동산 월간 시계열 등 공개 통계를 계산해 보여주는 정보 제공 도구이며 투자 자문이 아닙니다.
  통계는 표본조사 기반이라 실제 거래가와 다를 수 있고, 대출·세금 규정은 수시로 바뀝니다.
  실행 전 반드시 은행·세무 전문가와 확인하세요. 모든 판단의 책임은 이용자 본인에게 있습니다.
</footer>

<script>
"use strict";

var DB = null;
var LS_COND = "trackapt_cond_v1";
var LS_RULES = "trackapt_rules_v1";
var MK = { region: "전국", span: "all" };
var chartAnnual = null, chartIndex = null, chartRank = null;
var RANKED = [];   // 급지표 대상 지역 키 (서열 내림차순)
var METRO = {};    // 수도권 여부

/* ── 대출·세금 기준 기본값 (기준·설정 탭에서 수정 가능) ── */
var DEFAULT_RULES = {
  ltvReg: 40,          // 규제지역 LTV %
  ltvFree: 70,         // 비규제지역 LTV %
  ltvFirstLocal: 80,   // 생애최초 · 비수도권 LTV %
  ltvMulti: 60,        // 추가매수 · 비규제 LTV % (수도권·규제는 0)
  capT1: 60000, capT1Lim: 150000,   // 15억 이하 → 상한 6억
  capT2: 40000, capT2Lim: 250000,   // 15~25억 → 상한 4억
  capT3: 20000,                      // 25억 초과 → 상한 2억
  dsr: 40,             // DSR %
  stress: 1.5,         // 스트레스 가산 %p
  loanYears: 30,       // 대출 만기 (년)
  acq2Reg: 8,          // 조정지역 2주택 취득세 %
  acq3Reg: 12,         // 조정지역 3주택 이상 취득세 %
  broker: 0.4,         // 중개보수 요율 %
  etcRate: 0.3,        // 등기 등 부대비용 요율 %
  etcFixed: 300,       // 이사 등 고정비 (만원)
  regulated: [
    "강북14개구|강북구","강북14개구|광진구","강북14개구|노원구","강북14개구|도봉구",
    "강북14개구|동대문구","강북14개구|마포구","강북14개구|서대문구","강북14개구|성동구",
    "강북14개구|성북구","강북14개구|용산구","강북14개구|은평구","강북14개구|종로구",
    "강북14개구|중구","강북14개구|중랑구",
    "강남11개구|강남구","강남11개구|강동구","강남11개구|강서구","강남11개구|관악구",
    "강남11개구|구로구","강남11개구|금천구","강남11개구|동작구","강남11개구|서초구",
    "강남11개구|송파구","강남11개구|양천구","강남11개구|영등포구",
    "과천시","광명시","성남시|분당구","성남시|수정구","성남시|중원구",
    "수원시|영통구","수원시|장안구","수원시|팔달구","안양시|동안구",
    "용인시|수지구","의왕시","하남시"
  ]
};
var RULES = JSON.parse(JSON.stringify(DEFAULT_RULES));

var TABS = [
  { id: "start",   name: "시작",        build: buildStart },
  { id: "market",  name: "시장 현황",   build: buildMarket },
  { id: "rank",    name: "전국 급지표", build: buildRank },
  { id: "gap",     name: "갭투자",      build: null },
  { id: "move",    name: "갈아타기",    build: null },
  { id: "reco",    name: "맞춤 추천",   build: null },
  { id: "danji",   name: "단지 찾기",   build: null },
  { id: "setting", name: "기준·설정",   build: buildSetting }
];

document.addEventListener("DOMContentLoaded", function () {
  loadRules();
  var nav = document.getElementById("nav");
  var main = document.getElementById("main");
  TABS.forEach(function (t) {
    var b = document.createElement("button");
    b.textContent = t.name; b.dataset.tab = t.id;
    b.addEventListener("click", function () { showTab(t.id); });
    nav.appendChild(b);
    var s = document.createElement("section");
    s.className = "tab"; s.id = "tab-" + t.id;
    if (t.build) t.build(s);
    else s.innerHTML = '<div class="placeholder">「' + t.name + '」 화면은 다음 버전에서 구현됩니다.</div>';
    main.appendChild(s);
  });
  showTab("start");
  loadData();
});

function showTab(id) {
  document.querySelectorAll("nav button").forEach(function (b) { b.classList.toggle("on", b.dataset.tab === id); });
  document.querySelectorAll("section.tab").forEach(function (s) { s.classList.toggle("on", s.id === "tab-" + id); });
  if (!DB) return;
  if (id === "market") renderMarket();
  if (id === "rank") renderRank();
}

/* ══ 시작 탭 ══════════════════════════════════ */
function buildStart(root) {
  root.innerHTML =
    '<div class="card">' +
      '<div class="eyebrow">My Condition</div><h2>내 조건</h2>' +
      '<p class="desc">여기 값이 모든 탭의 계산에 쓰입니다. 금액 단위는 <b>만원</b>입니다.</p>' +
      '<div class="grid">' +
        '<div class="field"><label for="f-cash">동원 가능 현금 (만원)</label><input id="f-cash" type="number" inputmode="numeric" placeholder="예: 30000"></div>' +
        '<div class="field"><label for="f-area">기준 전용면적</label><select id="f-area">' +
          '<option value="36">36㎡ · 14평형</option><option value="46">46㎡ · 18평형</option>' +
          '<option value="59">59㎡ · 24평형</option><option value="84" selected>84㎡ · 34평형</option>' +
          '<option value="101">101㎡ · 40평형</option></select></div>' +
        '<div class="field full"><label for="f-home">지금 사는 지역</label><select id="f-home"><option value="">데이터 로드 중…</option></select></div>' +
        '<div class="field"><label for="f-income">연소득 (만원 · DSR용)</label><input id="f-income" type="number" inputmode="numeric" placeholder="0이면 미적용"></div>' +
        '<div class="field"><label for="f-rate">주담대 금리 (%)</label><input id="f-rate" type="number" step="0.1" inputmode="decimal" placeholder="예: 4.0"></div>' +
        '<div class="field"><label for="f-own">보유 주택 상태</label><select id="f-own">' +
          '<option value="none" selected>무주택</option><option value="switch">1주택 · 갈아타기 (기존 처분)</option>' +
          '<option value="add">1주택 · 추가 매수 (유지)</option><option value="multi">2주택 이상</option></select></div>' +
        '<div class="field"><label>&nbsp;</label><label class="check"><input type="checkbox" id="f-first"> 생애최초 구입</label></div>' +
      '</div>' +
      '<p class="hint" id="save-hint">값은 이 브라우저에만 저장됩니다.</p>' +
    '</div>' +
    '<div class="card">' +
      '<div class="eyebrow">Data</div>' +
      '<h2>데이터 상태 <span id="data-badge" class="badge err">로드 중</span></h2>' +
      '<p class="desc">KB부동산 월간 시계열이 정상적으로 붙었는지 확인하는 패널입니다.</p>' +
      '<div class="status" id="data-status"></div>' +
    '</div>';
  ["f-cash","f-area","f-home","f-income","f-rate","f-own","f-first"].forEach(function (id) {
    root.querySelector("#" + id).addEventListener("change", saveCond);
  });
}

function getCond() {
  return {
    cash:   Number(val("f-cash")) || 0,
    area:   Number(val("f-area")) || 84,
    home:   val("f-home"),
    income: Number(val("f-income")) || 0,
    rate:   Number(val("f-rate")) || 4.0,
    own:    val("f-own") || "none",
    first:  !!(document.getElementById("f-first") && document.getElementById("f-first").checked)
  };
}
function saveCond() {
  var c = getCond();
  try { localStorage.setItem(LS_COND, JSON.stringify(c)); } catch (e) {}
  var h = document.getElementById("save-hint");
  if (h) h.textContent = "저장됨 · 값은 이 브라우저에만 보관됩니다.";
}
function restoreCond() {
  var raw = null;
  try { raw = localStorage.getItem(LS_COND); } catch (e) {}
  if (!raw) return;
  try {
    var c = JSON.parse(raw);
    setVal("f-cash", c.cash); setVal("f-area", c.area); setVal("f-home", c.home);
    setVal("f-income", c.income); setVal("f-rate", c.rate); setVal("f-own", c.own);
    var f = document.getElementById("f-first"); if (f) f.checked = !!c.first;
  } catch (e) {}
}
function val(id) { var el = document.getElementById(id); return el ? el.value : ""; }
function setVal(id, v) { var el = document.getElementById(id); if (el && v != null && v !== "") el.value = v; }

/* ══ 데이터 유틸 ═════════════════════════════ */
function loadData() {
  fetch("kb_data.json")
    .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .then(function (j) { DB = j; onDataReady(); })
    .catch(function (e) {
      var b = document.getElementById("data-badge");
      if (b) { b.className = "badge err"; b.textContent = "로드 실패"; }
      var s = document.getElementById("data-status");
      if (s) s.innerHTML = '<div class="stat" style="grid-column:1/-1"><div class="k">원인</div>' +
        '<div class="v" style="font-size:.85rem;font-weight:600">kb_data.json을 찾지 못했습니다 (' + e.message + ').</div></div>';
    });
}
function ymNum(ym) { var p = ym.split("-"); return Number(p[0]) * 12 + Number(p[1]); }
function getVal(key, region, y, m) {
  var blk = DB[key]; if (!blk) return null;
  var s = blk.series[region]; if (!s) return null;
  var i = (y * 12 + m) - ymNum(blk.dates[0]) - s.o;
  return (i >= 0 && i < s.v.length) ? s.v[i] : null;
}
function lastVal(key, region) {
  var s = DB[key].series[region]; if (!s) return null;
  return s.v[s.v.length - 1];
}
function decVal(key, region, y) {
  var e = DB[key].dates[1].split("-");
  if (y === Number(e[0])) return getVal(key, region, y, Number(e[1]));
  return getVal(key, region, y, 12);
}
function latestYM(key) { var e = DB[key].dates[1].split("-"); return [Number(e[0]), Number(e[1])]; }
function seriesStartYM(key, region) {
  var blk = DB[key]; var s = blk.series[region]; if (!s) return null;
  var n = ymNum(blk.dates[0]) + s.o;
  return [Math.floor((n - 1) / 12), ((n - 1) % 12) + 1];
}
function disp(k) { return k.replace("|", " "); }
function fmt(n) { return Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ","); }
function eok(n) { return (n / 10000).toFixed(n >= 100000 ? 0 : 1) + "억"; }
function pct(v, digits) {
  if (v == null) return "—";
  var d = digits == null ? 1 : digits;
  return (v > 0 ? "+" : "") + v.toFixed(d) + "%";
}
function cls(v) { return v == null ? "flat" : (v > 0.05 ? "up" : (v < -0.05 ? "down" : "flat")); }

function onDataReady() {
  var badge = document.getElementById("data-badge");
  badge.className = "badge ok"; badge.textContent = "정상";

  /* 급지표 대상 지역: 집계 지역·상위 시 제외, ㎡당가 내림차순 */
  var keys = Object.keys(DB.salePm.series);
  var parents = {};
  keys.forEach(function (k) { if (k.indexOf("|") >= 0) parents[k.split("|")[0]] = true; });
  var AGG = { "전국":1, "서울특별시":1, "6개광역시":1, "5개광역시":1, "수도권":1,
              "기타지방":1, "경기도":1, "전남광주 통합특별시":1 };
  RANKED = keys.filter(function (k) {
    if (AGG[k]) return false;
    if (k.indexOf("|") < 0 && parents[k]) return false;
    return true;
  }).sort(function (a, b) { return lastVal("salePm", b) - lastVal("salePm", a); });

  /* 수도권 판정: 서울 구 + 인천 + 경기 (salePm 키 순서상 경기도~강원 사이) */
  var inGyeonggi = false;
  keys.forEach(function (k) {
    if (k === "경기도") { inGyeonggi = true; return; }
    if (k === "강원특별자치도") { inGyeonggi = false; }
    var top = k.split("|")[0];
    METRO[k] = (top === "강북14개구" || top === "강남11개구" || top === "인천광역시" || inGyeonggi);
  });

  /* 지역 셀렉트: 내 조건(㎡당가 지역) · 시장 현황(지수 지역) */
  var sel = document.getElementById("f-home");
  sel.innerHTML = '<option value="">선택하세요</option>';
  keys.forEach(function (k) {
    var o = document.createElement("option");

function statBox(k, v, c) {

/* ══ 자금 계산 (모든 탭 공용) ═════════════════ */
function isRegulated(region) { return RULES.regulated.indexOf(region) >= 0; }

/* price(만원)와 지역·내 조건으로 대출가능액과 필요현금 산출 */
function finance(region, price, cond) {
  var reg = isRegulated(region), metro = !!METRO[region];
  var own = cond.own;

  /* 1) LTV */
  var ltv;
  if (own === "add" || own === "multi") {
    ltv = (reg || metro) ? 0 : RULES.ltvMulti;   // 수도권·규제 추가매수는 주담대 금지
  } else {
    ltv = reg ? RULES.ltvReg : RULES.ltvFree;
    if (cond.first && !metro && !reg) ltv = Math.max(ltv, RULES.ltvFirstLocal);
  }
  var ltvAmt = price * ltv / 100;

  /* 2) 총액 상한 (수도권 또는 규제지역) */
  var capAmt = Infinity;
  if ((metro || reg) && ltv > 0) {
    capAmt = price <= RULES.capT1Lim ? RULES.capT1 : (price <= RULES.capT2Lim ? RULES.capT2 : RULES.capT3);
  }

  /* 3) DSR (연소득 0이면 미적용) */
  var dsrAmt = Infinity;
  if (cond.income > 0 && ltv > 0) {
    var r = (cond.rate + RULES.stress) / 100 / 12;
    var n = RULES.loanYears * 12;
    var pay = cond.income * RULES.dsr / 100 / 12;
    dsrAmt = r > 0 ? pay * (1 - Math.pow(1 + r, -n)) / r : pay * n;
  }

  var loan = Math.min(ltvAmt, capAmt, dsrAmt);
  var tag = loan === ltvAmt ? "LTV " + ltv + "%" : (loan === capAmt ? "총액상한" : "DSR");
  if (ltv === 0) { loan = 0; tag = "대출불가"; }

  /* 4) 취득세 */
  var acqRate;
  if ((own === "add") && reg) acqRate = RULES.acq2Reg;
  else if (own === "multi" && reg) acqRate = RULES.acq3Reg;
  else if (own === "multi") acqRate = RULES.acq2Reg;   // 비규제 3주택도 중과(기본 8%)
  else acqRate = price <= 60000 ? 1 : (price >= 90000 ? 3 : (price * 2 / 30000 - 3));
  var acq = price * acqRate / 100;

  /* 5) 부대비용 */
  var broker = price * RULES.broker / 100;
  var etc = price * RULES.etcRate / 100 + RULES.etcFixed;

  return { price: price, loan: loan, tag: tag, acq: acq, broker: broker, etc: etc,
           need: price - loan + acq + broker + etc, reg: reg, metro: metro };
}

function buildRank(root) {
  root.innerHTML =

      '<div class="eyebrow">Ranking</div><h2>전국 급지표 · 첫 집 서열</h2>' +

        '필요현금이 <b>내 현금에 닿는 가장 위쪽 지역</b>을 찾습니다. 규제지역은 ⛔ 표시됩니다.</p>' +

      '<p class="desc">막대가 필요현금, 주황 점선이 내 현금입니다. 점선보다 짧은 청록 막대가 살 수 있는 곳이고, ' +

      '</thead><tbody></tbody></table></div>' +
      '<div class="note"><b>필요현금</b> = 매수가 − 대출가능액 + 취득세 + 중개보수 + 등기·이사비. ' +
        '매수가는 그 지역 ㎡당 평균가 × 기준 전용면적이라 <b>지역 평균 기준</b>입니다 — 대장 단지는 이보다 30~50% 비쌀 수 있습니다. ' +
        '대출 꼬리표는 LTV·총액상한·DSR 중 가장 낮은 값이 무엇이었는지 보여줍니다. ' +
        '기준값은 기준·설정 탭에서 바꿀 수 있습니다.</div></div>';
}

function renderRank() {
  if (!DB || !RANKED.length) return;
  var cond = getCond();
  var area = cond.area;
  var rows = RANKED.map(function (k, i) {
    var pm = lastVal("salePm", k);
    var jpm = lastVal("jeonsePm", k);
    var f = finance(k, pm * area, cond);
    f.key = k; f.rank = i + 1; f.pm = pm;
    f.jr = (jpm && pm) ? jpm / pm * 100 : null;
    return f;
  });

  var cash = cond.cash;
  var hits = cash > 0 ? rows.filter(function (r) { return r.need <= cash; }) : [];
  var top = hits.length ? hits[0] : null;

  /* 콜아웃 + KPI */
  var co = document.getElementById("rk-callout");
  if (cash <= 0) {
    co.innerHTML = '<div class="callout warn">시작 탭에서 <b>동원 가능 현금</b>을 입력하면 내 서열 위치가 표시됩니다.</div>';
  } else if (top) {
    co.innerHTML = '<div class="callout">내 현금 <b>' + eok(cash) + '</b>으로 닿는 최상위 — ' +
      '<b>' + disp(top.key) + '</b> (서열 ' + top.rank + '위 / ' + RANKED.length + '곳' +
      (top.reg ? " · ⛔규제" : "") + ')<br>매수가 ' + eok(top.price) + ' · 대출 ' + eok(top.loan) +
      ' (' + top.tag + ') · 필요현금 <b>' + eok(top.need) + "</b></div>";
  } else {
    var min = rows.reduce(function (a, b) { return a.need < b.need ? a : b; });
    co.innerHTML = '<div class="callout warn">현재 조건으로는 예산 안에 들어오는 지역이 없습니다. ' +
      '최저 필요현금은 <b>' + disp(min.key) + " " + eok(min.need) + "</b>입니다. 평형을 낮추거나 현금·소득 조건을 조정해보세요.</div>";
  }
  var k = "";
  k += statBox("기준 면적", area + "㎡");
  k += statBox("예산 내 지역", cash > 0 ? hits.length + "곳" : "—", hits.length ? "up" : "");
  k += statBox("보유 상태", { none: "무주택", switch: "갈아타기", add: "추가매수", multi: "다주택" }[cond.own] + (cond.first ? " · 생애최초" : ""));
  k += statBox("규제지역 수", RULES.regulated.length + "곳");
  document.getElementById("rk-kpi").innerHTML = k;

  /* 사다리 차트: 지역 수만큼 높이 확보 */
  var css = getComputedStyle(document.documentElement);
  var cUp = css.getPropertyValue("--up").trim(), cMiss = "#c9d0d9",
      cCash = css.getPropertyValue("--cash").trim();
  var canvas = document.getElementById("rk-chart");
  canvas.parentElement.style.height = (rows.length * 21 + 60) + "px";
  var cashLine = {
    id: "cashLine",
    afterDatasetsDraw: function (chart) {
      if (!(cash > 0)) return;
      var x = chart.scales.x.getPixelForValue(cash);
      var ctx = chart.ctx, a = chart.chartArea;
      if (x < a.left || x > a.right) return;
      ctx.save();
      ctx.strokeStyle = cCash; ctx.lineWidth = 1.5; ctx.setLineDash([5, 4]);
      ctx.beginPath(); ctx.moveTo(x, a.top); ctx.lineTo(x, a.bottom); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = cCash; ctx.font = "700 10px Pretendard Variable";
      ctx.fillText("내 현금 " + eok(cash), Math.min(x + 4, a.right - 70), a.top + 10);
      ctx.restore();
    }
  };
  if (chartRank) chartRank.destroy();
  chartRank = new Chart(canvas, {
    type: "bar",
    data: {
      labels: rows.map(function (r) { return (r.reg ? "⛔" : "") + disp(r.key); }),
      datasets: [{
        label: "필요현금",
        data: rows.map(function (r) { return r.need; }),
        backgroundColor: rows.map(function (r) { return (cash > 0 && r.need <= cash) ? cUp : cMiss; }),
        borderRadius: 2, barThickness: 12
      }]
    },
    options: {
      indexAxis: "y", responsive: true, maintainAspectRatio: false, animation: false,
      plugins: {
        legend: { display: false },
        tooltip: { callbacks: { label: function (c) {
          var r = rows[c.dataIndex];
          return ["필요현금 " + eok(r.need), "매수가 " + eok(r.price), "대출 " + eok(r.loan) + " (" + r.tag + ")"];
        } } }
      },
      scales: {
        x: { position: "top", ticks: { font: { size: 10 }, callback: function (v) { return eok(v); } }, grid: { color: "#eef1f5" } },
        y: { ticks: { font: { size: 10 }, autoSkip: false }, grid: { display: false } }
      }
    },
    plugins: [cashLine]
  });

  /* 급지표 표 */
  var tb = document.querySelector("#rk-table tbody");
  tb.innerHTML = rows.map(function (r) {
    var hit = cash > 0 && r.need <= cash;
    return '<tr class="' + (hit ? "hit" : "") + '"><td>' + r.rank + "</td>" +
      "<td>" + (r.reg ? "⛔ " : "") + disp(r.key) + "</td>" +
      "<td>" + fmt(r.pm) + "</td>" +
      "<td>" + eok(r.price) + "</td>" +
      "<td>" + (r.loan > 0 ? eok(r.loan) : "—") + "</td>" +
      "<td><b>" + eok(r.need) + "</b></td>" +
      "<td>" + r.tag + "</td>" +
      '<td class="' + (r.jr != null && r.jr >= 70 ? "up" : "") + '">' + (r.jr != null ? r.jr.toFixed(1) + "%" : "—") + "</td></tr>";
  }).join("");
}

/* ══ 기준·설정 탭 ═════════════════════════════ */
function loadRules() {
  var raw = null;

    Object.keys(DEFAULT_RULES).forEach(function (k) { if (r[k] != null) RULES[k] = r[k]; });
  } catch (e) {}
}

      '<div class="tblwrap"><table id="mk-table2"><thead><tr>' +
      '<th>구간</th><th>매매 2년</th><th>산술합</th><th>전세 2년</th><th>매매−전세</th></tr></thead><tbody></tbody></table></div>' +
      '<div class="note"><b>왜 두 값이 다른가</b> — 1년차 +20%, 2년차 −10%면 산술합은 +10%지만 ' +
        '실제 누적은 1.20 × 0.90 − 1 = <b>+8%</b>입니다. 변동이 클수록 산술합이 부풀려집니다. ' +
        '장기 성과는 복리 기준으로 읽으세요.</div>' +
      '<div class="note">KB 지수는 표본조사 기반이라 실거래 평균가와 다르며, 표본 개편 시점(2022.11 · 2026.4 등)의 ' +
        '단절이 일부 포함될 수 있습니다. 연도 값은 12월 기준이고 마지막 해는 최신월 기준입니다.</div></div>';

  root.querySelector("#mk-region").addEventListener("change", function () {
    MK.region = this.value; renderMarket();
  });
  root.querySelectorAll("#mk-span button").forEach(function (b) {
    b.addEventListener("click", function () {
      MK.span = b.dataset.s;
      root.querySelectorAll("#mk-span button").forEach(function (x) { x.classList.toggle("on", x === b); });
      renderMarket();
    });
  });
}

function annualRows(region) {
  var e = latestYM("sale");
  var start = seriesStartYM("sale", region);
  if (!start) return [];
  var rows = [];
  for (var y = start[0] + 1; y <= e[0]; y++) {
    var s0 = decVal("sale", region, y - 1), s1 = decVal("sale", region, y);
    var j0 = decVal("jeonse", region, y - 1), j1 = decVal("jeonse", region, y);
    var r = { y: y,
      sale:   (s0 && s1) ? (s1 / s0 - 1) * 100 : null,
      jeonse: (j0 && j1) ? (j1 / j0 - 1) * 100 : null,
      saleIdx: s1, jeonseIdx: j1 };
    if (r.sale != null || r.jeonse != null) rows.push(r);
  }
  return rows;
}

function renderMarket() {
  if (!DB) return;
  var region = MK.region;
  var e = latestYM("sale");
  var rows = annualRows(region);
  if (MK.span !== "all") {
    var nSpan = Number(MK.span);
    rows = rows.filter(function (r) { return r.y > e[0] - nSpan; });
  }
  if (!rows.length) return;

  var start = seriesStartYM("sale", region);
  var firstY = rows[0].y, lastY = rows[rows.length - 1].y;
  var months = (MK.span === "all")
    ? (e[0] * 12 + e[1]) - (start[0] * 12 + start[1])
    : Number(MK.span) * 12;
  var sN = getVal("sale", region, e[0], e[1]);
  var s0m = (e[0] * 12 + e[1]) - months;
  var s0 = getVal("sale", region, Math.floor((s0m - 1) / 12), ((s0m - 1) % 12) + 1);
  var jN = getVal("jeonse", region, e[0], e[1]);
  var j0 = getVal("jeonse", region, Math.floor((s0m - 1) / 12), ((s0m - 1) % 12) + 1);
  var yrs = months / 12;
  var cagrS = (s0 && sN) ? (Math.pow(sN / s0, 1 / yrs) - 1) * 100 : null;
  var cagrJ = (j0 && jN) ? (Math.pow(jN / j0, 1 / yrs) - 1) * 100 : null;
  var cumS = (s0 && sN) ? (sN / s0 - 1) * 100 : null;
  var k = "";
  k += statBox("조사 시작", start[0] + "." + start[1]);
  k += statBox("구간 누적 (매매)", cumS != null ? pct(cumS, 1) : "—", cls(cumS));
  k += statBox("연복리 (매매)", cagrS != null ? pct(cagrS, 2) + "/년" : "—", cls(cagrS));
  k += statBox("연복리 (전세)", cagrJ != null ? pct(cagrJ, 2) + "/년" : "—", cls(cagrJ));
  document.getElementById("mk-kpi").innerHTML = k;

  var labels = rows.map(function (r) { return String(r.y); });
  var css = getComputedStyle(document.documentElement);
  var cUp = css.getPropertyValue("--up").trim(), cDown = css.getPropertyValue("--down").trim();
  var cBrand = css.getPropertyValue("--brand").trim();
  if (chartAnnual) chartAnnual.destroy();
  chartAnnual = new Chart(document.getElementById("mk-annual"), {
    data: {
      labels: labels,
      datasets: [
        { type: "bar", label: "매매", data: rows.map(function (r) { return r.sale; }),
          backgroundColor: rows.map(function (r) { return (r.sale != null && r.sale < 0) ? cDown : cUp; }),
          borderRadius: 3, order: 2 },
        { type: "line", label: "전세", data: rows.map(function (r) { return r.jeonse; }),
          borderColor: cBrand, backgroundColor: cBrand, borderWidth: 2,
          pointRadius: rows.length > 25 ? 0 : 2.5, tension: .25, order: 1 }
      ]
    },
    options: chartOpts("%")
  });

  var startM = (e[0] * 12 + e[1]) - months;
  var mLabels = [], mSale = [], mJeon = [];
  for (var t = startM; t <= e[0] * 12 + e[1]; t++) {
    var yy = Math.floor((t - 1) / 12), mm = ((t - 1) % 12) + 1;
    mLabels.push(yy + "." + mm);
    mSale.push(getVal("sale", region, yy, mm));
    mJeon.push(getVal("jeonse", region, yy, mm));
  }
  if (chartIndex) chartIndex.destroy();
  chartIndex = new Chart(document.getElementById("mk-index"), {
    type: "line",
    data: { labels: mLabels, datasets: [
      { label: "매매지수", data: mSale, borderColor: cUp, borderWidth: 2, pointRadius: 0, tension: .1 },
      { label: "전세지수", data: mJeon, borderColor: cBrand, borderWidth: 2, pointRadius: 0, tension: .1 }
    ]},
    options: chartOpts("")
  });

  var tb = document.querySelector("#mk-table tbody");
  tb.innerHTML = rows.slice().reverse().map(function (r) {
    var yLabel = (r.y === e[0] && e[1] !== 12) ? r.y + " (~" + e[1] + "월)" : String(r.y);
    return "<tr><td>" + yLabel + "</td>" +
      '<td class="' + cls(r.sale) + '">' + pct(r.sale) + "</td>" +
      '<td class="' + cls(r.jeonse) + '">' + pct(r.jeonse) + "</td>" +
      "<td>" + (r.saleIdx != null ? r.saleIdx.toFixed(1) : "—") + "</td>" +
      "<td>" + (r.jeonseIdx != null ? r.jeonseIdx.toFixed(1) : "—") + "</td></tr>";
  }).join("");

  var by = {};
  rows.forEach(function (r) { by[r.y] = r; });
  var out = [];
  for (var y2 = lastY; y2 - 1 >= firstY; y2 -= 2) {
    var a = by[y2 - 1], b = by[y2];
    if (!a || !b || a.sale == null || b.sale == null) continue;
    var comp = ((1 + a.sale / 100) * (1 + b.sale / 100) - 1) * 100;
    var arith = a.sale + b.sale;
    var compJ = (a.jeonse != null && b.jeonse != null)
      ? ((1 + a.jeonse / 100) * (1 + b.jeonse / 100) - 1) * 100 : null;
    var label = (y2 - 1) + "–" + ((y2 === e[0] && e[1] !== 12) ? y2 + "." + e[1] : y2);
    out.push({ label: label, comp: comp, arith: arith, compJ: compJ,
               diff: compJ != null ? comp - compJ : null });
  }
  var tb2 = document.querySelector("#mk-table2 tbody");
  tb2.innerHTML = out.map(function (r) {
    return "<tr><td>" + r.label + "</td>" +
      '<td class="' + cls(r.comp) + '">' + pct(r.comp) + "</td>" +
      "<td>" + pct(r.arith) + "</td>" +
      '<td class="' + cls(r.compJ) + '">' + pct(r.compJ) + "</td>" +
      '<td class="' + cls(r.diff) + '">' + pct(r.diff) + "</td></tr>";
  }).join("");
}

function chartOpts(unit) {
  return {
    responsive: true, maintainAspectRatio: false, animation: false,
    interaction: { mode: "index", intersect: false },
    plugins: {
      legend: { labels: { boxWidth: 12, font: { family: "Pretendard Variable", size: 11 } } },
      tooltip: { callbacks: { label: function (c) {
        var v = c.parsed.y;
        return c.dataset.label + ": " + (v == null ? "—" : v.toFixed(1) + unit);
      } } }
    },
    scales: {
      x: { ticks: { maxTicksLimit: 10, font: { size: 10 } }, grid: { display: false } },
      y: { ticks: { font: { size: 10 }, callback: function (v) { return v + unit; } },
           grid: { color: "#eef1f5" } }
    }
  };
}
</script>
