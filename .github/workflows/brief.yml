name: 지금 시장 데이터 갱신

# 매일 03:00 KST (= 전날 18:00 UTC). GitHub 예약 작업은 몇 분 늦게 돌 수 있습니다.
on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:        # Actions 탭에서 [Run workflow]로 바로 돌릴 수 있습니다

permissions:
  contents: write
  issues: write          # 수동 목록에 반영할 소식이 생기면 이슈로 알림 (v7.8)

concurrency:
  group: brief
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: 최근 30일 실거래 요약 만들기
        env:
          SITE: https://track-apt.vercel.app
          CONC: "3"
          BACKFILL_MONTHS: "12"   # 역대 최고가 장부를 하룻밤에 과거로 넓히는 개월 수 (호출 한도가 빠듯하면 6으로)
        run: node scripts/brief_build.js
      - name: 월별 저장본 자동 잇기 (market_core.json)
        if: always()
        run: node scripts/core_build.js
      - name: 금리·임금·대책·교통·대출 자료 만들기
        if: always()          # 실거래 수집이 실패해도 이쪽은 따로 돈다
        env:
          ECOS_KEY: ${{ secrets.ECOS_KEY }}     # 한국은행 ECOS Open API 키 (GitHub → Settings → Secrets)
          KOSIS_KEY: ${{ secrets.KOSIS_KEY }}   # 통계청 KOSIS Open API 키
          INBOX_NOTE: ${{ runner.temp }}/trackapt_inbox_new.md
        run: node scripts/macro_build.js
      - name: 학군 자료 만들기 (OpenAPI 기본정보·학생수 + data/school CSV)
        if: always()
        env:
          SCHOOLINFO_API_KEY: ${{ secrets.SCHOOLINFO_API_KEY }}   # 학교알리미 → 알리미 소식 → OpenAPI 에서 발급(무료)
        run: node scripts/school_build.js
      - name: 수동 목록 확인 필요 → 이슈로 알림
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          F="${RUNNER_TEMP}/trackapt_inbox_new.md"
          [ -s "$F" ] || { echo "새 확인 항목 없음"; exit 0; }
          gh issue create --title "확인 필요: 수동 목록(data/manual) 반영할 소식 $(date -u -d '+9 hours' '+%m.%d')" --body-file "$F" --label "확인 필요" 2>/dev/null \
            || gh issue create --title "확인 필요: 수동 목록(data/manual) 반영할 소식 $(date -u -d '+9 hours' '+%m.%d')" --body-file "$F" || echo "이슈 생성 실패(무시)"
      - name: 바뀐 게 있으면 커밋
        if: always()
        run: |
          git config user.name "trackapt-bot"
          git config user.email "trackapt-bot@users.noreply.github.com"
          for f in brief_data.json macro_data.json market_core.json data/highs data/brief_hist.json data/macro_codes.json data/macro_debug.json data/monthly data/market_core_base.json data/manual/_inbox.json school_data.json; do [ -e "$f" ] && git add "$f"; done
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "brief: $(date -u -d '+9 hours' '+%Y-%m-%d %H:%M') KST 자동 갱신"
          # 수집하는 5~15분 사이에 다른 커밋(파일 업로드 등)이 올라왔으면 그 위에 얹어서 올린다
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            echo "올리기 재시도 $i"; sleep 5
          done
          exit 1
